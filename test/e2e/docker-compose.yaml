# Docker Compose for E2E testing with external dependencies
#
# Usage:
#   docker-compose -f test/e2e/docker-compose.yaml up -d
#   go test -tags=e2e -v ./test/e2e/...
#   docker-compose -f test/e2e/docker-compose.yaml down

services:
  # PostgreSQL for database action testing.
  #
  # Pinned to 16 by slice 4.4c. It said 15-alpine, which contradicted the
  # supported matrix (docs/operations/SUPPORTED-1.0.md:22 locks PostgreSQL 16)
  # and reintroduced exactly the client/server major-version class of bug
  # scripts/pgdump-roundtrip.sh:123-139 exists to refuse: a workstation that
  # brings this stack up gets a 15 server, and any dump taken against it with
  # the 16 client the rest of the repo requires is unrestorable.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fi_fhir_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d fi_fhir_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # HAPI FHIR server for FHIR action testing
  fhir:
    image: hapiproject/hapi:latest
    environment:
      HAPI_FHIR_VALIDATION_REQUESTS_ENABLED: "false"
      HAPI_FHIR_ALLOW_EXTERNAL_REFERENCES: "true"
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/fhir/metadata"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Kafka for queue action testing
  kafka:
    image: bitnami/kafka:3.6
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis for testing (optional caching)
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Jaeger for tracing validation
  jaeger:
    image: jaegertracing/all-in-one:1.52
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16687:16686"  # UI
      - "4318:4318"    # OTLP HTTP
      - "4317:4317"    # OTLP gRPC

  # Mock webhook server for testing
  webhook:
    image: mendhak/http-https-echo:31
    ports:
      - "8888:8080"

volumes:
  postgres_data:
