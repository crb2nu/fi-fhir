# Cerner ADT Template
#
# Cerner feeds can vary widely by implementation (and middleware). This template
# enables a slightly more tolerant parsing mode, while still encouraging you to
# tighten the profile once you have representative samples.

source_profile:
  id: cerner_adt_template
  name: Cerner ADT Template
  version: "0.1.0"

  hl7v2:
    default_version: "2.3.1"
    timezone: "UTC"

    encoding:
      charset_default: "UTF-8"
      charset_detection: true
      line_ending_mode: "tolerant"

    tolerate:
      missing_segments:
        - "PV1"
        - "PD1"
        - "NK1"
      nte_anywhere: true
      extra_components: true
      unknown_segments: true
      non_standard_delimiters: true

    datatypes:
      xcn_component_count: "flexible"
      cx_component_count: "flexible"
      xpn_component_count: "flexible"

    event_classification:
      adt_a01:
        default: "patient_admit"
      adt_a08:
        default: "patient_update"

  z_segments:
    preserve_raw: true
    mappings:
      ZVN:
        - field: 1
          target: "encounter.custom.visit_number"
          type: "string"

