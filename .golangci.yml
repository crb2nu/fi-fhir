version: "2"

run:
  timeout: 10m
  tests: true

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true

formatters:
  enable:
    - gofmt
    - goimports
  # Note: goimports local-prefixes disabled to avoid conflict with gqlgen import ordering

linters:
  default: none
  enable:
    # Default linters (gosimple and stylecheck are now part of staticcheck)
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Security and correctness linters (critical)
    - bodyclose
    - nilerr
    - rowserrcheck
    - sqlclosecheck

    # Style linters (minimal set)
    - dogsled
    - errname
    # - misspell  # Disabled: too many false positives for UMLS terminology (RELA, etc.)
    - nakedret
    - nolintlint
    - predeclared
    - unconvert
    - whitespace

    # Error handling
    - errorlint
    - errcheck

    # Security
    - gosec

    # Disabled for now (too noisy, re-enable incrementally):
    # - dupl          # 15 issues - intentional duplication in parsers
    # - exhaustive    # 16 issues - enum exhaustiveness
    # - gochecknoinits # 1 issue - init functions
    # - goconst       # 50 issues - magic strings
    # - gocritic      # 18 issues - opinionated
    # - gocyclo       # 19 issues - complexity
    # - godot         # 10 issues - comment periods
    # - goprintffuncname # 1 issue
    # - noctx         # 16 issues - context propagation
    # - prealloc      # 13 issues - performance hints
    # - revive        # 50 issues - style rules
    # - tparallel     # test parallelism
    # - unparam       # 10 issues - unused params

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false  # Reduce noise from intentional _ = err patterns

    govet:
      enable-all: true
      disable:
        - fieldalignment
        # Re-enable incrementally (these were not effectively active under the v1→v2 config):
        - shadow       # 7 issues — minioSink/ok variable shadowing
        - unusedwrite  # 33 issues — test struct field writes
        - nilness      # 2 issues — tautological nil checks

    staticcheck:
      checks:
        # Stylistic WriteString(fmt.Sprintf(...)) quick-fix; keep this security
        # baseline focused and re-enable through a dedicated cleanup slice.
        - -QF1012

    # Settings for disabled linters (kept for future re-enablement):
    # gocyclo:
    #   min-complexity: 15
    # goconst:
    #   min-len: 3
    #   min-occurrences: 3
    # gocritic:
    #   enabled-tags: [diagnostic, experimental, opinionated, performance, style]
    #   disabled-checks: [dupImport, ifElseChain, octalLiteral, whyNoLint]

    gosec:
      excludes:
        - G104  # Audit errors not checked (handled by errcheck)
        - G201  # SQL string formatting with trusted internal table names
        - G304  # File path provided as taint input (necessary for config files)
        - G301  # Directory permissions 0755 acceptable for non-sensitive dirs
        - G302  # File permissions 0644 acceptable for log/data files
        - G306  # WriteFile permissions 0644 acceptable for non-sensitive files
        - G115  # Integer overflow conversion - handled by bounds
        - G404  # Weak random is fine for non-crypto uses (load testing)
        - G101  # False positives on hardcoded credentials in tests
        - G602  # False positives on bounded CLI arg parsing loops (switch/args[i])
        - G110  # Decompression bomb — ETL sink processes trusted internal data
        # G703 (path traversal taint) and G704 (SSRF taint) are standalone gosec rules
        # not recognized by golangci-lint's schema. Excluded via text rules below.

    # misspell: (disabled — re-enable with RELA ignore-words when linter is enabled)
    #   locale: US

    nakedret:
      max-func-lines: 30

    # prealloc: (disabled)
    #   simple: true
    #   range-loops: true
    #   for-loops: false

    # revive: (disabled - too many style rules)

  exclusions:
    # Presets provide common exclusion patterns (v2 replaces v1 default exclusions)
    # legacy: restores v1 default exclusion behavior for backward compatibility
    presets:
      - legacy
      - common-false-positives
    rules:
      # Exclude some linters from running on test files
      - path: '.*_test\.go$'
        linters:
          - dupl
          - goconst
          - gosec
          - errcheck
          - errorlint
          - dogsled

      # RELA is a standard UMLS field name (Relationship Attribute), not a misspelling
      # Disable misspell for terminology/db since it has many UMLS-specific terms
      - path: '.*pkg/terminology/db/.*'
        linters:
          - misspell

      # gosec G201: SQL formatting with trusted internal table names (not user input)
      - path: '.*pkg/terminology/db/.*'
        linters:
          - gosec
        text: "G201"

      # Exclude shadow check for err
      - linters:
          - govet
        text: 'shadow: declaration of "err"'

      # Allow fmt.Println in main
      - path: cmd/
        linters:
          - forbidigo

      # gosec: File permissions are acceptable for non-sensitive data files
      - linters:
          - gosec
        text: "G301|G302|G306"

      # gosec: File path via variable is necessary for config loading
      - linters:
          - gosec
        text: "G304"

      # gosec: math/rand is fine for non-crypto uses (jitter, load testing)
      - linters:
          - gosec
        text: "G404"

      # gosec: Unhandled errors handled by errcheck
      - linters:
          - gosec
        text: "G104"

      # gosec: Integer overflow handled by bounds
      - linters:
          - gosec
        text: "G115"

      # gosec: CLI arg parsing loops in cmd/fi-fhir trigger false-positive bounds checks
      - path: 'cmd/fi-fhir/.*'
        linters:
          - gosec
        text: "G602"

      # gosec: False positives for hardcoded credentials in tests
      - linters:
          - gosec
        text: "G101"

      # gosec: Path traversal taint — CLI tool file paths come from user args
      - linters:
          - gosec
        text: "G703"

      # gosec: SSRF taint — HTTP clients use configured endpoints from trusted config
      - linters:
          - gosec
        text: "G704"

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
