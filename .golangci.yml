version: "2"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/crb2nu/fi-fhir

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true

linters:
  disable-all: true
  enable:
    # Default linters (gosimple and stylecheck are now part of staticcheck)
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Security and correctness linters (critical)
    - bodyclose
    - nilerr
    - rowserrcheck
    - sqlclosecheck

    # Style linters (minimal set)
    - dogsled
    - errname
    - misspell
    - nakedret
    - nolintlint
    - predeclared
    - unconvert
    - whitespace

    # Error handling
    - errorlint
    - errcheck

    # Security
    - gosec

    # Disabled for now (too noisy, re-enable incrementally):
    # - errcheck      # 50 issues - unchecked errors (enable after other fixes)
    # - dupl          # 15 issues - intentional duplication in parsers
    # - exhaustive    # 16 issues - enum exhaustiveness
    # - gochecknoinits # 1 issue - init functions
    # - goconst       # 50 issues - magic strings
    # - gocritic      # 18 issues - opinionated
    # - gocyclo       # 19 issues - complexity
    # - godot         # 10 issues - comment periods
    # - goprintffuncname # 1 issue
    # - noctx         # 16 issues - context propagation
    # - prealloc      # 13 issues - performance hints
    # - revive        # 50 issues - style rules
    # - tparallel     # test parallelism
    # - unparam       # 10 issues - unused params

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false  # Reduce noise from intentional _ = err patterns

  govet:
    enable-all: true
    disable:
      - fieldalignment

  # Settings for disabled linters (kept for future re-enablement):
  # gocyclo:
  #   min-complexity: 15
  # goconst:
  #   min-len: 3
  #   min-occurrences: 3
  # gocritic:
  #   enabled-tags: [diagnostic, experimental, opinionated, performance, style]
  #   disabled-checks: [dupImport, ifElseChain, octalLiteral, whyNoLint]

  gosec:
    excludes:
      - G104  # Audit errors not checked (handled by errcheck)
      - G304  # File path provided as taint input (necessary for config files)
      - G301  # Directory permissions 0755 acceptable for non-sensitive dirs
      - G302  # File permissions 0644 acceptable for log/data files
      - G306  # WriteFile permissions 0644 acceptable for non-sensitive files
      - G115  # Integer overflow conversion - handled by bounds
      - G404  # Weak random is fine for non-crypto uses (load testing)
      - G101  # False positives on hardcoded credentials in tests

  misspell:
    locale: US

  nakedret:
    max-func-lines: 30

  # prealloc: (disabled)
  #   simple: true
  #   range-loops: true
  #   for-loops: false

  # revive: (disabled - too many style rules)

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - dupl
        - goconst
        - gosec
        - errcheck

    # Exclude shadow check for err
    - linters:
        - govet
      text: 'shadow: declaration of "err"'

    # Allow fmt.Println in main
    - path: cmd/
      linters:
        - forbidigo

    # gosec: File permissions are acceptable for non-sensitive data files
    - linters:
        - gosec
      text: "G301|G302|G306"

    # gosec: File path via variable is necessary for config loading
    - linters:
        - gosec
      text: "G304"

    # gosec: math/rand is fine for non-crypto uses (jitter, load testing)
    - linters:
        - gosec
      text: "G404"

    # gosec: Unhandled errors handled by errcheck
    - linters:
        - gosec
      text: "G104"

    # gosec: Integer overflow handled by bounds
    - linters:
        - gosec
      text: "G115"

    # gosec: False positives for hardcoded credentials in tests
    - linters:
        - gosec
      text: "G101"

  max-issues-per-linter: 50
  max-same-issues: 10
