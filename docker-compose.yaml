# docker-compose.yaml
# Local development environment for fi-fhir
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up fi-fhir         # Start fi-fhir only
#   docker-compose logs -f fi-fhir    # Follow logs
#   docker-compose down               # Stop all services
#   docker-compose down -v            # Stop and remove volumes

services:
  # fi-fhir application
  fi-fhir:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: fi-fhir:${VERSION:-dev}
    container_name: fi-fhir
    command: ["serve"]
    ports:
      - "8080:8080"   # HTTP API
      - "9090:9090"   # Metrics
    environment:
      # Server
      FI_FHIR_SERVER_HOST: "0.0.0.0"
      FI_FHIR_SERVER_PORT: "8080"
      # Local full-IDE operator. integration:preview opens the stateless preview;
      # graphql:operator is the temporary compatibility grant for the remaining
      # IDE roots. Production preview manifests deliberately stay narrower.
      FI_FHIR_DEPLOYMENT_TENANT_ID: "tenant-a"
      FI_FHIR_GRAPHQL_BEARER_TOKEN: "${FI_FHIR_GRAPHQL_BEARER_TOKEN:?Set a random local preview bearer token}"
      FI_FHIR_GRAPHQL_PRINCIPAL_ID: "local-operator"
      FI_FHIR_GRAPHQL_ROLES: "integration:preview,graphql:operator"
      FI_FHIR_GRAPHQL_ALLOWED_ORIGINS: "http://localhost:3001,http://localhost:5173"
      FI_FHIR_INTEGRATION_REGISTRY_PATH: "/app/testdata/golden/integration/adt-http/preview-registry.json"
      # Optional durable HL7v2 ingress. Empty AUTH_MODE keeps it unmounted.
      FI_FHIR_HTTP_INGRESS_AUTH_MODE: "${FI_FHIR_HTTP_INGRESS_AUTH_MODE:-}"
      FI_FHIR_HTTP_INGRESS_PRINCIPAL_ID: "${FI_FHIR_HTTP_INGRESS_PRINCIPAL_ID:-}"
      FI_FHIR_HTTP_INGRESS_INTEGRATION_ID: "${FI_FHIR_HTTP_INGRESS_INTEGRATION_ID:-}"
      FI_FHIR_HTTP_INGRESS_SECRET: "${FI_FHIR_HTTP_INGRESS_SECRET:-}"
      FI_FHIR_HTTP_INGRESS_SECRET_FILE: "${FI_FHIR_HTTP_INGRESS_SECRET_FILE:-}"
      FI_FHIR_HTTP_INGRESS_OAUTH_ISSUER_URL: "${FI_FHIR_HTTP_INGRESS_OAUTH_ISSUER_URL:-}"
      FI_FHIR_HTTP_INGRESS_OAUTH_AUDIENCE: "${FI_FHIR_HTTP_INGRESS_OAUTH_AUDIENCE:-}"
      FI_FHIR_HTTP_INGRESS_OAUTH_TENANT_CLAIM: "${FI_FHIR_HTTP_INGRESS_OAUTH_TENANT_CLAIM:-}"
      FI_FHIR_HTTP_INGRESS_OAUTH_ROLES_CLAIM: "${FI_FHIR_HTTP_INGRESS_OAUTH_ROLES_CLAIM:-}"
      FI_FHIR_HTTP_INGRESS_OAUTH_CLIENT_ID_CLAIM: "${FI_FHIR_HTTP_INGRESS_OAUTH_CLIENT_ID_CLAIM:-}"
      FI_FHIR_HTTP_INGRESS_OAUTH_SIGNING_ALGS: "${FI_FHIR_HTTP_INGRESS_OAUTH_SIGNING_ALGS:-}"
      FI_FHIR_HTTP_INGRESS_OAUTH_ALLOWED_CLIENT_IDS: "${FI_FHIR_HTTP_INGRESS_OAUTH_ALLOWED_CLIENT_IDS:-}"
      FI_FHIR_HTTP_INGRESS_MAX_BODY_BYTES: "${FI_FHIR_HTTP_INGRESS_MAX_BODY_BYTES:-}"
      # Optional deployed MLLP listener. Empty SOURCE_CONFIG_PATH keeps it off.
      # REQUIRE_CLIENT_IDENTITY refuses to start unless the immutable source
      # revision declares verified client-certificate service identities.
      FI_FHIR_MLLP_SOURCE_CONFIG_PATH: "${FI_FHIR_MLLP_SOURCE_CONFIG_PATH:-}"
      FI_FHIR_MLLP_DEFINITION_ID: "${FI_FHIR_MLLP_DEFINITION_ID:-}"
      FI_FHIR_MLLP_PRINCIPAL_ID: "${FI_FHIR_MLLP_PRINCIPAL_ID:-}"
      FI_FHIR_MLLP_REQUIRE_CLIENT_IDENTITY: "${FI_FHIR_MLLP_REQUIRE_CLIENT_IDENTITY:-}"
      FI_FHIR_MLLP_TLS_CERT_FILE: "${FI_FHIR_MLLP_TLS_CERT_FILE:-}"
      FI_FHIR_MLLP_TLS_KEY_FILE: "${FI_FHIR_MLLP_TLS_KEY_FILE:-}"
      FI_FHIR_MLLP_TLS_CLIENT_CA_FILE: "${FI_FHIR_MLLP_TLS_CLIENT_CA_FILE:-}"
      # Optional deployed S3/SFTP batch source. Empty SOURCE_CONFIG_PATH keeps
      # it off. REQUIRE_WORKLOAD_IDENTITY refuses to start unless the immutable
      # source revision declares its canonical workload subject. Prefer the
      # _FILE variants in production; the inline values exist for local runs.
      FI_FHIR_BATCH_SOURCE_CONFIG_PATH: "${FI_FHIR_BATCH_SOURCE_CONFIG_PATH:-}"
      FI_FHIR_BATCH_DEFINITION_ID: "${FI_FHIR_BATCH_DEFINITION_ID:-}"
      FI_FHIR_BATCH_PRINCIPAL_ID: "${FI_FHIR_BATCH_PRINCIPAL_ID:-}"
      FI_FHIR_BATCH_REQUIRE_WORKLOAD_IDENTITY: "${FI_FHIR_BATCH_REQUIRE_WORKLOAD_IDENTITY:-}"
      FI_FHIR_BATCH_WORKER_ID: "${FI_FHIR_BATCH_WORKER_ID:-}"
      FI_FHIR_BATCH_S3_ACCESS_KEY: "${FI_FHIR_BATCH_S3_ACCESS_KEY:-}"
      FI_FHIR_BATCH_S3_ACCESS_KEY_FILE: "${FI_FHIR_BATCH_S3_ACCESS_KEY_FILE:-}"
      FI_FHIR_BATCH_S3_SECRET_KEY: "${FI_FHIR_BATCH_S3_SECRET_KEY:-}"
      FI_FHIR_BATCH_S3_SECRET_KEY_FILE: "${FI_FHIR_BATCH_S3_SECRET_KEY_FILE:-}"
      FI_FHIR_BATCH_SFTP_KNOWN_HOSTS_FILE: "${FI_FHIR_BATCH_SFTP_KNOWN_HOSTS_FILE:-}"
      FI_FHIR_BATCH_SFTP_PASSWORD: "${FI_FHIR_BATCH_SFTP_PASSWORD:-}"
      FI_FHIR_BATCH_SFTP_PASSWORD_FILE: "${FI_FHIR_BATCH_SFTP_PASSWORD_FILE:-}"
      FI_FHIR_BATCH_SFTP_PRIVATE_KEY_FILE: "${FI_FHIR_BATCH_SFTP_PRIVATE_KEY_FILE:-}"
      FI_FHIR_BATCH_SFTP_PRIVATE_KEY_PASSPHRASE: "${FI_FHIR_BATCH_SFTP_PRIVATE_KEY_PASSPHRASE:-}"
      FI_FHIR_BATCH_SFTP_PRIVATE_KEY_PASSPHRASE_FILE: "${FI_FHIR_BATCH_SFTP_PRIVATE_KEY_PASSPHRASE_FILE:-}"
      # Workflow
      FI_FHIR_WORKFLOW_CONFIG_PATH: "/app/config/adt-workflow.yaml"
      # Database
      FI_FHIR_DATABASE_DRIVER: "postgres"
      FI_FHIR_DATABASE_HOST: "postgres"
      FI_FHIR_DATABASE_PORT: "5432"
      FI_FHIR_DATABASE_NAME: "fi_fhir"
      FI_FHIR_DATABASE_USERNAME: "fi_fhir"
      FI_FHIR_DATABASE_PASSWORD: "fi_fhir_dev"
      FI_FHIR_DATABASE_SSL_MODE: "disable"
      # Queue
      FI_FHIR_QUEUE_DRIVER: "kafka"
      FI_FHIR_QUEUE_BROKERS: "kafka:9092"
      # Destination-scoped delivery identity (Slice 4.1c-a). Unset by default:
      # the durable dispatch path runs without the integration.deliver decision
      # until a deployment supplies a destination registry.
      FI_FHIR_DELIVERY_IDENTITY_MODE: "${FI_FHIR_DELIVERY_IDENTITY_MODE:-}"
      FI_FHIR_DELIVERY_IDENTITY_REGISTRY_PATH: "${FI_FHIR_DELIVERY_IDENTITY_REGISTRY_PATH:-}"
      FI_FHIR_DELIVERY_IDENTITY_SECRET_DIR: "${FI_FHIR_DELIVERY_IDENTITY_SECRET_DIR:-}"
      FI_FHIR_DELIVERY_IDENTITY_COMPATIBILITY_SUBJECT: "${FI_FHIR_DELIVERY_IDENTITY_COMPATIBILITY_SUBJECT:-}"
      # Observability
      FI_FHIR_METRICS_ENABLED: "true"
      FI_FHIR_METRICS_PORT: "9090"
      FI_FHIR_LOG_LEVEL: "debug"
      FI_FHIR_LOG_FORMAT: "json"
      # FI_FHIR_TRACING_* is NOT IMPLEMENTED: pkg/config parses and validates it,
      # but no OpenTelemetry exporter consumes it in the serve path. Setting it
      # here advertised a capability the process does not have. Removed by slice
      # 4.4a; the exporter itself is 4.4d. scripts/check-runtime-config.sh fails
      # if any deployment artifact sets it again without that label.
      # Qdrant
      QDRANT_URL: "http://qdrant:6333"
      # Temporal
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_NAMESPACE: "terminology-mapping"
    volumes:
      - ./configs:/app/config:ro
      - ./testdata:/app/testdata:ro
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/fi-fhir", "version"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: fi-fhir-postgres
    environment:
      POSTGRES_USER: fi_fhir
      POSTGRES_PASSWORD: fi_fhir_dev
      POSTGRES_DB: fi_fhir
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi_fhir -d fi_fhir"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # Kafka for message queue
  kafka:
    image: bitnami/kafka:3.6
    container_name: fi-fhir-kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # Qdrant vector database (for terminology semantic search)
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: fi-fhir-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # Temporal for workflow orchestration
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: fi-fhir-temporal
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: fi_fhir
      POSTGRES_PWD: fi_fhir_dev
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # HAPI FHIR Server (for development/testing)
  fhir-server:
    image: hapiproject/hapi:latest
    container_name: fi-fhir-hapi
    environment:
      HAPI_FHIR_VALIDATION_REQUESTS_ENABLED: "false"
      HAPI_FHIR_NARRATIVE_ENABLED: "false"
    ports:
      - "8090:8080"
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # Jaeger for distributed tracing.
  #
  # NOTE: fi-fhir emits no spans today — there is no OpenTelemetry exporter in
  # the serve path (slice 4.4d). This collector runs so the local stack and the
  # Grafana datasource provisioning stay complete, but its UI will be empty.
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: fi-fhir-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: fi-fhir-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # fi-fhir UI (SvelteKit + nginx)
  fi-fhir-ui:
    build: ./ui
    container_name: fi-fhir-ui
    ports:
      - "3001:3000"   # UI (3000 taken by Grafana)
    environment:
      FI_FHIR_UI_API_ORIGIN: "http://fi-fhir:8080"
    depends_on:
      - fi-fhir
    networks:
      - fi-fhir-net
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:10.2.2
    container_name: fi-fhir-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./dashboards/grafana:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - fi-fhir-net
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  qdrant-data:
  prometheus-data:
  grafana-data:

networks:
  fi-fhir-net:
    driver: bridge
