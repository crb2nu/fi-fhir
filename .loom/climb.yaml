# .loom/climb.yaml — libs/fi-fhir (Climbs, .loom/208 §5)
version: 1
tier: 1
problem:
  text: >-
    Healthcare integration engines are closed, expensive and hard to observe. fi-fhir is an open,
    Kubernetes-native engine with profile-driven parsing, canonical events, durable ingestion and
    delivery, and a Mapping Studio. It is pre-1.0: its capabilities and tests do not yet certify
    every supported deployment profile or vendor feed, and the climb is toward a 1.0 whose
    supported matrix they do.
  source: ROADMAP.md#current-status
  since: 2026-06-01
summit:
  - id: gates
    label: Roadmap gates met (Now list)
    metric: { kind: roadmap-gates }
    target: 1
    direction: up
    unit: ratio
  - id: ci-green
    label: Main pipeline success ratio (30d)
    metric: { kind: gitlab, expr: pipeline_success_ratio }
    target: 0.95
    direction: up
    unit: ratio
  # The operator's kpi_snapshots key has no per-repo map, so the kpi kind
  # read "no readings in the window" (loom-core .loom/209 A2.9). The walk
  # kind reads fi-fhir's own press entries: enqueue to merge, p50, in hours.
  - id: lead-time
    label: Enqueue-to-merge p50 (press entries)
    metric: { kind: walk, expr: lead_time_p50_hours }
    target: 2
    direction: down
    unit: hours
composite:
  weights: { gates: 0.6, ci-green: 0.2, lead-time: 0.2 }
constraints:
  - ROADMAP.md#program-gates
  - ROADMAP.md#10-standards-and-release-scope
  - .loom/20-product-spec-integration-engine-ide-completion.md#non-goals
route: ROADMAP.md
camps: { tags: 'v*' }
