# Prometheus Alerting Rules for the fi-fhir Integration Engine
#
# These rules alert only on metrics the process actually emits (see
# internal/observability/metrics.go, exposed on FI_FHIR_METRICS_PORT at
# FI_FHIR_METRICS_ENDPOINT, default :9090/metrics). Slice 4.3 replaced the
# entire previous rule set: every earlier rule here targeted a
# `fi_fhir_workflow_*` metric name that nothing in this codebase has ever
# emitted, so none of those rules could fire. See .loom/40-decisions.md
# (2026-08-08) for the naming decision behind the current metric names.
#
# Usage:
#   1. Standalone Prometheus: Add to prometheus.yml under rule_files
#   2. Prometheus Operator: Apply as PrometheusRule CRD (see workflow-alerts-k8s.yaml)
#
# Customize thresholds based on your SLOs and traffic patterns. The
# `job="fi-fhir"` label on FiFhirScrapeTargetDown matches the job_name in
# deploy/docker/prometheus.yml; adjust it if your scrape config uses a
# different job or relabels the instance.

groups:
  - name: fi-fhir-availability
    interval: 30s
    rules:
      # Absent Scrape Target - Critical
      - alert: FiFhirScrapeTargetDown
        expr: |
          up{job="fi-fhir"} == 0
        for: 5m
        labels:
          severity: critical
          service: fi-fhir
          category: availability
        annotations:
          summary: "fi-fhir /metrics scrape target is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 5 minutes. The process may be down, or FI_FHIR_METRICS_PORT/FI_FHIR_METRICS_ENABLED may not match what this scrape config expects."

      # Component Stopped - Critical
      - alert: FiFhirComponentDown
        expr: |
          fi_fhir_component_up == 0
        for: 5m
        labels:
          severity: critical
          service: fi-fhir
          category: availability
        annotations:
          summary: "fi-fhir component {{ $labels.component }} is down"
          description: "Component {{ $labels.component }} (graphql, mllp, delivery, batch, autoroute_sweep, autoroute_notify, or session_stream) is configured but not running, for 5 minutes. Check process logs for a crashed listener or worker goroutine."

      # Readiness Dependency Unhealthy - Critical
      - alert: FiFhirReadinessComponentUnhealthy
        expr: |
          fi_fhir_readiness_up == 0
        for: 5m
        labels:
          severity: critical
          service: fi-fhir
          category: availability
        annotations:
          summary: "fi-fhir readiness dependency {{ $labels.component }} is unhealthy"
          description: "GET /ready has been reporting {{ $labels.component }} unhealthy for 5 minutes. The Kubernetes readiness probe returns 503 for this condition, so the Service has likely stopped routing to affected pods."

  - name: fi-fhir-ingress
    interval: 30s
    rules:
      # HTTP Ingress Error Rate - Warning
      - alert: FiFhirIngressErrorRate
        expr: |
          (
            sum(rate(fi_fhir_http_ingress_submissions_total{outcome="error"}[5m]))
            /
            sum(rate(fi_fhir_http_ingress_submissions_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          service: fi-fhir
          category: ingress
        annotations:
          summary: "Elevated HTTP ingress error rate"
          description: "{{ $value | humanizePercentage }} of authenticated HL7v2 HTTP ingress submissions are failing with an infrastructure error (threshold 5%). This excludes caller validation rejections (outcome=rejected); check downstream database and queue health."

      # MLLP Rejection/Error Rate - Warning
      - alert: FiFhirMLLPRejectionRate
        expr: |
          (
            sum(rate(fi_fhir_mllp_messages_total{outcome=~"rejected|error"}[10m]))
            /
            sum(rate(fi_fhir_mllp_messages_total[10m]))
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: ingress
        annotations:
          summary: "Elevated MLLP message rejection rate"
          description: "{{ $value | humanizePercentage }} of MLLP frames are being rejected or erroring (threshold 10%). Check the sending system's message format and, if FI_FHIR_MLLP_REQUIRE_CLIENT_IDENTITY is set, its TLS client certificate."

  - name: fi-fhir-delivery
    interval: 30s
    rules:
      # Delivery Failure Rate - Critical
      - alert: FiFhirDeliveryFailureRate
        expr: |
          (
            sum(rate(fi_fhir_delivery_attempts_total{outcome=~"failed|error"}[10m]))
            /
            sum(rate(fi_fhir_delivery_attempts_total[10m]))
          ) > 0.05
        for: 10m
        labels:
          severity: critical
          service: fi-fhir
          category: delivery
        annotations:
          summary: "Elevated outbound delivery failure rate"
          description: "{{ $value | humanizePercentage }} of delivery dispatch cycles are ending in a terminal failure (outcome=failed) or infrastructure error (outcome=error), threshold 5%. fi-fhir has no dead-letter-queue-depth metric; this ratio is the closest available signal that outbound delivery is not keeping up. Check the downstream endpoint and dispatcher logs."

      # Batch Object Failure Rate - Warning
      - alert: FiFhirBatchFailureRate
        expr: |
          (
            sum(rate(fi_fhir_batch_objects_total{outcome="failed"}[15m]))
            /
            sum(rate(fi_fhir_batch_objects_total[15m]))
          ) > 0.1
        for: 15m
        labels:
          severity: warning
          service: fi-fhir
          category: delivery
        annotations:
          summary: "Elevated batch ingestion failure rate"
          description: "{{ $value | humanizePercentage }} of batch objects are failing to process (threshold 10%). Check S3/SFTP source connectivity, credentials, and object format."

      # Session Stream Drop/Error Rate - Warning
      - alert: FiFhirSessionStreamErrorRate
        expr: |
          (
            sum(rate(fi_fhir_session_stream_events_total{outcome=~"dropped|error"}[10m]))
            /
            sum(rate(fi_fhir_session_stream_events_total[10m]))
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: delivery
        annotations:
          summary: "Integration Session stream is dropping or erroring events"
          description: "{{ $value | humanizePercentage }} of Integration Session stream events are dropped or erroring (threshold 5%). Connected UI clients may be missing live session updates; check the durable stream log and hub fanout."

  - name: fi-fhir-autoroute
    interval: 30s
    rules:
      # Autoroute Expiry Sweep Failing - Warning
      - alert: FiFhirAutorouteSweepFailureRate
        expr: |
          sum(rate(fi_fhir_autoroute_sweeps_total{outcome="error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: fi-fhir
          category: autoroute
        annotations:
          summary: "Pending autoroute expiry sweep is failing"
          description: "The pending-autoroute expiry sweep has been erroring for 15 minutes. Pending terminology review items may not be expiring on schedule; check sweeper logs and submission_db connectivity."

      # Autoroute Review Notifications Failing - Warning
      - alert: FiFhirAutorouteNotificationFailureRate
        expr: |
          sum(rate(fi_fhir_autoroute_notifications_total{outcome=~"failed|error"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
          service: fi-fhir
          category: autoroute
        annotations:
          summary: "Pending autoroute review notifications are failing"
          description: "Pending-review notifications have been failing to send or erroring for 15 minutes; on-call reviewers may not be alerted to new items awaiting terminology mapping. Check the notification dispatch queue and delivery target."
