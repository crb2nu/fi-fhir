# Prometheus Alerting Rules for fi-fhir Workflow Engine
#
# Usage:
#   1. Standalone Prometheus: Add to prometheus.yml under rule_files
#   2. Prometheus Operator: Apply as PrometheusRule CRD (see workflow-alerts-k8s.yaml)
#
# Customize thresholds based on your SLOs and traffic patterns.

groups:
  - name: fi-fhir-workflow-availability
    interval: 30s
    rules:
      # High Error Rate - Critical
      - alert: WorkflowHighErrorRate
        expr: |
          (
            sum(rate(fi_fhir_workflow_events_processed_total{success="false"}[5m]))
            /
            sum(rate(fi_fhir_workflow_events_processed_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          service: fi-fhir
          category: availability
        annotations:
          summary: "High workflow event error rate"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 5%). Check action failures and external service health."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/high-error-rate"

      # Action Failures - Warning
      - alert: WorkflowActionFailures
        expr: |
          sum(rate(fi_fhir_workflow_actions_executed_total{success="false"}[5m])) by (action_type, route_name) > 0.1
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: availability
        annotations:
          summary: "Workflow action failures detected"
          description: "Action {{ $labels.action_type }} on route {{ $labels.route_name }} is failing at {{ $value | humanize }} failures/sec."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/action-failures"

      # No Events Processed - Warning
      - alert: WorkflowNoEventsProcessed
        expr: |
          sum(rate(fi_fhir_workflow_events_processed_total[15m])) == 0
        for: 30m
        labels:
          severity: warning
          service: fi-fhir
          category: availability
        annotations:
          summary: "No workflow events processed"
          description: "No events have been processed in the last 30 minutes. Check upstream data sources."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/no-events"

  - name: fi-fhir-workflow-latency
    interval: 30s
    rules:
      # High Event Processing Latency - Warning
      - alert: WorkflowHighEventLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(fi_fhir_workflow_events_processed_duration_seconds_bucket[5m])) by (le)
          ) > 5
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: latency
        annotations:
          summary: "High workflow event processing latency"
          description: "p99 event processing latency is {{ $value | humanizeDuration }} (threshold: 5s)."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/high-latency"

      # High Action Latency - Warning
      - alert: WorkflowHighActionLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(fi_fhir_workflow_actions_executed_duration_seconds_bucket[5m])) by (le, action_type)
          ) > 10
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: latency
        annotations:
          summary: "High workflow action latency"
          description: "p99 latency for action {{ $labels.action_type }} is {{ $value | humanizeDuration }} (threshold: 10s)."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/action-latency"

      # HTTP Request Latency - Warning
      - alert: WorkflowHighHTTPLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(fi_fhir_workflow_http_requests_duration_seconds_bucket[5m])) by (le, endpoint)
          ) > 5
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: latency
        annotations:
          summary: "High HTTP request latency"
          description: "p99 HTTP latency to {{ $labels.endpoint }} is {{ $value | humanizeDuration }}."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/http-latency"

  - name: fi-fhir-workflow-resilience
    interval: 30s
    rules:
      # Circuit Breaker Open - Critical
      - alert: WorkflowCircuitBreakerOpen
        expr: |
          sum(increase(fi_fhir_workflow_circuit_breaker_state_changes_total{to_state="open"}[5m])) by (endpoint) > 0
        for: 1m
        labels:
          severity: critical
          service: fi-fhir
          category: resilience
        annotations:
          summary: "Circuit breaker opened"
          description: "Circuit breaker for {{ $labels.endpoint }} has opened. External service may be unavailable."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/circuit-breaker-open"

      # Circuit Breaker Rejections - Warning
      - alert: WorkflowCircuitBreakerRejections
        expr: |
          sum(rate(fi_fhir_workflow_circuit_breaker_rejections_total[5m])) by (endpoint) > 1
        for: 5m
        labels:
          severity: warning
          service: fi-fhir
          category: resilience
        annotations:
          summary: "Circuit breaker rejecting requests"
          description: "Circuit breaker for {{ $labels.endpoint }} is rejecting {{ $value | humanize }} requests/sec."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/circuit-breaker-rejections"

      # High Retry Rate - Warning
      - alert: WorkflowHighRetryRate
        expr: |
          sum(rate(fi_fhir_workflow_action_retries_total[5m])) by (action_type, route_name)
          /
          sum(rate(fi_fhir_workflow_actions_executed_total[5m])) by (action_type, route_name)
          > 0.3
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: resilience
        annotations:
          summary: "High action retry rate"
          description: "{{ $value | humanizePercentage }} of {{ $labels.action_type }} actions on {{ $labels.route_name }} are being retried."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/high-retry-rate"

      # Rate Limiting Active - Info
      - alert: WorkflowRateLimitingActive
        expr: |
          sum(rate(fi_fhir_workflow_rate_limit_waits_total[5m])) by (endpoint) > 1
        for: 15m
        labels:
          severity: info
          service: fi-fhir
          category: resilience
        annotations:
          summary: "Rate limiting active"
          description: "Rate limiting is throttling requests to {{ $labels.endpoint }} at {{ $value | humanize }} waits/sec."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/rate-limiting"

      # Rate Limit Rejections - Warning
      - alert: WorkflowRateLimitRejections
        expr: |
          sum(rate(fi_fhir_workflow_rate_limit_rejections_total[5m])) by (endpoint) > 0.5
        for: 5m
        labels:
          severity: warning
          service: fi-fhir
          category: resilience
        annotations:
          summary: "Rate limit rejecting requests"
          description: "Rate limiter for {{ $labels.endpoint }} is rejecting {{ $value | humanize }} requests/sec."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/rate-limit-rejections"

  - name: fi-fhir-workflow-dlq
    interval: 30s
    rules:
      # DLQ Growing - Warning
      - alert: WorkflowDLQGrowing
        expr: |
          fi_fhir_workflow_dlq_depth > 100
        for: 15m
        labels:
          severity: warning
          service: fi-fhir
          category: dlq
        annotations:
          summary: "Dead letter queue growing"
          description: "DLQ depth is {{ $value }} events. Review and reprocess failed events."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/dlq-growing"

      # DLQ Critical Depth - Critical
      - alert: WorkflowDLQCritical
        expr: |
          fi_fhir_workflow_dlq_depth > 1000
        for: 5m
        labels:
          severity: critical
          service: fi-fhir
          category: dlq
        annotations:
          summary: "Dead letter queue critical depth"
          description: "DLQ depth is {{ $value }} events. Immediate attention required."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/dlq-critical"

      # DLQ Push Rate - Warning
      - alert: WorkflowDLQHighPushRate
        expr: |
          sum(rate(fi_fhir_workflow_dlq_pushed_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
          service: fi-fhir
          category: dlq
        annotations:
          summary: "High DLQ push rate"
          description: "Events are being pushed to DLQ at {{ $value | humanize }}/sec. Check for systemic failures."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/dlq-push-rate"

      # DLQ Reprocessing Failures - Warning
      - alert: WorkflowDLQReprocessingFailures
        expr: |
          sum(rate(fi_fhir_workflow_dlq_popped_total{success="false"}[5m]))
          /
          sum(rate(fi_fhir_workflow_dlq_popped_total[5m]))
          > 0.5
        for: 15m
        labels:
          severity: warning
          service: fi-fhir
          category: dlq
        annotations:
          summary: "DLQ reprocessing failures"
          description: "{{ $value | humanizePercentage }} of DLQ reprocessing attempts are failing."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/dlq-reprocessing-failures"

  - name: fi-fhir-workflow-http
    interval: 30s
    rules:
      # HTTP 5xx Errors - Warning
      - alert: WorkflowHTTP5xxErrors
        expr: |
          sum(rate(fi_fhir_workflow_http_requests_total{status_code=~"5.."}[5m])) by (endpoint)
          /
          sum(rate(fi_fhir_workflow_http_requests_total[5m])) by (endpoint)
          > 0.1
        for: 5m
        labels:
          severity: warning
          service: fi-fhir
          category: http
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.endpoint }} are returning 5xx errors."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/http-5xx"

      # HTTP 4xx Errors - Info
      - alert: WorkflowHTTP4xxErrors
        expr: |
          sum(rate(fi_fhir_workflow_http_requests_total{status_code=~"4.."}[5m])) by (endpoint)
          /
          sum(rate(fi_fhir_workflow_http_requests_total[5m])) by (endpoint)
          > 0.2
        for: 15m
        labels:
          severity: info
          service: fi-fhir
          category: http
        annotations:
          summary: "High HTTP 4xx error rate"
          description: "{{ $value | humanizePercentage }} of requests to {{ $labels.endpoint }} are returning 4xx errors."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/http-4xx"

      # Authentication Failures - Warning
      - alert: WorkflowAuthFailures
        expr: |
          sum(rate(fi_fhir_workflow_http_requests_total{status_code="401"}[5m])) by (endpoint) > 0.1
        for: 5m
        labels:
          severity: warning
          service: fi-fhir
          category: http
        annotations:
          summary: "Authentication failures detected"
          description: "{{ $labels.endpoint }} is returning 401 Unauthorized. Check OAuth tokens and credentials."
          runbook_url: "https://docs.example.com/runbooks/fi-fhir/auth-failures"
