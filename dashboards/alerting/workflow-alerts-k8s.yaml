# PrometheusRule CRD for Kubernetes/Prometheus Operator
#
# Mirrors workflow-alerts.yaml (see that file for the full rationale on why
# every rule here targets a `fi_fhir_*` metric from
# internal/observability/metrics.go and not the legacy `fi_fhir_workflow_*`
# names the old rule set used).
#
# Usage:
#   kubectl apply -f workflow-alerts-k8s.yaml
#
# Requirements:
#   - Prometheus Operator installed
#   - Prometheus configured to select this rule via ruleSelector
#
# Customize:
#   - Update namespace to match your deployment
#   - Adjust thresholds based on your SLOs
#   - Update runbook_url to your documentation
#   - The job label on FiFhirScrapeTargetDown assumes a scrape config or
#     ServiceMonitor that labels the target job "fi-fhir"; adjust it to match
#     your Prometheus Operator relabeling if it differs.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fi-fhir-alerts
  namespace: monitoring  # Update to your namespace
  labels:
    app: fi-fhir
    prometheus: main
    role: alert-rules
spec:
  groups:
    - name: fi-fhir-availability
      interval: 30s
      rules:
        - alert: FiFhirScrapeTargetDown
          expr: |
            up{job="fi-fhir"} == 0
          for: 5m
          labels:
            severity: critical
            service: fi-fhir
            category: availability
          annotations:
            summary: "fi-fhir /metrics scrape target is down"
            description: "Prometheus has not been able to scrape {{ $labels.instance }} for 5 minutes."

        - alert: FiFhirComponentDown
          expr: |
            fi_fhir_component_up == 0
          for: 5m
          labels:
            severity: critical
            service: fi-fhir
            category: availability
          annotations:
            summary: "fi-fhir component {{ $labels.component }} is down"
            description: "Component {{ $labels.component }} is configured but not running."

        - alert: FiFhirReadinessComponentUnhealthy
          expr: |
            fi_fhir_readiness_up == 0
          for: 5m
          labels:
            severity: critical
            service: fi-fhir
            category: availability
          annotations:
            summary: "fi-fhir readiness dependency {{ $labels.component }} is unhealthy"
            description: "GET /ready has been reporting {{ $labels.component }} unhealthy for 5 minutes."

    - name: fi-fhir-ingress
      interval: 30s
      rules:
        - alert: FiFhirIngressErrorRate
          expr: |
            (
              sum(rate(fi_fhir_http_ingress_submissions_total{outcome="error"}[5m]))
              /
              sum(rate(fi_fhir_http_ingress_submissions_total[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            service: fi-fhir
            category: ingress
          annotations:
            summary: "Elevated HTTP ingress error rate"
            description: "{{ $value | humanizePercentage }} of HTTP ingress submissions are failing with an infrastructure error."

        - alert: FiFhirMLLPRejectionRate
          expr: |
            (
              sum(rate(fi_fhir_mllp_messages_total{outcome=~"rejected|error"}[10m]))
              /
              sum(rate(fi_fhir_mllp_messages_total[10m]))
            ) > 0.1
          for: 10m
          labels:
            severity: warning
            service: fi-fhir
            category: ingress
          annotations:
            summary: "Elevated MLLP message rejection rate"
            description: "{{ $value | humanizePercentage }} of MLLP frames are being rejected or erroring."

    - name: fi-fhir-delivery
      interval: 30s
      rules:
        - alert: FiFhirDeliveryFailureRate
          expr: |
            (
              sum(rate(fi_fhir_delivery_attempts_total{outcome=~"failed|error"}[10m]))
              /
              sum(rate(fi_fhir_delivery_attempts_total[10m]))
            ) > 0.05
          for: 10m
          labels:
            severity: critical
            service: fi-fhir
            category: delivery
          annotations:
            summary: "Elevated outbound delivery failure rate"
            description: "{{ $value | humanizePercentage }} of delivery dispatch cycles are ending in a terminal failure or infrastructure error. fi-fhir has no DLQ-depth metric; this is the closest available signal."

        - alert: FiFhirBatchFailureRate
          expr: |
            (
              sum(rate(fi_fhir_batch_objects_total{outcome="failed"}[15m]))
              /
              sum(rate(fi_fhir_batch_objects_total[15m]))
            ) > 0.1
          for: 15m
          labels:
            severity: warning
            service: fi-fhir
            category: delivery
          annotations:
            summary: "Elevated batch ingestion failure rate"
            description: "{{ $value | humanizePercentage }} of batch objects are failing to process."

        - alert: FiFhirSessionStreamErrorRate
          expr: |
            (
              sum(rate(fi_fhir_session_stream_events_total{outcome=~"dropped|error"}[10m]))
              /
              sum(rate(fi_fhir_session_stream_events_total[10m]))
            ) > 0.05
          for: 10m
          labels:
            severity: warning
            service: fi-fhir
            category: delivery
          annotations:
            summary: "Integration Session stream is dropping or erroring events"
            description: "{{ $value | humanizePercentage }} of session stream events are dropped or erroring."

    - name: fi-fhir-autoroute
      interval: 30s
      rules:
        - alert: FiFhirAutorouteSweepFailureRate
          expr: |
            sum(rate(fi_fhir_autoroute_sweeps_total{outcome="error"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: fi-fhir
            category: autoroute
          annotations:
            summary: "Pending autoroute expiry sweep is failing"
            description: "The pending-autoroute expiry sweep has been erroring for 15 minutes."

        - alert: FiFhirAutorouteNotificationFailureRate
          expr: |
            sum(rate(fi_fhir_autoroute_notifications_total{outcome=~"failed|error"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: fi-fhir
            category: autoroute
          annotations:
            summary: "Pending autoroute review notifications are failing"
            description: "Pending-review notifications have been failing to send or erroring for 15 minutes."
