# Lab Results Routing Workflow
#
# This workflow routes lab results (ORU messages) to multiple destinations:
# - All results to FHIR server
# - Critical results to alerting webhook
# - Results to data warehouse via database
#
# Templates use Go text/template syntax against the event's JSON form.
# Lab result events expose:
#   patient        - patient demographics (patient.mrn, patient.family_name, ...)
#   test / result  - the primary (first) observation
#   results        - all observations as a list of {test, result} pairs
#   is_critical    - true when any interpretation contains CRITICAL/PANIC
#
# Usage:
#   fi-fhir parse --format hl7v2 oru_r01.hl7 | \
#     fi-fhir workflow run --config examples/workflows/lab-results-routing.yaml -

workflow:
  name: lab_results_routing
  version: "1.0"
  description: Route lab results to FHIR, alerts, and data warehouse

  routes:
    # Route 1: All lab results to FHIR
    - name: all_results_to_fhir
      filter:
        event_type: lab_result
      actions:
        # Create DiagnosticReport with Observations
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: DiagnosticReport
          token: replace-with-bearer-token
        - type: log
          level: info
          message: "Lab result posted to FHIR: {{len .results}} observation(s) for MRN {{.patient.mrn}}"

    # Route 2: Critical results to alerting system
    - name: critical_alerts
      filter:
        event_type: lab_result
        condition: >
          event.is_critical ||
          event.results.exists(o,
            o.result.interpretation in ["HH", "LL", "AA"]
          )
      actions:
        # Send to alerting webhook (event is POSTed as JSON)
        - type: webhook
          url: https://alerts.example.com/hooks/critical
          retry_max: 3
          retry_delay: 1s
        # Also send to pager system
        - type: webhook
          url: https://pager.example.com/api/v1/page
        - type: log
          level: warn
          message: "CRITICAL LAB: {{.patient.mrn}} - {{.test.description}}: {{.result.value}} {{.result.unit}} ({{.result.interpretation}})"

    # Route 3: Store in data warehouse
    - name: results_to_warehouse
      filter:
        event_type: lab_result
      transform:
        # Strip direct identifiers before storing
        - redact:
            fields: [patient.phone, patient.address]
      actions:
        # Column values are event field paths (mapping_<column>: <path>)
        - type: database
          connection: postgres://etl:password@warehouse.example.com:5432/analytics
          operation: insert
          table: lab_results
          mapping_patient_mrn: patient.mrn
          mapping_order_id: test.order_id
          mapping_test_code: test.loinc_code
          mapping_test_name: test.description
          mapping_result_value: result.value
          mapping_result_unit: result.unit
          mapping_interpretation: result.interpretation
          mapping_result_time: timestamp
          mapping_source_system: source

    # Route 4: Abnormal results notification
    - name: abnormal_notifications
      filter:
        event_type: lab_result
        condition: >
          event.results.exists(o,
            o.result.interpretation in ["H", "L", "A"]
          )
      actions:
        # Queue for patient portal notification (key is an event field path).
        # The built-in driver is "log"; external brokers (Kafka, RabbitMQ, ...)
        # require registering a driver via workflow.RegisterQueueDriver.
        - type: queue
          driver: log
          topic: patient-notifications
          key: patient.mrn
        - type: log
          level: info
          message: "Abnormal result queued for notification: {{.patient.mrn}}"
