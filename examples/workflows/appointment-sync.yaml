# Appointment Sync Workflow
#
# This workflow synchronizes scheduling events (SIU messages) between
# the EHR and external systems like patient portals and reminder services.
#
# SIU message types map to event types:
#   SIU^S12 -> appointment_scheduled
#   SIU^S13 -> appointment_rescheduled
#   SIU^S14 -> appointment_modified
#   SIU^S15 -> appointment_cancelled
#   SIU^S26 -> appointment_noshow
#
# Templates use Go text/template syntax against the event's JSON form.
# Appointment events expose:
#   patient      - patient.mrn, patient.family_name, ...
#   appointment  - appointment.id, appointment.start_time, appointment.end_time,
#                  appointment.status, appointment.reason,
#                  appointment.cancellation_reason, appointment.noshow
#
# Usage:
#   fi-fhir parse --format hl7v2 siu_s12.hl7 | \
#     fi-fhir workflow run --config examples/workflows/appointment-sync.yaml -

workflow:
  name: appointment_sync
  version: "1.0"
  description: Synchronize appointments across systems

  routes:
    # Route 1: New appointments
    - name: new_appointments
      filter:
        event_type: appointment_scheduled
      actions:
        # Create FHIR Appointment
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: Appointment
          token: replace-with-bearer-token
        # Store in scheduling database (column values are event field paths)
        - type: database
          connection: postgres://sched:password@db.example.com:5432/scheduling
          operation: insert
          table: appointments
          mapping_appointment_id: appointment.id
          mapping_patient_mrn: patient.mrn
          mapping_start_time: appointment.start_time
          mapping_end_time: appointment.end_time
          mapping_status: appointment.status
          mapping_reason: appointment.reason
        # Send to patient portal (event is POSTed as JSON)
        - type: webhook
          url: https://portal.example.com/api/appointments
          method: POST
          token: replace-with-portal-token
        # Queue reminder notification (key is an event field path).
        # The built-in driver is "log"; external brokers (Kafka, RabbitMQ, ...)
        # require registering a driver via workflow.RegisterQueueDriver.
        - type: queue
          driver: log
          topic: appointment-reminders
          key: patient.mrn
        - type: log
          level: info
          message: "Appointment scheduled: {{.appointment.id}} for {{.patient.mrn}} at {{.appointment.start_time}} ({{.appointment.reason}})"

    # Route 2: Appointment cancellations
    - name: cancelled_appointments
      filter:
        event_type: appointment_cancelled
      actions:
        # Update FHIR Appointment status
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: Appointment
          operation: update
          token: replace-with-bearer-token
        # Update database
        - type: database
          connection: postgres://sched:password@db.example.com:5432/scheduling
          operation: upsert
          table: appointments
          conflict_on: appointment_id
          mapping_appointment_id: appointment.id
          mapping_status: appointment.status
          mapping_cancellation_reason: appointment.cancellation_reason
          mapping_cancelled_at: timestamp
        # Notify patient portal (URLs support templates)
        - type: webhook
          url: https://portal.example.com/api/appointments/{{.appointment.id}}/cancel
          method: POST
        # Cancel reminder
        - type: queue
          driver: log
          topic: appointment-reminder-cancellations
          key: appointment.id
        - type: log
          level: info
          message: "Appointment cancelled: {{.appointment.id}} - {{.appointment.cancellation_reason}}"

    # Route 3: Appointment rescheduled
    - name: rescheduled_appointments
      filter:
        event_type: appointment_rescheduled
      actions:
        # Update appointment record with new times
        - type: database
          connection: postgres://sched:password@db.example.com:5432/scheduling
          operation: upsert
          table: appointments
          conflict_on: appointment_id
          mapping_appointment_id: appointment.id
          mapping_start_time: appointment.start_time
          mapping_end_time: appointment.end_time
          mapping_status: appointment.status
        # Notify patient
        - type: webhook
          url: https://portal.example.com/api/appointments/reschedule
          method: POST
        - type: log
          level: info
          message: "Appointment rescheduled: {{.appointment.id}} to {{.appointment.start_time}}"

    # Route 4: Same-day appointments (urgent)
    - name: same_day_urgent
      filter:
        event_type: appointment_scheduled
        condition: >
          timestamp(event.appointment.start_time).getDayOfYear() ==
          timestamp(event.timestamp).getDayOfYear()
      actions:
        # Priority notification to front desk
        - type: webhook
          url: https://frontdesk.example.com/hooks/urgent
          method: POST
        - type: log
          level: warn
          message: "SAME-DAY appointment: {{.patient.mrn}} at {{.appointment.start_time}}"

    # Route 5: No-shows
    - name: appointment_noshow
      filter:
        event_type: appointment_noshow
      actions:
        # Update database
        - type: database
          connection: postgres://sched:password@db.example.com:5432/scheduling
          operation: upsert
          table: appointments
          conflict_on: appointment_id
          mapping_appointment_id: appointment.id
          mapping_status: appointment.status
          mapping_noshow_at: timestamp
        # Track for analytics
        - type: database
          connection: postgres://sched:password@db.example.com:5432/scheduling
          operation: insert
          table: noshow_tracking
          mapping_patient_mrn: patient.mrn
          mapping_appointment_id: appointment.id
          mapping_appointment_time: appointment.start_time
          mapping_recorded_at: timestamp
        - type: log
          level: warn
          message: "NO-SHOW: {{.patient.mrn}} missed appointment {{.appointment.id}}"
