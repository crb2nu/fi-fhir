# ADT to FHIR Workflow
#
# This workflow routes ADT (Admit/Discharge/Transfer) events from HL7v2
# to a FHIR server, creating/updating Patient and Encounter resources.
#
# Templates use Go text/template syntax against the event's JSON form,
# so field paths use the lowercase snake_case JSON key names
# (e.g. {{.patient.mrn}}, {{.encounter.location.unit}}).
#
# Usage:
#   fi-fhir parse --format hl7v2 adt_a01.hl7 | \
#     fi-fhir workflow run --config examples/workflows/adt-to-fhir.yaml -

workflow:
  name: adt_to_fhir
  version: "1.0"
  description: Route ADT events to FHIR server

  routes:
    # Route 1: Patient admissions
    - name: patient_admits
      filter:
        event_type: patient_admit
      transform:
        # Ensure patient status is set
        - set_field: patient.active = true
        # To map local codes to standard terminology, configure a mapping and use:
        # - map_terminology:
        #     field: patient.race
        #     from: LOCAL
        #     to: OMB
      actions:
        # Create/update Patient resource (OAuth2 client credentials)
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: Patient
          token_url: https://auth.example.com/oauth2/token
          client_id: my-client-id
          client_secret: my-client-secret
        # Create Encounter resource
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: Encounter
          token_url: https://auth.example.com/oauth2/token
          client_id: my-client-id
          client_secret: my-client-secret
        # Log admission
        - type: log
          level: info
          message: "Patient admitted: {{.patient.family_name}}, {{.patient.given_name}} (MRN: {{.patient.mrn}})"

    # Route 2: Patient discharges
    - name: patient_discharges
      filter:
        event_type: patient_discharge
      transform:
        - set_field: encounter.status = "finished"
      actions:
        # Update Encounter to finished
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: Encounter
          operation: update
          token_url: https://auth.example.com/oauth2/token
          client_id: my-client-id
          client_secret: my-client-secret
        - type: log
          level: info
          message: "Patient discharged: {{.patient.mrn}}"

    # Route 3: Patient transfers
    - name: patient_transfers
      filter:
        event_type: patient_transfer
      actions:
        # Update Encounter location
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: Encounter
          operation: update
          token_url: https://auth.example.com/oauth2/token
          client_id: my-client-id
          client_secret: my-client-secret
        - type: log
          level: info
          message: "Patient transferred: {{.patient.mrn}} to {{.encounter.location.unit}} room {{.encounter.location.room}}"

    # Route 4: Patient updates (demographics)
    - name: patient_updates
      filter:
        event_type: patient_update
      actions:
        - type: fhir
          endpoint: https://fhir.example.com/r4
          resource: Patient
          operation: update
          token_url: https://auth.example.com/oauth2/token
          client_id: my-client-id
          client_secret: my-client-secret
