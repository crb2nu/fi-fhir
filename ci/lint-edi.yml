# Lane: edilint dogfood. edilint (libs/edilint) checks the X12 fixtures' envelopes
# before anything parses them. The parser tolerates a wrong SE01 count and a
# control number shared between fixtures, both of which a trading partner
# rejects, so without this gate they crept in and stayed for months.
lint:edi:
  stage: lint
  extends:
    - .go-image
    - .go-cache
    - .go-mr-rules
  variables:
    EDILINT_VERSION: v0.3.0
  script:
    - go install github.com/crb2nu/edilint/cmd/edilint@${EDILINT_VERSION}
    - $GOPATH/bin/edilint -v testdata/edi/*.edi
  allow_failure: false
