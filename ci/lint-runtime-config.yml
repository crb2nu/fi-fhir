# Required runtime configuration proof: deployment tracing stays opt-in
# (MR !283), and environment, Compose, and proxy settings remain consistent.
# Required check failures block the pipeline; advisory warnings remain visible.
lint:runtime-config:
  stage: lint
  extends:
    - .go-image
    - .go-mr-rules
  script:
    - apk add --no-cache bash python3
    - bash scripts/check-runtime-config.sh
  allow_failure: false
