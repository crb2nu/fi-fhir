<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 646" role="img" aria-labelledby="overview-flow-title overview-flow-desc" width="1120" height="646" style="max-width:100%;height:auto;background:#fff">
  <title id="overview-flow-title">From source data to verified delivery</title>
  <desc id="overview-flow-desc">Author an immutable integration. Commit admissions durably. Trace every delivery. PostgreSQL commits the admission before the delivery worker dispatches it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 5 5" refX="5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#334155" />
    </marker>
  </defs>
  <g id="paper">
    <rect x="0" y="0" width="1120" height="646" fill="#FFFFFF" />
    <rect x="0.5" y="0.5" width="1119" height="645" rx="16" ry="16" fill="none" stroke="#CBD5E1" stroke-width="1.0" />
    <rect x="48" y="28" width="26" height="4" rx="2" ry="2" fill="#3B82F6" />
    <text x="84" y="34" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#334155">FI-FHIR  /  ENGINEERING</text>
    <text x="48" y="75" font-size="29" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">From source data to verified delivery</text>
    <text x="48" y="103" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">Author an immutable integration. Commit admissions durably. Trace every delivery.</text>
  </g>
