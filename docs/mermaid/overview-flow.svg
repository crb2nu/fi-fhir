    <rect x="591.0" y="174" width="22" height="3" rx="1.5" ry="1.5" fill="#9333EA" />
    <text x="591.0" y="201" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">Integration definition</text>
