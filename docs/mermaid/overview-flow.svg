    <path d="M 230.4 415 L 256.4 415" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 440.8 415 L 466.8 415" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 651.2 415 L 677.2 415" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
