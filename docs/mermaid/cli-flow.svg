<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 684" role="img" aria-labelledby="cli-flow-title cli-flow-desc" width="1120" height="684" style="max-width:100%;height:auto;background:#fff">
  <title id="cli-flow-title">Parse once. Choose how to run.</title>
  <desc id="cli-flow-desc">The CLI turns a message into event JSON, then applies the workflow mode you select. Actions: log · webhook · FHIR · email · exec · file · database · queue · event store</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 5 5" refX="5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#334155" />
    </marker>
  </defs>
  <g id="paper">
    <rect x="0" y="0" width="1120" height="684" fill="#FFFFFF" />
    <rect x="0.5" y="0.5" width="1119" height="683" rx="16" ry="16" fill="none" stroke="#CBD5E1" stroke-width="1.0" />
    <rect x="48" y="28" width="26" height="4" rx="2" ry="2" fill="#3B82F6" />
    <text x="84" y="34" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#334155">FI-FHIR  /  ENGINEERING</text>
    <text x="48" y="75" font-size="29" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">Parse once. Choose how to run.</text>
    <text x="48" y="103" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">The CLI turns a message into event JSON, then applies the workflow mode you select.</text>
  </g>
  <g id="connections">
    <path d="M 370.667 215 L 396.667 215" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 721.333 215 L 747.333 215" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 910.667 270 L 910.667 306 L 209.333 306 L 209.333 368" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 910.667 270 L 910.667 306 L 560 306 L 560 368" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 910.667 270 L 910.667 306 L 910.667 306 L 910.667 368" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>
  <g id="content">
    <text x="48" y="141" font-size="12" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#334155">01 / PARSE</text>
    <rect x="48" y="160" width="322.6666666666667" height="110" rx="9" ry="9" fill="#F4F8FF" stroke="#CEE0FD" stroke-width="1.0" />
    <rect x="65" y="176" width="22" height="3" rx="1.5" ry="1.5" fill="#3B82F6" />
    <text x="65" y="203" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">Input message</text>
    <text x="65" y="228" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">File or stdin</text>
    <text x="65" y="249" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">HL7v2 · CSV · EDI · CDA</text>
    <rect x="398.6666666666667" y="160" width="322.6666666666667" height="110" rx="9" ry="9" fill="#F4F8FF" stroke="#CEE0FD" stroke-width="1.0" />
    <rect x="415.6666666666667" y="176" width="22" height="3" rx="1.5" ry="1.5" fill="#3B82F6" />
    <text x="415.6666666666667" y="203" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">fi-fhir parse</text>
    <text x="415.6666666666667" y="228" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">--profile source.yaml</text>
    <text x="415.6666666666667" y="249" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">Profile-driven extraction</text>
    <rect x="749.3333333333334" y="160" width="322.6666666666667" height="110" rx="9" ry="9" fill="#F3F7F6" stroke="#C8DCD7" stroke-width="1.0" />
    <rect x="766.3333333333334" y="176" width="22" height="3" rx="1.5" ry="1.5" fill="#21715F" />
    <text x="766.3333333333334" y="203" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">Event JSON</text>
    <text x="766.3333333333334" y="228" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">Canonical events</text>
    <text x="766.3333333333334" y="249" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">+ parse warnings</text>
    <text x="48" y="293" font-size="12" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#334155">02 / CHOOSE A WORKFLOW MODE</text>
    <text x="1072" y="524" font-size="13" font-family="Arial, Helvetica, sans-serif" text-anchor="end" dominant-baseline="auto" font-weight="normal" fill="#334155">Workflow configuration uses YAML + CEL.</text>
    <rect x="48" y="368" width="322.6666666666667" height="126" rx="9" ry="9" fill="#F4F8FF" stroke="#CEE0FD" stroke-width="1.0" />
    <rect x="65" y="384" width="22" height="3" rx="1.5" ry="1.5" fill="#3B82F6" />
    <text x="65" y="411" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">workflow run</text>
    <text x="65" y="436" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">Execute configured actions</text>
    <text x="65" y="457" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">and produce side effects</text>
    <rect x="398.6666666666667" y="368" width="322.6666666666667" height="126" rx="9" ry="9" fill="#F4F8FF" stroke="#CEE0FD" stroke-width="1.0" />
    <rect x="415.6666666666667" y="384" width="22" height="3" rx="1.5" ry="1.5" fill="#3B82F6" />
    <text x="415.6666666666667" y="411" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">workflow dry-run</text>
    <text x="415.6666666666667" y="436" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">Inspect matching routes</text>
    <text x="415.6666666666667" y="457" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">without executing actions</text>
    <rect x="749.3333333333334" y="368" width="322.6666666666667" height="126" rx="9" ry="9" fill="#F4F8FF" stroke="#CEE0FD" stroke-width="1.0" />
    <rect x="766.3333333333334" y="384" width="22" height="3" rx="1.5" ry="1.5" fill="#3B82F6" />
    <text x="766.3333333333334" y="411" font-size="18" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">workflow simulate</text>
    <text x="766.3333333333334" y="436" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">Exercise the workflow</text>
    <text x="766.3333333333334" y="457" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">with mock actions</text>
    <rect x="48" y="552" width="1024" height="68" rx="9" ry="9" fill="#FAF6FE" stroke="#E7D2FA" stroke-width="1.0" />
    <rect x="48" y="569" width="3" height="34" rx="1.5" ry="1.5" fill="#9333EA" />
    <text x="68" y="580" font-size="17" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">fi-fhir serve</text>
    <text x="68" y="603" font-size="15" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">GraphQL + HTTP ingress · MLLP · batch · delivery worker</text>
  </g>
  <g id="footnote">
    <text x="48" y="660" font-size="14" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">Actions: log · webhook · FHIR · email · exec · file · database · queue · event store</text>
  </g>
