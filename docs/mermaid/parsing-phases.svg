    <rect x="0" y="0" width="1120" height="486" fill="#FFFFFF" />
    <rect x="0.5" y="0.5" width="1119" height="485" rx="16" ry="16" fill="none" stroke="#CBD5E1" stroke-width="1.0" />
    <rect x="48" y="28" width="26" height="4" rx="2" ry="2" fill="#3B82F6" />
    <text x="84" y="34" font-size="11" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#334155">FI-FHIR  /  ENGINEERING</text>
    <text x="48" y="75" font-size="29" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="bold" fill="#0f172a">A Source Profile controls every phase</text>
    <text x="48" y="103" font-size="16" font-family="Arial, Helvetica, sans-serif" text-anchor="start" dominant-baseline="auto" font-weight="normal" fill="#334155">The HL7v2 pipeline preserves source data while extracting business-level events.</text>
  </g>
