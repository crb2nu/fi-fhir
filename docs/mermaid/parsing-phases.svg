<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 486" role="img" aria-labelledby="parsing-phases-title parsing-phases-desc" width="1120" height="486" style="max-width:100%;height:auto;background:#fff">
  <title id="parsing-phases-title">A Source Profile controls every phase</title>
  <desc id="parsing-phases-desc">The HL7v2 pipeline preserves source data while extracting business-level events. Recoverable anomalies become parse warnings; raw payloads remain available for audit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 5 5" refX="5" refY="2.5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 5 2.5 L 0 5 Z" fill="#334155" />
    </marker>
  </defs>
