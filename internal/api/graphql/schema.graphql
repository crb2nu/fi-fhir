# fi-fhir GraphQL Schema
# Healthcare event query interface

# Custom scalar types
scalar DateTime
scalar JSON

# =============================================================================
# Enums
# =============================================================================

enum EventType {
  PATIENT_ADMIT
  PATIENT_DISCHARGE
  PATIENT_TRANSFER
  PATIENT_UPDATE
  PATIENT_MERGE
  LAB_RESULT
  LAB_ORDERED
  LAB_CANCELLED
  APPOINTMENT_SCHEDULED
  APPOINTMENT_RESCHEDULED
  APPOINTMENT_MODIFIED
  APPOINTMENT_CANCELLED
  APPOINTMENT_NOSHOW
  APPOINTMENT_CHECKED_IN
  CLAIM_SUBMITTED
  CLAIM_ADJUDICATED
  PRIOR_AUTH_REQUEST
  PRIOR_AUTH_RESPONSE
  ELIGIBILITY_INQUIRY
  ELIGIBILITY_RESPONSE
  CLAIM_STATUS_REQUEST
  CLAIM_STATUS_RESPONSE
  VITAL_SIGN
  CONDITION
  PROCEDURE
  IMMUNIZATION
  DOCUMENT
  DOCUMENT_ORIGINAL
  DOCUMENT_STATUS_CHANGE
  DOCUMENT_ADDENDUM
  DOCUMENT_EDIT
  DOCUMENT_REPLACEMENT
  FINANCIAL_TRANSACTION
  MEDICATION_REQUEST
  ALLERGY_INTOLERANCE
  SOCIAL_HISTORY
}

enum SourceFormat {
  HL7V2
  FHIR
  CSV
  EDI_837
  EDI_835
  CDA
}

enum EventOrderField {
  TIMESTAMP
  TYPE
  SOURCE
}

enum OrderDirection {
  ASC
  DESC
}

# =============================================================================
# Core Types
# =============================================================================

# Event interface - all events implement this
interface Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
}

type Patient {
  mrn: ID!
  identifiers: [Identifier!]!
  familyName: String!
  givenName: String!
  middleName: String
  dateOfBirth: DateTime
  gender: String
  address: Address
  phone: String
  email: String
}

type Identifier {
  value: String!
  type: String!
  system: String
  assigner: String
}

type Address {
  line1: String
  line2: String
  city: String
  state: String
  postalCode: String
  country: String
}

type Provider {
  npi: String
  id: String
  familyName: String!
  givenName: String!
  specialty: String
  organizationName: String
}

type Location {
  facility: String
  unit: String
  room: String
  bed: String
}

type Encounter {
  id: ID!
  class: String!
  status: String
  admitDateTime: DateTime
  dischargeDateTime: DateTime
  location: Location
  attendingProvider: Provider
}

# =============================================================================
# Event Types
# =============================================================================

type PatientAdmitEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  encounter: Encounter!
}

type PatientDischargeEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  encounter: Encounter!
}

type LabTest {
  loincCode: String
  localCode: String
  description: String!
  category: String
}

type LabResult {
  value: String!
  unit: String
  referenceRange: String
  interpretation: String
  status: String
}

type LabResultEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  test: LabTest!
  result: LabResult!
  isCritical: Boolean!
  orderingProvider: Provider
}

type VitalSign {
  name: String!
  loincCode: String
  value: String!
  unit: String
  interpretation: String
}

type VitalSignEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  vitalSign: VitalSign!
}

type Condition {
  name: String!
  code: String
  codeSystem: String
  category: String
}

type ConditionEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  condition: Condition!
  clinicalStatus: String
  onsetDate: String
}

type Procedure {
  name: String!
  code: String
  codeSystem: String
  status: String
}

type ProcedureEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  procedure: Procedure!
  performedDate: String
}

type Immunization {
  vaccineName: String!
  vaccineCode: String
  status: String
}

type ImmunizationEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  immunization: Immunization!
  administeredDate: String
}

type Appointment {
  id: ID!
  status: String!
  startTime: DateTime!
  endTime: DateTime
  location: Location
  provider: Provider
  reason: String
}

type AppointmentEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  appointment: Appointment!
}

type DocumentEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient
  documentType: String!
  title: String
}

# =============================================================================
# Pagination Types
# =============================================================================

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type EventEdge {
  cursor: String!
  node: Event!
}

type EventConnection {
  edges: [EventEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PatientEdge {
  cursor: String!
  node: Patient!
}

type PatientConnection {
  edges: [PatientEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# =============================================================================
# Query Types
# =============================================================================

input EventFilter {
  types: [EventType!]
  sources: [String!]
  patientMrn: String
  fromTimestamp: DateTime
  toTimestamp: DateTime
  correlationId: String
}

input EventOrderBy {
  field: EventOrderField!
  direction: OrderDirection!
}

input PatientFilter {
  mrn: String
  familyName: String
  givenName: String
  dateOfBirth: DateTime
}

input PagingInput {
  limit: Int = 50
  offset: Int = 0
}

input WorkflowDefinitionFilter {
  name: String
  status: String
}

input WorkflowRunFilter {
  workflowName: String
  environment: String
  status: String
  fromStartedAt: DateTime
  toStartedAt: DateTime
}

input WorkflowApprovalRequestFilter {
  workflowId: ID
  environment: String
  status: String
}

type WorkflowStatus {
  name: String!
  enabled: Boolean!
  routeCount: Int!
  eventsProcessed: Int!
  lastEventTime: DateTime
  errors: Int!
}

type WorkflowValidation {
  valid: Boolean!
  errors: [String!]!
  warnings: [String!]!
  info: [String!]!
}

type WorkflowDefinition {
  id: ID!
  name: String!
  description: String
  status: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  latestVersion: WorkflowVersion
  publishedVersionsByEnv: JSON!
}

type WorkflowVersion {
  id: ID!
  workflowId: ID!
  versionNumber: Int!
  yaml: String!
  validation: WorkflowValidation!
  createdBy: String!
  createdAt: DateTime!
  notes: String
}

type WorkflowRelease {
  id: ID!
  workflowId: ID!
  environment: String!
  versionId: ID!
  publishedBy: String!
  publishedAt: DateTime!
  rollbackFromReleaseId: ID
}

type WorkflowRun {
  id: ID!
  workflowName: String!
  environment: String!
  versionId: ID
  eventId: String
  routesMatched: Int!
  actionsExecuted: Int!
  errors: [String!]!
  durationMs: Int!
  startedAt: DateTime!
  status: String!
}

type WorkflowApprovalRequest {
  id: ID!
  workflowId: ID!
  targetVersionId: ID!
  environment: String!
  status: String!
  requestedBy: String!
  reviewedBy: String
  reviewedAt: DateTime
  comment: String
}

type ComponentHealth {
  name: String!
  status: String!
  message: String
}

type HealthStatus {
  status: String!
  version: String!
  uptime: Int!
  components: [ComponentHealth!]!
}

type LLMFeatureCapability {
  name: String!
  enabled: Boolean!
  status: String!
  reason: String
  model: String
}

type ParseWarning {
  phase: String!
  code: String!
  message: String!
  path: String
  # LLM-generated fields (optional, populated on-demand or via explainWarnings query)
  explanation: String
  fixSuggestion: String
  impact: String
  severity: String          # "info", "warning", "error"
  fromCache: Boolean
}

# Input type for requesting warning explanations
input ParseWarningInput {
  phase: String!
  code: String!
  message: String!
  path: String
  severity: String
}

# Result from explainWarnings query
type ExplainedWarning {
  code: String!
  explanation: String!
  fixSuggestion: String
  impact: String
  fromCache: Boolean!
}

type ParseResult {
  success: Boolean!
  events: [Event!]!
  warnings: [ParseWarning!]!
  errors: [String!]!
}

type Query {
  # Get a single event by ID
  event(id: ID!): Event

  # Query events with filters
  events(
    filter: EventFilter
    first: Int = 100
    after: String
    orderBy: EventOrderBy
  ): EventConnection!

  # Get patient by MRN
  patient(mrn: ID!): Patient

  # Get patients with filter
  patients(
    filter: PatientFilter
    first: Int = 100
    after: String
  ): PatientConnection!

  # Get workflow status
  workflow(name: String!): WorkflowStatus

  # List all workflows
  workflows: [WorkflowStatus!]!

  # Managed workflow lifecycle
  workflowDefinitions(filter: WorkflowDefinitionFilter, paging: PagingInput): [WorkflowDefinition!]!
  workflowDefinition(nameOrId: String!): WorkflowDefinition
  workflowVersions(workflowId: ID!, paging: PagingInput): [WorkflowVersion!]!
  workflowVersion(id: ID!): WorkflowVersion
  workflowRuns(filter: WorkflowRunFilter, paging: PagingInput): [WorkflowRun!]!
  workflowRun(id: ID!): WorkflowRun
  workflowApprovalRequests(filter: WorkflowApprovalRequestFilter, paging: PagingInput): [WorkflowApprovalRequest!]!

  # Health check
  health: HealthStatus!

  # Get parse result without persisting
  parsePreview(
    format: SourceFormat!
    data: String!
    source: String
  ): ParseResult!
}

# =============================================================================
# Mutation Types
# =============================================================================

input SubmitMessageInput {
  format: SourceFormat!
  data: String!
  source: String!
  correlationId: String
}

# Stateless, authenticated preview input. Tenant, principal, source, format,
# classification, and every executable revision are selected by the server.
input PreviewIntegrationMessageInput {
  integrationId: ID!
  data: String!
  correlationId: ID!
  reason: String!
}

type IntegrationArtifactRevision {
  artifactId: ID!
  revisionId: ID!
  digest: String!
}

type IntegrationExecutionArtifactRevisions {
  source: IntegrationArtifactRevision!
  profile: IntegrationArtifactRevision!
  workflow: IntegrationArtifactRevision!
}

type IntegrationPreviewEvent {
  tenantId: ID!
  id: ID!
  type: String!
  sourceMessageId: String
  correlationId: ID!
  classification: String!
  payload: JSON!
}

type IntegrationPreviewDiagnostic {
  tenantId: ID!
  severity: String!
  stage: String!
  code: String!
  message: String!
  path: String
  source: String
  classification: String!
}

type IntegrationPreviewRoute {
  tenantId: ID!
  eventId: ID!
  route: String!
  matched: Boolean!
  skipped: Boolean!
  skipReason: String
  transformCount: Int!
  plannedActions: [String!]!
  diagnosticCodes: [String!]!
}

type IntegrationPreviewDestination {
  artifactId: ID!
  revisionId: ID!
  digest: String!
  class: String!
}

type IntegrationPreviewDelivery {
  tenantId: ID!
  eventId: ID!
  destination: IntegrationPreviewDestination!
  route: String!
  action: String!
  status: String!
  diagnosticCodes: [String!]!
}

type IntegrationPreviewCorrelations {
  tenantId: ID!
  correlationId: ID!
  traceId: ID
  sourceMessageId: String
  eventIds: [ID!]!
  workflowRunId: ID
}

type IntegrationPreviewResult {
  mode: String!
  tenantId: ID!
  integrationRevision: IntegrationArtifactRevision!
  artifactRevisions: IntegrationExecutionArtifactRevisions!
  events: [IntegrationPreviewEvent!]!
  diagnostics: [IntegrationPreviewDiagnostic!]!
  routes: [IntegrationPreviewRoute!]!
  deliveries: [IntegrationPreviewDelivery!]!
  correlations: IntegrationPreviewCorrelations!
}

input SubmitEventInput {
  type: EventType!
  data: JSON!
  source: String!
  correlationId: String
}

# Batch submission inputs
input BatchMessageItem {
  format: SourceFormat!
  data: String!
  source: String!
  correlationId: String
  # Optional index for tracking in results (auto-assigned if not provided)
  index: Int
}

input BatchEventItem {
  type: EventType!
  data: JSON!
  source: String!
  correlationId: String
  index: Int
}

input SubmitBatchInput {
  # Submit multiple raw messages
  messages: [BatchMessageItem!]
  # Submit multiple pre-parsed events
  events: [BatchEventItem!]
  # Stop processing on first error (default: false, continue processing)
  stopOnError: Boolean
  # Enable parallel processing (default: false, sequential)
  parallel: Boolean
}

# Batch submission results
type BatchItemResult {
  # Index of the item in the input array
  index: Int!
  # Whether this item was processed successfully
  success: Boolean!
  # Event ID if successfully created
  eventId: ID
  # Warnings from parsing
  warnings: [ParseWarning!]!
  # Errors for this specific item
  errors: [String!]!
  # Workflow results for this item
  workflowResults: [WorkflowResult!]!
}

type BatchResult {
  # Total items submitted
  totalItems: Int!
  # Successfully processed items
  successCount: Int!
  # Failed items
  failureCount: Int!
  # Per-item results (in same order as input)
  results: [BatchItemResult!]!
  # Processing duration in milliseconds
  durationMs: Int!
}

type WorkflowResult {
  workflowName: String!
  routesMatched: Int!
  actionsExecuted: Int!
  errors: [String!]!
  duration: Int!
  runId: ID
  environment: String
  versionId: ID
}

type SubmitResult {
  success: Boolean!
  eventId: ID
  warnings: [ParseWarning!]!
  errors: [String!]!
  workflowResults: [WorkflowResult!]!
}

input CreateSubscriptionInput {
  name: String!
  server: String!
  criteria: String!
  endpoint: String!
}

input CreateWorkflowDefinitionInput {
  name: String!
  description: String
  createdBy: String
}

input UpdateWorkflowDefinitionInput {
  id: ID!
  name: String
  description: String
  status: String
  updatedBy: String
}

input SaveWorkflowVersionInput {
  workflowId: ID!
  yaml: String!
  notes: String
  createdBy: String
}

input PublishWorkflowVersionInput {
  workflowId: ID!
  versionId: ID!
  environment: String!
  publishedBy: String
}

input RollbackWorkflowVersionInput {
  workflowId: ID!
  targetVersionId: ID!
  environment: String!
  publishedBy: String
}

input ArchiveWorkflowDefinitionInput {
  workflowId: ID!
  archivedBy: String
}

input RequestWorkflowApprovalInput {
  workflowId: ID!
  targetVersionId: ID!
  environment: String!
  requestedBy: String
  comment: String
}

input ApproveWorkflowVersionInput {
  approvalRequestId: ID!
  reviewedBy: String
  comment: String
}

input RejectWorkflowVersionInput {
  approvalRequestId: ID!
  reviewedBy: String
  comment: String
}

type FhirSubscription {
  id: ID!
  name: String!
  status: String!
  criteria: String!
  server: String!
  endpoint: String!
  createdAt: DateTime!
}

type Mutation {
  # Evaluate one raw message with exact server-owned revisions. This operation
  # never persists a receipt/sample/run or invokes a destination.
  previewIntegrationMessage(input: PreviewIntegrationMessageInput!): IntegrationPreviewResult!

  # Submit a raw message for parsing and processing
  submitMessage(input: SubmitMessageInput!): SubmitResult!

  # Submit a pre-parsed event directly
  submitEvent(input: SubmitEventInput!): SubmitResult!

  # Submit multiple messages/events in a batch
  # Supports both raw messages and pre-parsed events
  # Returns per-item results for partial success handling
  submitBatch(input: SubmitBatchInput!): BatchResult!

  # Trigger a workflow manually
  triggerWorkflow(
    name: String!
    event: JSON!
    environment: String
    versionId: String
  ): WorkflowResult!

  # Workflow lifecycle management
  createWorkflowDefinition(input: CreateWorkflowDefinitionInput!): WorkflowDefinition!
  updateWorkflowDefinition(input: UpdateWorkflowDefinitionInput!): WorkflowDefinition!
  saveWorkflowVersion(input: SaveWorkflowVersionInput!): WorkflowVersion!
  publishWorkflowVersion(input: PublishWorkflowVersionInput!): WorkflowRelease!
  rollbackWorkflowVersion(input: RollbackWorkflowVersionInput!): WorkflowRelease!
  archiveWorkflowDefinition(input: ArchiveWorkflowDefinitionInput!): WorkflowDefinition!
  requestWorkflowApproval(input: RequestWorkflowApprovalInput!): WorkflowApprovalRequest!
  approveWorkflowVersion(input: ApproveWorkflowVersionInput!): WorkflowApprovalRequest!
  rejectWorkflowVersion(input: RejectWorkflowVersionInput!): WorkflowApprovalRequest!

  # FHIR subscription management
  createFhirSubscription(input: CreateSubscriptionInput!): FhirSubscription!
  deleteFhirSubscription(id: ID!): Boolean!
  pauseFhirSubscription(id: ID!): FhirSubscription!
  resumeFhirSubscription(id: ID!): FhirSubscription!
}

# =============================================================================
# Subscription Types (Real-time)
# =============================================================================

type WorkflowEventNotification {
  event: Event!
  workflow: String!
  routesMatched: [String!]!
  actionsExecuted: [String!]!
  duration: Int!
}

type Subscription {
  # Stream all events
  eventStream(filter: EventFilter): Event!

  # Stream events for a specific workflow
  workflowEvents(workflowName: String!): WorkflowEventNotification!

  # Stream events for a specific patient
  patientEvents(mrn: ID!): Event!
}

# =============================================================================
# Integration Session Engine
# =============================================================================

"""A bounded session browse page. A null nextOffset with hasMore means refine the search."""
type IntegrationSessionSummaryPage {
  nodes: [IntegrationSessionSummary!]!
  hasMore: Boolean!
  nextOffset: Int
}

type IntegrationSessionSummary {
  id: ID!
  name: String!
  archived: Boolean!
  createdAt: DateTime!
  """Session metadata update time; adding a run does not change this timestamp."""
  updatedAt: DateTime!
  latestRun: IntegrationSessionRunSummary
}

type IntegrationSessionRunSummary {
  id: ID!
  status: String!
  createdAt: DateTime!
}

input IntegrationSessionSummaryInput {
  """Literal, case-insensitive name or ID substring; trimmed, at most 256 bytes, without NUL."""
  search: String
  includeArchived: Boolean! = false
  """Omitted includes all sessions; true requires a run, false requires no runs."""
  hasRuns: Boolean
  """Page size from 1 through 100."""
  limit: Int! = 25
  """Offset from 0 through 10000. Search applies to the entire tenant before paging."""
  offset: Int! = 0
}

type IntegrationSession {
  id: ID!
  name: String!
  description: String
  archived: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  samples: [SessionSample!]!
  artifacts: [SessionArtifact!]!
  runs: [SessionRun!]!
  diagnostics: [SessionDiagnostic!]!
  workflowSimulations: [SessionWorkflowSimulation!]!
  publications: [SessionPublication!]!
  currentProfileDraft: SessionArtifact
  currentWorkflowDraft: SessionArtifact
}

type SessionSample {
  id: ID!
  sessionId: ID!
  name: String!
  format: SourceFormat!
  source: String
  rawPayload: String
  """
  The stored text of a sample peeked or captured from a connection, as the
  capture redactor left it (docs/operations/PHI-RETENTION.md, "Captured and
  peeked samples"). Gated on integration.operator: null unless the caller's
  verified roles include it, never carried by an export, and null for every
  other sample.
  """
  redactedPayload: String
  payloadChecksum: String!
  payloadRef: String
  createdAt: DateTime!
}

type SessionArtifact {
  id: ID!
  revisionId: ID!
  sessionId: ID!
  kind: String!
  name: String!
  content: String!
  version: Int!
  digest: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SessionRun {
  id: ID!
  sessionId: ID!
  sampleId: ID
  status: String!
  profileRevisionId: ID
  profileRevisionDigest: String
  createdAt: DateTime!
  completedAt: DateTime
  stages: [RunStage!]!
  diagnostics: [SessionDiagnostic!]!
  lineage: [LineageLink!]!
  events: [Event!]!
  warnings: [ParseWarning!]!
}

type RunStage {
  id: ID!
  name: String!
  status: String!
  startedAt: DateTime!
  completedAt: DateTime
  durationMs: Int!
  summary: String
}

type SessionDiagnostic {
  id: ID!
  sessionId: ID!
  runId: ID
  sampleId: ID
  severity: String!
  code: String!
  message: String!
  path: String
  fixSuggestion: String
  accepted: Boolean!
  acceptedAt: DateTime
  lineage: [LineageLink!]!
}

type LineageLink {
  sourcePath: String!
  targetPath: String
  description: String
}

type IntegrationBundle {
  sessionId: ID!
  exportedAt: DateTime!
  session: IntegrationSession!
  samples: [SessionSample!]!
  artifacts: [SessionArtifact!]!
  runs: [SessionRun!]!
  workflowSimulations: [SessionWorkflowSimulation!]!
  publications: [SessionPublication!]!
  diagnostics: [SessionDiagnostic!]!
}

type SessionPublication {
  id: ID!
  sessionId: ID!
  version: Int!
  sessionProfile: IntegrationArtifactRevision!
  sessionWorkflow: IntegrationArtifactRevision!
  workflowSimulationId: ID!
  definitionRevision: IntegrationArtifactRevision!
  definitionVersion: Int!
  productionProfile: IntegrationArtifactRevision!
  productionWorkflow: IntegrationArtifactRevision!
  sourceRunIds: [ID!]!
  manifestDigest: String!
  signatureAlgorithm: String!
  signingKeyId: ID!
  publishedBy: ID!
  reason: String!
  createdAt: DateTime!
}

type SessionDeploymentSnapshot {
  definitionRevision: IntegrationArtifactRevision!
  state: String!
  version: Int!
  releaseId: ID
  health: String!
}

type SessionWorkflowSimulation {
  id: ID!
  sessionId: ID!
  workflowArtifactId: ID!
  workflowRevisionId: ID!
  workflowRevisionDigest: String!
  sourceRunIds: [ID!]!
  events: [SessionWorkflowEventTrace!]!
  createdAt: DateTime!
  delta: SessionWorkflowSimulationDelta
}

type SessionWorkflowEventTrace {
  runId: ID!
  eventId: ID!
  eventType: String!
  routes: [SessionWorkflowRouteTrace!]!
}

type SessionWorkflowRouteTrace {
  name: String!
  matched: Boolean!
  skipReason: String
  diagnosticCodes: [String!]!
  transforms: [SessionWorkflowTransformTrace!]!
  actions: [SessionWorkflowActionTrace!]!
}

type SessionWorkflowTransformTrace {
  index: Int!
  type: String!
  status: String!
}

type SessionWorkflowActionTrace {
  id: ID!
  type: String!
  destinationArtifactId: ID
}

type SessionWorkflowSimulationDelta {
  baselineSimulationId: ID!
  candidateSimulationId: ID!
  addedEvents: [String!]!
  removedEvents: [String!]!
  addedMatchedRoutes: [String!]!
  removedMatchedRoutes: [String!]!
  addedTransforms: [String!]!
  removedTransforms: [String!]!
  addedActions: [String!]!
  removedActions: [String!]!
}

type IntegrationSessionEvent {
  id: ID!
  type: String!
  sessionId: ID!
  runId: ID
  message: String!
  timestamp: DateTime!
  session: IntegrationSession
  run: SessionRun
}

input CreateIntegrationSessionInput {
  name: String!
  description: String
}

input AddSessionSampleInput {
  sessionId: ID!
  name: String!
  format: SourceFormat!
  data: String!
  source: String
  retainRawPayload: Boolean
  payloadRef: String
}

input UpdateSessionArtifactInput {
  sessionId: ID!
  name: String
  content: String!
}

input RunSessionPreviewInput {
  sessionId: ID!
  sampleId: ID
  data: String
  format: SourceFormat
  source: String
}

input SimulateSessionWorkflowInput {
  sessionId: ID!
  workflowRevisionId: ID!
