# =============================================================================
# Verification over durable admissions (.loom/42 E-2)
#
# The IDE's Verification stage (/events) reads the canonical events the
# admission path committed, joined to their receipts, and counts admissions and
# delivery attempts from columns. Same role, tenant scope and payload rule as
# the operator reads above: a canonical event is described by its identifiers,
# retention marks and payload structure, never by a stored value. The legacy
# events/patientTimeline/eventStatistics/eventStream fields are unrelated and
# unchanged.
# =============================================================================

input OperatorCanonicalEventFilter {
  eventType: String
