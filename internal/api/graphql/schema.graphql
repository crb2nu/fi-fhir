enum AutorouteDecision {
  PERSISTENT_HIT
  AUTOROUTE_HIGH_CONF
  AUTOROUTE_MED_CONF
  AUTOROUTE_LOW_CONF
  NO_MATCH
}

# A mapping candidate from autoroute
type MappingCandidate {
  code: String!
  display: String!
  system: String!
  confidence: Float!
  equivalence: MappingEquivalence
  reasoning: String
  score: Float
}

# Step in the decision-making process
