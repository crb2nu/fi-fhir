# =============================================================================
# Operator Control Plane (Phase 4 Slice 4.2a)
#
# Read queries project the durable engine records an operator needs and never
# return a raw clinical payload. Canonical event payloads are rendered
# structurally: field coordinates and JSON kinds only, never stored values.
# Every mutation requires a nonempty actor reason, uses the caller's verified
# identity as the actor, enforces a privileged operator role, and lands in the
# same idempotent operation ledger and append-only audit trail the delivery and
# lifecycle runtimes already own.
