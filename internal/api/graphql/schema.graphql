# fi-fhir GraphQL Schema
# Healthcare event query interface

# Custom scalar types
scalar DateTime
scalar JSON

# =============================================================================
# Enums
# =============================================================================

enum EventType {
  PATIENT_ADMIT
  PATIENT_DISCHARGE
  PATIENT_TRANSFER
  PATIENT_UPDATE
  PATIENT_MERGE
  LAB_RESULT
  LAB_ORDERED
  LAB_CANCELLED
  APPOINTMENT_SCHEDULED
  APPOINTMENT_RESCHEDULED
  APPOINTMENT_MODIFIED
  APPOINTMENT_CANCELLED
  APPOINTMENT_NOSHOW
  APPOINTMENT_CHECKED_IN
  CLAIM_SUBMITTED
  CLAIM_ADJUDICATED
  PRIOR_AUTH_REQUEST
  PRIOR_AUTH_RESPONSE
  ELIGIBILITY_INQUIRY
  ELIGIBILITY_RESPONSE
  CLAIM_STATUS_REQUEST
  CLAIM_STATUS_RESPONSE
  VITAL_SIGN
  CONDITION
  PROCEDURE
  IMMUNIZATION
  DOCUMENT
  DOCUMENT_ORIGINAL
  DOCUMENT_STATUS_CHANGE
  DOCUMENT_ADDENDUM
  DOCUMENT_EDIT
  DOCUMENT_REPLACEMENT
  FINANCIAL_TRANSACTION
  MEDICATION_REQUEST
  ALLERGY_INTOLERANCE
  SOCIAL_HISTORY
}

enum SourceFormat {
  HL7V2
  FHIR
  CSV
  EDI_837
  EDI_835
  CDA
}

enum EventOrderField {
  TIMESTAMP
  TYPE
  SOURCE
}

enum OrderDirection {
  ASC
  DESC
}

# =============================================================================
# Core Types
# =============================================================================

# Event interface - all events implement this
interface Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
}

type Patient {
  mrn: ID!
  identifiers: [Identifier!]!
  familyName: String!
  givenName: String!
  middleName: String
  dateOfBirth: DateTime
  gender: String
  address: Address
  phone: String
  email: String
}

type Identifier {
  value: String!
  type: String!
  system: String
  assigner: String
}

type Address {
  line1: String
  line2: String
  city: String
  state: String
  postalCode: String
  country: String
}

type Provider {
  npi: String
  id: String
  familyName: String!
  givenName: String!
  specialty: String
  organizationName: String
}

type Location {
  facility: String
  unit: String
  room: String
  bed: String
}

type Encounter {
  id: ID!
  class: String!
  status: String
  admitDateTime: DateTime
  dischargeDateTime: DateTime
  location: Location
  attendingProvider: Provider
}

# =============================================================================
# Event Types
# =============================================================================

type PatientAdmitEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  encounter: Encounter!
}

type PatientDischargeEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  encounter: Encounter!
}

type LabTest {
  loincCode: String
  localCode: String
  description: String!
  category: String
}

type LabResult {
  value: String!
  unit: String
  referenceRange: String
  interpretation: String
  status: String
}

type LabResultEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  test: LabTest!
  result: LabResult!
  isCritical: Boolean!
  orderingProvider: Provider
}

type VitalSign {
  name: String!
  loincCode: String
  value: String!
  unit: String
  interpretation: String
}

type VitalSignEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  vitalSign: VitalSign!
}

type Condition {
  name: String!
  code: String
  codeSystem: String
  category: String
}

type ConditionEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  condition: Condition!
  clinicalStatus: String
  onsetDate: String
}

type Procedure {
  name: String!
  code: String
  codeSystem: String
  status: String
}

type ProcedureEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  procedure: Procedure!
  performedDate: String
}

type Immunization {
  vaccineName: String!
  vaccineCode: String
  status: String
}

type ImmunizationEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  immunization: Immunization!
  administeredDate: String
}

type Appointment {
  id: ID!
  status: String!
  startTime: DateTime!
  endTime: DateTime
  location: Location
  provider: Provider
  reason: String
}

type AppointmentEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient!
  appointment: Appointment!
}

type DocumentEvent implements Event {
  id: ID!
  type: EventType!
  timestamp: DateTime!
  source: String!
  sourceFormat: SourceFormat
  correlationId: String
  patient: Patient
  documentType: String!
  title: String
}

# =============================================================================
# Pagination Types
# =============================================================================

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type EventEdge {
  cursor: String!
  node: Event!
}

type EventConnection {
  edges: [EventEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PatientEdge {
  cursor: String!
  node: Patient!
}

type PatientConnection {
  edges: [PatientEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# =============================================================================
# Query Types
# =============================================================================

input EventFilter {
  types: [EventType!]
  sources: [String!]
  patientMrn: String
  fromTimestamp: DateTime
  toTimestamp: DateTime
  correlationId: String
}

input EventOrderBy {
  field: EventOrderField!
  direction: OrderDirection!
}

input PatientFilter {
  mrn: String
  familyName: String
  givenName: String
  dateOfBirth: DateTime
}

input PagingInput {
  limit: Int = 50
  offset: Int = 0
}

input WorkflowDefinitionFilter {
  name: String
  status: String
}

input WorkflowRunFilter {
  workflowName: String
  environment: String
  status: String
  fromStartedAt: DateTime
  toStartedAt: DateTime
}

input WorkflowApprovalRequestFilter {
  workflowId: ID
  environment: String
  status: String
}

type WorkflowStatus {
  name: String!
  enabled: Boolean!
  routeCount: Int!
  eventsProcessed: Int!
  lastEventTime: DateTime
  errors: Int!
}

type WorkflowValidation {
  valid: Boolean!
  errors: [String!]!
  warnings: [String!]!
  info: [String!]!
}

type WorkflowDefinition {
  id: ID!
  name: String!
  description: String
  status: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  latestVersion: WorkflowVersion
  publishedVersionsByEnv: JSON!
}

type WorkflowVersion {
  id: ID!
  workflowId: ID!
  versionNumber: Int!
  yaml: String!
  validation: WorkflowValidation!
  createdBy: String!
  createdAt: DateTime!
  notes: String
}

type WorkflowRelease {
  id: ID!
  workflowId: ID!
  environment: String!
  versionId: ID!
  publishedBy: String!
  publishedAt: DateTime!
  rollbackFromReleaseId: ID
}

type WorkflowRun {
  id: ID!
  workflowName: String!
  environment: String!
  versionId: ID
  eventId: String
  routesMatched: Int!
  actionsExecuted: Int!
  errors: [String!]!
  durationMs: Int!
  startedAt: DateTime!
  status: String!
}

type WorkflowApprovalRequest {
  id: ID!
  workflowId: ID!
  targetVersionId: ID!
  environment: String!
  status: String!
  requestedBy: String!
  reviewedBy: String
  reviewedAt: DateTime
  comment: String
}

type ComponentHealth {
  name: String!
  status: String!
  message: String
}

type HealthStatus {
  status: String!
  version: String!
  uptime: Int!
  components: [ComponentHealth!]!
}

type LLMFeatureCapability {
  name: String!
  enabled: Boolean!
  status: String!
  reason: String
  model: String
}

type ParseWarning {
  phase: String!
  code: String!
  message: String!
  path: String
  # LLM-generated fields (optional, populated on-demand or via explainWarnings query)
  explanation: String
  fixSuggestion: String
  impact: String
  severity: String          # "info", "warning", "error"
  fromCache: Boolean
}

# Input type for requesting warning explanations
input ParseWarningInput {
  phase: String!
  code: String!
  message: String!
  path: String
  severity: String
}

# Result from explainWarnings query
type ExplainedWarning {
  code: String!
  explanation: String!
  fixSuggestion: String
  impact: String
  fromCache: Boolean!
}

type ParseResult {
  success: Boolean!
  events: [Event!]!
  warnings: [ParseWarning!]!
  errors: [String!]!
}

type Query {
  # Get a single event by ID
  event(id: ID!): Event

  # Query events with filters
  events(
    filter: EventFilter
    first: Int = 100
    after: String
    orderBy: EventOrderBy
  ): EventConnection!

  # Get patient by MRN
  patient(mrn: ID!): Patient

  # Get patients with filter
  patients(
    filter: PatientFilter
    first: Int = 100
    after: String
  ): PatientConnection!

  # Get workflow status
  workflow(name: String!): WorkflowStatus

  # List all workflows
  workflows: [WorkflowStatus!]!

  # Managed workflow lifecycle
  workflowDefinitions(filter: WorkflowDefinitionFilter, paging: PagingInput): [WorkflowDefinition!]!
  workflowDefinition(nameOrId: String!): WorkflowDefinition
  workflowVersions(workflowId: ID!, paging: PagingInput): [WorkflowVersion!]!
  workflowVersion(id: ID!): WorkflowVersion
  workflowRuns(filter: WorkflowRunFilter, paging: PagingInput): [WorkflowRun!]!
  workflowRun(id: ID!): WorkflowRun
  workflowApprovalRequests(filter: WorkflowApprovalRequestFilter, paging: PagingInput): [WorkflowApprovalRequest!]!

  # Health check
  health: HealthStatus!

  # Get parse result without persisting
  parsePreview(
    format: SourceFormat!
    data: String!
    source: String
  ): ParseResult!
}

# =============================================================================
# Mutation Types
# =============================================================================

input SubmitMessageInput {
  format: SourceFormat!
  data: String!
  source: String!
  correlationId: String
}

# Stateless, authenticated preview input. Tenant, principal, source, format,
# classification, and every executable revision are selected by the server.
input PreviewIntegrationMessageInput {
  integrationId: ID!
  data: String!
  correlationId: ID!
  reason: String!
}

type IntegrationArtifactRevision {
  artifactId: ID!
  revisionId: ID!
  digest: String!
}

type IntegrationExecutionArtifactRevisions {
  source: IntegrationArtifactRevision!
  profile: IntegrationArtifactRevision!
  workflow: IntegrationArtifactRevision!
}

type IntegrationPreviewEvent {
  tenantId: ID!
  id: ID!
  type: String!
  sourceMessageId: String
  correlationId: ID!
  classification: String!
  payload: JSON!
}

type IntegrationPreviewDiagnostic {
  tenantId: ID!
  severity: String!
  stage: String!
  code: String!
  message: String!
  path: String
  source: String
  classification: String!
}

type IntegrationPreviewRoute {
  tenantId: ID!
  eventId: ID!
  route: String!
  matched: Boolean!
  skipped: Boolean!
  skipReason: String
  transformCount: Int!
  plannedActions: [String!]!
  diagnosticCodes: [String!]!
}

type IntegrationPreviewDestination {
  artifactId: ID!
  revisionId: ID!
  digest: String!
  class: String!
}

type IntegrationPreviewDelivery {
  tenantId: ID!
  eventId: ID!
  destination: IntegrationPreviewDestination!
  route: String!
  action: String!
  status: String!
  diagnosticCodes: [String!]!
}

type IntegrationPreviewCorrelations {
  tenantId: ID!
  correlationId: ID!
  traceId: ID
  sourceMessageId: String
  eventIds: [ID!]!
  workflowRunId: ID
}

type IntegrationPreviewResult {
  mode: String!
  tenantId: ID!
  integrationRevision: IntegrationArtifactRevision!
  artifactRevisions: IntegrationExecutionArtifactRevisions!
  events: [IntegrationPreviewEvent!]!
  diagnostics: [IntegrationPreviewDiagnostic!]!
  routes: [IntegrationPreviewRoute!]!
  deliveries: [IntegrationPreviewDelivery!]!
  correlations: IntegrationPreviewCorrelations!
}

input SubmitEventInput {
  type: EventType!
  data: JSON!
  source: String!
  correlationId: String
}

# Batch submission inputs
input BatchMessageItem {
  format: SourceFormat!
  data: String!
  source: String!
  correlationId: String
  # Optional index for tracking in results (auto-assigned if not provided)
  index: Int
}

input BatchEventItem {
  type: EventType!
  data: JSON!
  source: String!
  correlationId: String
  index: Int
}

input SubmitBatchInput {
  # Submit multiple raw messages
  messages: [BatchMessageItem!]
  # Submit multiple pre-parsed events
  events: [BatchEventItem!]
  # Stop processing on first error (default: false, continue processing)
  stopOnError: Boolean
  # Enable parallel processing (default: false, sequential)
  parallel: Boolean
}

# Batch submission results
type BatchItemResult {
  # Index of the item in the input array
  index: Int!
  # Whether this item was processed successfully
  success: Boolean!
  # Event ID if successfully created
  eventId: ID
  # Warnings from parsing
  warnings: [ParseWarning!]!
  # Errors for this specific item
  errors: [String!]!
  # Workflow results for this item
  workflowResults: [WorkflowResult!]!
}

type BatchResult {
  # Total items submitted
  totalItems: Int!
  # Successfully processed items
  successCount: Int!
  # Failed items
  failureCount: Int!
  # Per-item results (in same order as input)
  results: [BatchItemResult!]!
  # Processing duration in milliseconds
  durationMs: Int!
}

type WorkflowResult {
  workflowName: String!
  routesMatched: Int!
  actionsExecuted: Int!
  errors: [String!]!
  duration: Int!
  runId: ID
  environment: String
  versionId: ID
}

type SubmitResult {
  success: Boolean!
  eventId: ID
  warnings: [ParseWarning!]!
  errors: [String!]!
  workflowResults: [WorkflowResult!]!
}

input CreateSubscriptionInput {
  name: String!
  server: String!
  criteria: String!
  endpoint: String!
}

input CreateWorkflowDefinitionInput {
  name: String!
  description: String
  createdBy: String
}

input UpdateWorkflowDefinitionInput {
  id: ID!
  name: String
  description: String
  status: String
  updatedBy: String
}

input SaveWorkflowVersionInput {
  workflowId: ID!
  yaml: String!
  notes: String
  createdBy: String
}

input PublishWorkflowVersionInput {
  workflowId: ID!
  versionId: ID!
  environment: String!
  publishedBy: String
}

input RollbackWorkflowVersionInput {
  workflowId: ID!
  targetVersionId: ID!
  environment: String!
  publishedBy: String
}

input ArchiveWorkflowDefinitionInput {
  workflowId: ID!
  archivedBy: String
}

input RequestWorkflowApprovalInput {
  workflowId: ID!
  targetVersionId: ID!
  environment: String!
  requestedBy: String
  comment: String
}

input ApproveWorkflowVersionInput {
  approvalRequestId: ID!
  reviewedBy: String
  comment: String
}

input RejectWorkflowVersionInput {
  approvalRequestId: ID!
  reviewedBy: String
  comment: String
}

type FhirSubscription {
  id: ID!
  name: String!
  status: String!
  criteria: String!
  server: String!
  endpoint: String!
  createdAt: DateTime!
}

type Mutation {
  # Evaluate one raw message with exact server-owned revisions. This operation
  # never persists a receipt/sample/run or invokes a destination.
  previewIntegrationMessage(input: PreviewIntegrationMessageInput!): IntegrationPreviewResult!

  # Submit a raw message for parsing and processing
  submitMessage(input: SubmitMessageInput!): SubmitResult!

  # Submit a pre-parsed event directly
  submitEvent(input: SubmitEventInput!): SubmitResult!

  # Submit multiple messages/events in a batch
  # Supports both raw messages and pre-parsed events
  # Returns per-item results for partial success handling
  submitBatch(input: SubmitBatchInput!): BatchResult!

  # Trigger a workflow manually
  triggerWorkflow(
    name: String!
    event: JSON!
    environment: String
    versionId: String
  ): WorkflowResult!

  # Workflow lifecycle management
  createWorkflowDefinition(input: CreateWorkflowDefinitionInput!): WorkflowDefinition!
  updateWorkflowDefinition(input: UpdateWorkflowDefinitionInput!): WorkflowDefinition!
  saveWorkflowVersion(input: SaveWorkflowVersionInput!): WorkflowVersion!
  publishWorkflowVersion(input: PublishWorkflowVersionInput!): WorkflowRelease!
  rollbackWorkflowVersion(input: RollbackWorkflowVersionInput!): WorkflowRelease!
  archiveWorkflowDefinition(input: ArchiveWorkflowDefinitionInput!): WorkflowDefinition!
  requestWorkflowApproval(input: RequestWorkflowApprovalInput!): WorkflowApprovalRequest!
  approveWorkflowVersion(input: ApproveWorkflowVersionInput!): WorkflowApprovalRequest!
  rejectWorkflowVersion(input: RejectWorkflowVersionInput!): WorkflowApprovalRequest!

  # FHIR subscription management
  createFhirSubscription(input: CreateSubscriptionInput!): FhirSubscription!
  deleteFhirSubscription(id: ID!): Boolean!
  pauseFhirSubscription(id: ID!): FhirSubscription!
  resumeFhirSubscription(id: ID!): FhirSubscription!
}

# =============================================================================
# Subscription Types (Real-time)
# =============================================================================

type WorkflowEventNotification {
  event: Event!
  workflow: String!
  routesMatched: [String!]!
  actionsExecuted: [String!]!
  duration: Int!
}

type Subscription {
  # Stream all events
  eventStream(filter: EventFilter): Event!

  # Stream events for a specific workflow
  workflowEvents(workflowName: String!): WorkflowEventNotification!

  # Stream events for a specific patient
  patientEvents(mrn: ID!): Event!
}

# =============================================================================
# Integration Session Engine
# =============================================================================

type IntegrationSession {
  id: ID!
  name: String!
  description: String
  archived: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  samples: [SessionSample!]!
  artifacts: [SessionArtifact!]!
  runs: [SessionRun!]!
  diagnostics: [SessionDiagnostic!]!
  currentProfileDraft: SessionArtifact
  currentWorkflowDraft: SessionArtifact
}

type SessionSample {
  id: ID!
  sessionId: ID!
  name: String!
  format: SourceFormat!
  source: String
  rawPayload: String
  payloadChecksum: String!
  payloadRef: String
  createdAt: DateTime!
}

type SessionArtifact {
  id: ID!
  revisionId: ID!
  sessionId: ID!
  kind: String!
  name: String!
  content: String!
  version: Int!
  digest: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SessionRun {
  id: ID!
  sessionId: ID!
  sampleId: ID
  status: String!
  profileRevisionId: ID
  profileRevisionDigest: String
  createdAt: DateTime!
  completedAt: DateTime
  stages: [RunStage!]!
  diagnostics: [SessionDiagnostic!]!
  events: [Event!]!
  warnings: [ParseWarning!]!
}

type RunStage {
  id: ID!
  name: String!
  status: String!
  startedAt: DateTime!
  completedAt: DateTime
  durationMs: Int!
  summary: String
}

type SessionDiagnostic {
  id: ID!
  sessionId: ID!
  runId: ID
  sampleId: ID
  severity: String!
  code: String!
  message: String!
  path: String
  fixSuggestion: String
  accepted: Boolean!
  acceptedAt: DateTime
  lineage: [LineageLink!]!
}

type LineageLink {
  sourcePath: String!
  targetPath: String
  description: String
}

type IntegrationBundle {
  sessionId: ID!
  exportedAt: DateTime!
  session: IntegrationSession!
  samples: [SessionSample!]!
  artifacts: [SessionArtifact!]!
  runs: [SessionRun!]!
  diagnostics: [SessionDiagnostic!]!
}

type IntegrationSessionEvent {
  id: ID!
  type: String!
  sessionId: ID!
  runId: ID
  message: String!
  timestamp: DateTime!
  session: IntegrationSession
  run: SessionRun
}

input CreateIntegrationSessionInput {
  name: String!
  description: String
}

input AddSessionSampleInput {
  sessionId: ID!
  name: String!
  format: SourceFormat!
  data: String!
  source: String
  retainRawPayload: Boolean
  payloadRef: String
}

input UpdateSessionArtifactInput {
  sessionId: ID!
  name: String
  content: String!
}

input RunSessionPreviewInput {
  sessionId: ID!
  sampleId: ID
  data: String
  format: SourceFormat
  source: String
}

input AcceptDiagnosticFixInput {
  sessionId: ID!
  diagnosticId: ID!
  acceptedBy: String
}

input ExportIntegrationBundleInput {
  sessionId: ID!
  includeRawPayload: Boolean
}

extend type Query {
  integrationSession(id: ID!): IntegrationSession
  integrationSessions(includeArchived: Boolean): [IntegrationSession!]!
  sessionSamples(sessionId: ID!): [SessionSample!]!
  sessionArtifacts(sessionId: ID!): [SessionArtifact!]!
  sessionRuns(sessionId: ID!): [SessionRun!]!
  sessionRun(id: ID!): SessionRun
  sessionDiagnostics(sessionId: ID!, runId: ID): [SessionDiagnostic!]!
}

extend type Mutation {
  createIntegrationSession(input: CreateIntegrationSessionInput!): IntegrationSession!
  archiveIntegrationSession(id: ID!): IntegrationSession!
  addSessionSample(input: AddSessionSampleInput!): SessionSample!
  updateSessionProfileDraft(input: UpdateSessionArtifactInput!): SessionArtifact!
  updateSessionWorkflowDraft(input: UpdateSessionArtifactInput!): SessionArtifact!
  runSessionPreview(input: RunSessionPreviewInput!): SessionRun!
  acceptDiagnosticFix(input: AcceptDiagnosticFixInput!): SessionDiagnostic!
  exportIntegrationBundle(input: ExportIntegrationBundleInput!): IntegrationBundle!
}

extend type Subscription {
  integrationSessionEvents(sessionId: ID!): IntegrationSessionEvent!
  sessionRunEvents(sessionId: ID!, runId: ID): IntegrationSessionEvent!
}

# =============================================================================
# Event Sourcing / Projection Types
# =============================================================================

# Timeline event in a patient's history
type TimelineEvent {
  position: Int!
  timestamp: DateTime!
  eventType: String!
  summary: String!
  streamId: String!
  source: String
}

# Patient timeline projection (chronological event history)
type PatientTimeline {
  mrn: ID!
  events: [TimelineEvent!]!
  lastUpdated: DateTime!
  eventCount: Int!
}

# Event count by category
type EventTypeCount {
  eventType: String!
  count: Int!
}

type SourceCount {
  source: String!
  count: Int!
}

# Event statistics projection (aggregate counts)
type EventStatistics {
  totalEvents: Int!
  byType: [EventTypeCount!]!
  bySource: [SourceCount!]!
}

# Active encounter (currently admitted patient)
type ActiveEncounter {
  id: ID!
  patientMrn: ID!
  patientName: String
  class: String!
  location: String
  unit: String
  room: String
  bed: String
  admitTime: DateTime!
  provider: String
  lastUpdated: DateTime!
}

# Projection status information
type ProjectionStatus {
  name: String!
  checkpoint: Int!
  lastPosition: Int!
  behind: Int!
  status: String!
}

# Extend Query with projection queries
extend type Query {
  # Get a patient's event timeline
  patientTimeline(
    mrn: ID!
    fromTimestamp: DateTime
    toTimestamp: DateTime
    limit: Int = 100
  ): PatientTimeline

  # Get event statistics
  eventStatistics: EventStatistics!

  # Get active encounters (current census)
  activeEncounters(
    location: String
    unit: String
    class: String
  ): [ActiveEncounter!]!

  # Get a specific active encounter
  activeEncounter(id: ID!): ActiveEncounter

  # Get active encounter by patient
  activeEncounterByPatient(mrn: ID!): ActiveEncounter

  # Get projection status
  projectionStatus: [ProjectionStatus!]!

  # =========================================================================
  # Source Profile Queries
  # =========================================================================

  # List all source profiles
  profiles(activeOnly: Boolean = true): [SourceProfile!]!

  # Get a specific profile by ID
  profile(id: ID!): SourceProfile

  # Get revision history for a profile
  profileRevisions(id: ID!): [ProfileRevision!]!
}

# =============================================================================
# Source Profile Types (Semantic Mapping Configuration)
# =============================================================================

# Source profile for configuring parsing behavior
type SourceProfile {
  id: ID!
  name: String!
  version: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  createdBy: String
  isActive: Boolean!

  # Configuration sections
  hl7v2: HL7v2Config
  identifiers: IdentifierConfig
  terminology: TerminologyConfig
}

# HL7v2 parsing configuration
type HL7v2Config {
  defaultVersion: String!
  timezone: String!
  tolerance: ToleranceConfig
  eventClassifications: [EventClassificationRule!]!
}

# Tolerance configuration - what parsing anomalies to accept
type ToleranceConfig {
  missingSegments: [String!]!
  nteAnywhere: Boolean!
  extraComponents: Boolean!
  unknownSegments: Boolean!
  nonStandardDelimiters: Boolean!
}

# Event classification rule - maps message types to semantic events
type EventClassificationRule {
  messageType: String!
  condition: String
  eventType: String!
  priority: Int!
}

# Identifier handling configuration
type IdentifierConfig {
  assigningAuthorities: [AssigningAuthority!]!
  primaryIdPreference: [IDPreferenceRule!]!
  validation: ValidationSettingsConfig
  normalization: NormalizationSettingsConfig
}

# Assigning authority mapping
type AssigningAuthority {
  code: String!
  system: String!
  name: String
}

# Primary ID preference rule
type IDPreferenceRule {
  type: String!
  assignerContains: String
  priority: Int!
}

# Identifier validation settings
type ValidationSettingsConfig {
  npi: ValidatorSetting
  mbi: ValidatorSetting
  ssn: ValidatorSetting
}

# Single validator setting
type ValidatorSetting {
  enabled: Boolean!
  onInvalid: String!
}

# Identifier normalization settings
type NormalizationSettingsConfig {
  ssnStripDashes: Boolean!
  ssnRejectPatterns: [String!]!
  phoneNormalize: Boolean!
  phoneFormat: String
}

# Terminology mapping configuration
type TerminologyConfig {
  mappings: [TerminologyMappingTable!]!
}

# Terminology mapping table
type TerminologyMappingTable {
  id: ID!
  sourceSystem: String!
  targetSystem: String!
  entries: [TerminologyMappingEntry!]!
}

# Single terminology mapping entry
type TerminologyMappingEntry {
  sourceCode: String!
  targetCode: String!
  display: String
}

# Profile revision (version history)
type ProfileRevision {
  version: String!
  createdAt: DateTime!
  createdBy: String
  changeSummary: String
}

# =============================================================================
# Source Profile Input Types
# =============================================================================

input CreateProfileInput {
  id: ID!
  name: String!
}

input UpdateProfileInput {
  name: String
  hl7v2: HL7v2ConfigInput
  identifiers: IdentifierConfigInput
  terminology: TerminologyConfigInput
}

input HL7v2ConfigInput {
  defaultVersion: String
  timezone: String
  tolerance: ToleranceConfigInput
  eventClassifications: [EventClassificationRuleInput!]
}

input ToleranceConfigInput {
  missingSegments: [String!]
  nteAnywhere: Boolean
  extraComponents: Boolean
  unknownSegments: Boolean
  nonStandardDelimiters: Boolean
}

input EventClassificationRuleInput {
  messageType: String!
  condition: String
  eventType: String!
  priority: Int!
}

input IdentifierConfigInput {
  assigningAuthorities: [AssigningAuthorityInput!]
  primaryIdPreference: [IDPreferenceRuleInput!]
  validation: ValidationSettingsInput
  normalization: NormalizationSettingsInput
}

input AssigningAuthorityInput {
  code: String!
  system: String!
  name: String
}

input IDPreferenceRuleInput {
  type: String!
  assignerContains: String
  priority: Int!
}

input ValidationSettingsInput {
  npi: ValidatorSettingInput
  mbi: ValidatorSettingInput
  ssn: ValidatorSettingInput
}

input ValidatorSettingInput {
  enabled: Boolean!
  onInvalid: String!
}

input NormalizationSettingsInput {
  ssnStripDashes: Boolean
  ssnRejectPatterns: [String!]
  phoneNormalize: Boolean
  phoneFormat: String
}

input TerminologyConfigInput {
  mappings: [TerminologyMappingTableInput!]
}

input TerminologyMappingTableInput {
  id: ID!
  sourceSystem: String!
  targetSystem: String!
  entries: [TerminologyMappingEntryInput!]
}

input TerminologyMappingEntryInput {
  sourceCode: String!
  targetCode: String!
  display: String
}

# =============================================================================
# Source Profile Mutations
# =============================================================================

extend type Mutation {
  # Create a new source profile
  createProfile(input: CreateProfileInput!): SourceProfile!

  # Update an existing profile
  updateProfile(id: ID!, input: UpdateProfileInput!): SourceProfile!

  # Delete a profile (soft delete)
  deleteProfile(id: ID!): Boolean!

  # Duplicate a profile
  duplicateProfile(id: ID!, newId: ID!, newName: String!): SourceProfile!
}

# =============================================================================
# parsePreview Extension for Profiles
# =============================================================================

# Extend parsePreview to accept an optional profile ID
extend type Query {
  # Parse preview with a specific profile applied
  parsePreviewWithProfile(
    format: SourceFormat!
    data: String!
    source: String
    profileId: ID
  ): ParseResult!

  # Explain warnings using LLM (with caching)
  # Returns human-readable explanations for parse warnings
  explainWarnings(
    warnings: [ParseWarningInput!]!
    format: SourceFormat!
  ): [ExplainedWarning!]!

  # =========================================================================
  # LLM-Powered Clinical Extraction (Phase 7A)
  # =========================================================================

  # Extract clinical entities from unstructured text using LLM
  extractEntities(input: ExtractEntitiesInput!): ExtractionResult!

  # Safe runtime status for LLM-powered features
  llmCapability: LLMCapability!

  # =========================================================================
  # LLM-Powered Data Quality Analysis (Phase 7B)
  # =========================================================================

  # Analyze data quality of an event using LLM
  analyzeQuality(input: AnalyzeQualityInput!): DataQualityScore!

  # Quick quality score without LLM (rule-based)
  quickQualityScore(event: JSON!): DataQualityScore!

  # =========================================================================
  # LLM-Powered Workflow Explanation (Phase 7C)
  # =========================================================================

  # Get human-readable explanation of a workflow
  explainWorkflow(input: ExplainWorkflowInput!): WorkflowExplanation!

  # =========================================================================
  # LLM-Powered Message Classification (Phase 8C)
  # =========================================================================

  # Classify a message to suggest tags and event type
  classifyMessage(input: ClassifyMessageInput!): MessageClassification!
}

# =============================================================================
# LLM Clinical Entity Extraction Types (Phase 7A)
# =============================================================================

input ExtractEntitiesInput {
  # The clinical text to extract entities from
  text: String!
  # Type of clinical document (progress_note, discharge_summary, etc.)
  documentType: String
  # Patient age for context
  patientAge: Int
  # Patient gender for context
  patientGender: String
  # Minimum confidence threshold (0.0-1.0, default 0.7)
  minConfidence: Float = 0.7
  # Include entities that were negated in the text
  includeNegated: Boolean = false
}

type ExtractedCondition {
  name: String!
  code: String
  codeSystem: String
  confidence: Float!
  negated: Boolean
  textSpan: String
  status: String
}

type ExtractedMedication {
  name: String!
  code: String
  codeSystem: String
  dose: String
  route: String
  frequency: String
  confidence: Float!
  negated: Boolean
  textSpan: String
}

type ExtractedVitalSign {
  name: String!
  loincCode: String
  value: String!
  unit: String
  confidence: Float!
  interpretation: String
  textSpan: String
}

type ExtractedAllergy {
  substance: String!
  code: String
  codeSystem: String
  severity: String
  reaction: String
  confidence: Float!
  negated: Boolean
  textSpan: String
}

type ExtractedProcedure {
  name: String!
  code: String
  codeSystem: String
  status: String
  confidence: Float!
  negated: Boolean
  textSpan: String
}

type ExtractionResult {
  conditions: [ExtractedCondition!]!
  medications: [ExtractedMedication!]!
  vitalSigns: [ExtractedVitalSign!]!
  allergies: [ExtractedAllergy!]!
  procedures: [ExtractedProcedure!]!
  overallConfidence: Float!
  processingTimeMs: Int!
  model: String
}

type LLMCapability {
  enabled: Boolean!
  configured: Boolean!
  providerBaseURLHost: String
  defaultModel: String
  qualityModel: String
  status: String!
  warnings: [String!]!
  features: [LLMFeatureCapability!]!
}

# =============================================================================
# LLM Data Quality Analysis Types (Phase 7B)
# =============================================================================

input AnalyzeQualityInput {
  # The event data to analyze (as JSON)
  event: JSON!
  # The type of event being analyzed
  eventType: EventType!
}

type DataQualityScore {
  overallScore: Float!
  dimensions: QualityDimensions!
  issues: [DataQualityIssue!]!
  recommendations: [QualityRecommendation!]!
  processingTimeMs: Int
  model: String
}

type QualityDimensions {
  # Are all required fields present?
  completeness: Float!
  # Are values in correct format and valid?
  accuracy: Float!
  # Are related fields internally consistent?
  consistency: Float!
  # Does data follow HL7/FHIR/EDI standards?
  conformance: Float!
  # Is the data current and timestamps reasonable?
  timeliness: Float!
}

type DataQualityIssue {
  dimension: String!
  severity: String!
  field: String
  description: String!
  actualValue: String
  expectedValue: String
}

type QualityRecommendation {
  priority: Int!
  category: String
  title: String!
  description: String!
  impact: String
}

# =============================================================================
# LLM Workflow Copilot Types (Phase 7C)
# =============================================================================

input GenerateWorkflowInput {
  # Natural language description of what the workflow should do
  description: String!
  # Available event types for context
  eventTypes: [String!]
  # Available action types for context
  actionTypes: [String!]
}

type GeneratedWorkflow {
  yaml: String!
  explanation: String!
  warnings: [String!]!
}

input ExplainWorkflowInput {
  # The workflow YAML to explain
  workflowYaml: String!
  # Target audience: technical, business, compliance, operations
  audience: String
}

type WorkflowExplanation {
  summary: String!
  description: String!
  routeExplanations: [RouteExplanation!]!
  diagram: String
  warnings: [String!]!
}

type RouteExplanation {
  name: String!
  trigger: String!
  actions: [String!]!
  description: String!
}

# =============================================================================
# LLM Message Classification Types (Phase 8C)
# =============================================================================

input ClassifyMessageInput {
  # The raw message data
  data: String!
  # The format of the message
  format: SourceFormat!
}

type MessageClassification {
  # Detected message type (e.g., ADT^A01, ORU^R01)
  messageType: String!
  # Suggested semantic event type
  eventType: EventType
  # Suggested tags for categorization
  suggestedTags: [String!]!
  # Confidence in the classification
  confidence: Float!
  # Brief description of what the message contains
  summary: String
}

# =============================================================================
# LLM Workflow Generation Mutation (Phase 7C)
# =============================================================================

extend type Mutation {
  # Generate a workflow from natural language description
  generateWorkflow(input: GenerateWorkflowInput!): GeneratedWorkflow!

  # Dry-run a workflow YAML against sample events without executing actions
  dryRunWorkflow(input: DryRunWorkflowInput!): DryRunResult!
}

# =============================================================================
# Dry-Run Simulation Types (MVP 3)
# =============================================================================

input DryRunWorkflowInput {
  # The workflow YAML to simulate
  yaml: String!
  # Sample events to test against (as JSON objects)
  events: [JSON!]!
}

type DryRunRouteResult {
  routeName: String!
  matched: Boolean!
  actionsWouldRun: Int!
  skipReason: String
}

type DryRunResult {
  routeResults: [DryRunRouteResult!]!
  warnings: [String!]!
  validationErrors: [String!]!
}

# =============================================================================
# Terminology Mapping Types (Phase: Custom Mapping Upload)
# =============================================================================

enum MappingEquivalence {
  EQUIVALENT
  WIDER
  NARROWER
  INEXACT
}

enum MappingOrigin {
  CSV_UPLOAD
  APPROVED_AUTOROUTE
  MANUAL
}

# A custom code mapping
type CodeMapping {
  id: ID!
  sourceSystem: String!
  sourceCode: String!
  sourceDisplay: String
  targetSystem: String!
  targetCode: String!
  targetDisplay: String
  equivalence: MappingEquivalence!
  confidence: Float
  comment: String
  origin: MappingOrigin!
  profileId: String
  uploadBatchId: ID
  createdAt: DateTime!
  createdBy: String
  approvedAt: DateTime
  approvedBy: String
}

# Validation error in an upload
type UploadValidationError {
  row: Int!
  column: String
  message: String!
}

# Batch upload tracking
type UploadBatch {
  id: ID!
  filename: String!
  sourceSystem: String
  targetSystem: String
  profileId: String
  totalRows: Int!
  validRows: Int!
  duplicateRows: Int!
  errorRows: Int!
  uploadedAt: DateTime!
  uploadedBy: String
  validationErrors: [UploadValidationError!]!
}

# Result of a mapping upload operation
type UploadMappingResult {
  batch: UploadBatch!
  mappingsCreated: Int!
  mappingsSkipped: Int!
  preview: [CodeMapping!]!
}

# Paginated list of mappings
type CodeMappingConnection {
  nodes: [CodeMapping!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

# =============================================================================
# Terminology Mapping Inputs
# =============================================================================

input UploadMappingCSVInput {
  # CSV content (can be raw string or base64 encoded)
  csv: String!
  filename: String!
  # Default system if not specified in CSV columns
  defaultSourceSystem: String
  defaultTargetSystem: String
  # Scope to a specific profile (optional)
  profileId: String
  # If true, only validate without persisting
  dryRun: Boolean = false
}

input CreateMappingInput {
  sourceSystem: String!
  sourceCode: String!
  sourceDisplay: String
  targetSystem: String!
  targetCode: String!
  targetDisplay: String
  equivalence: MappingEquivalence = EQUIVALENT
  confidence: Float
  origin: MappingOrigin
  comment: String
  profileId: String
}

input ListMappingsInput {
  sourceSystem: String
  targetSystem: String
  profileId: String
  origin: MappingOrigin
  uploadBatchId: ID
  equivalence: MappingEquivalence
  createdAfter: DateTime
  createdBefore: DateTime
  first: Int = 50
  offset: Int = 0
}

input UpdateMappingInput {
  id: ID!
  sourceDisplay: String
  targetDisplay: String
  equivalence: MappingEquivalence
  confidence: Float
  comment: String
}

# =============================================================================
# Terminology Mapping Queries & Mutations
# =============================================================================

extend type Query {
  # List custom mappings with optional filters
  listMappings(input: ListMappingsInput): CodeMappingConnection!

  # Get a specific mapping by ID
  getMapping(id: ID!): CodeMapping

  # Look up a mapping by source code
  lookupMapping(
    sourceSystem: String!
    sourceCode: String!
    targetSystem: String!
    profileId: String
  ): CodeMapping

  # Get an upload batch by ID
  getUploadBatch(id: ID!): UploadBatch

  # Export mappings to CSV format
  exportMappingsCSV(input: ListMappingsInput): String!
}

extend type Mutation {
  # Upload mappings from CSV
  uploadMappingCSV(input: UploadMappingCSVInput!): UploadMappingResult!

  # Create a single mapping manually
  createMapping(input: CreateMappingInput!): CodeMapping!

  # Update an existing mapping
  updateMapping(input: UpdateMappingInput!): CodeMapping!

  # Delete a mapping by ID
  deleteMapping(id: ID!): Boolean!

  # Delete all mappings from an upload batch
  deleteMappingBatch(batchId: ID!): Int!
}

# =============================================================================
# Autoroute Types (LLM-Powered Mapping Suggestions)
# =============================================================================

enum AutorouteDecision {
  PERSISTENT_HIT
  AUTOROUTE_HIGH_CONF
  AUTOROUTE_MED_CONF
  AUTOROUTE_LOW_CONF
  NO_MATCH
}

# A mapping candidate from autoroute
type MappingCandidate {
  code: String!
  display: String!
  system: String!
  confidence: Float!
  equivalence: MappingEquivalence
  reasoning: String
  score: Float
}

# Step in the decision-making process
type AutorouteStep {
  step: String!
  result: String!
  durationMs: Int!
  metadata: JSON
}

# Full decision trace for auditability
type AutorouteTrace {
  traceId: String!
  timestamp: DateTime!
  steps: [AutorouteStep!]!
  totalDurationMs: Int!
}

# Result from resolveMapping query
type ResolveMappingResult {
  found: Boolean!
  decision: AutorouteDecision!
  mapping: CodeMapping
  candidates: [MappingCandidate!]!
  confidence: Float
  reasoning: String
  trace: AutorouteTrace
  durationMs: Int!
}

# =============================================================================
# Autoroute Inputs
# =============================================================================

input ResolveMappingInput {
  sourceCode: String!
  sourceSystem: String!
  sourceDisplay: String
  targetSystem: String!
  profileId: String
  # Allow LLM-powered autorouting (default: true)
  allowAutoroute: Boolean = true
  # Minimum confidence for autoroute results (default: 0.7)
  minConfidence: Float = 0.7
}

input SuggestMappingsInput {
  sourceCode: String!
  sourceSystem: String!
  sourceDisplay: String
  targetSystem: String!
  # Maximum number of candidates to return (default: 5)
  maxCandidates: Int = 5
}

# =============================================================================
# Autoroute Queries
# =============================================================================

extend type Query {
  # Resolve a mapping: checks persistent first, then uses LLM autoroute
  resolveMapping(input: ResolveMappingInput!): ResolveMappingResult!

  # Get autoroute suggestions only (for discovery/review)
  suggestMappings(input: SuggestMappingsInput!): [MappingCandidate!]!
}

# =============================================================================
# Pending Autoroute Review Types
# =============================================================================

enum PendingAutorouteStatus {
  PENDING
  APPROVED
  REJECTED
  EXPIRED
}

# A pending autoroute suggestion awaiting human review
type PendingAutoroute {
  id: ID!
  sourceSystem: String!
  sourceCode: String!
  sourceDisplay: String
  targetSystem: String!
  suggestedCode: String!
  suggestedDisplay: String
  confidence: Float!
  equivalence: MappingEquivalence
  reasoning: String
  decisionTrace: AutorouteTrace
  alternates: [MappingCandidate!]!
  status: PendingAutorouteStatus!
  createdAt: DateTime!
  expiresAt: DateTime
  reviewedAt: DateTime
  reviewedBy: String
  rejectionReason: String
}

# Paginated list of pending autoroutes
type PendingAutorouteConnection {
  nodes: [PendingAutoroute!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

# Result of a bulk approval operation
type BulkApproveResult {
  approved: Int!
  skipped: Int!
  mappings: [CodeMapping!]!
}

# Statistics about pending autoroutes
type PendingAutorouteStats {
  pendingCount: Int!
  approvedCount: Int!
  rejectedCount: Int!
  expiredCount: Int!
  avgConfidence: Float
}

# =============================================================================
# Pending Autoroute Inputs
# =============================================================================

input ListPendingAutoroutesInput {
  status: PendingAutorouteStatus
  minConfidence: Float
  sourceSystem: String
  targetSystem: String
  first: Int = 50
  offset: Int = 0
}

input ApprovePendingAutorouteInput {
  id: ID!
  # Optional override for equivalence
  equivalence: MappingEquivalence
  # Optional comment to add to the mapping
  comment: String
}

input RejectPendingAutorouteInput {
  id: ID!
  reason: String!
}

input BulkApproveInput {
  # Minimum confidence threshold (default: 0.95)
  minConfidence: Float = 0.95
  # Maximum number to approve (default: 100)
  maxCount: Int = 100
}

# =============================================================================
# Pending Autoroute Queries & Mutations
# =============================================================================

extend type Query {
  # List pending autoroutes for review
  listPendingAutoroutes(input: ListPendingAutoroutesInput): PendingAutorouteConnection!

  # Get a specific pending autoroute by ID
  getPendingAutoroute(id: ID!): PendingAutoroute

  # Get statistics about pending autoroutes
  pendingAutorouteStats: PendingAutorouteStats!
}

extend type Mutation {
  # Approve a pending autoroute and create a persistent mapping
  approvePendingAutoroute(input: ApprovePendingAutorouteInput!): CodeMapping!

  # Reject a pending autoroute
  rejectPendingAutoroute(input: RejectPendingAutorouteInput!): Boolean!

  # Bulk approve high-confidence autoroutes
  bulkApprovePendingAutoroutes(input: BulkApproveInput): BulkApproveResult!
}

# =============================================================================
# Temporal Workflow Orchestration
# =============================================================================

# Status of a Temporal workflow execution
enum TemporalWorkflowStatus {
  RUNNING
  COMPLETED
  FAILED
  CANCELED
  TERMINATED
  CONTINUED_AS_NEW
  TIMED_OUT
}

# A Temporal workflow execution
type TemporalWorkflow {
  # Workflow execution ID
  id: ID!

  # Run ID (unique per execution attempt)
  runId: String!

  # Workflow type name
  workflowType: String!

  # Current status
  status: TemporalWorkflowStatus!

  # Task queue the workflow is running on
  taskQueue: String!

  # When the workflow started
  startTime: DateTime!

  # When the workflow completed (if finished)
  closeTime: DateTime

  # Workflow execution duration in milliseconds
  durationMs: Int

  # Input provided to the workflow (JSON)
  input: JSON

  # Result of the workflow (JSON, if completed)
  result: JSON

  # Error message if failed
  error: String
}

# Connection type for paginated workflow list
type TemporalWorkflowConnection {
  nodes: [TemporalWorkflow!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

# Input for starting a terminology review workflow
input StartTerminologyReviewInput {
  # Source code to map
  sourceCode: String!

  # Source system URI
  sourceSystem: String!

  # Human-readable source description (helps semantic matching)
  sourceDisplay: String

  # Target vocabulary URI (e.g., "http://loinc.org")
  targetSystem: String!

  # Optional profile context
  profileId: String

  # Confidence threshold for auto-approval (default: 0.95)
  autoApproveThreshold: Float

  # How long to wait for human review before expiring (default: 7 days)
  reviewTimeoutDays: Int
}

# Result of starting a terminology review workflow
type StartTerminologyReviewResult {
  # Workflow execution ID
  workflowId: String!

  # Run ID
  runId: String!

  # Whether the workflow was started (false if already exists)
  started: Boolean!
}

# Input for signaling a review decision
input SignalReviewDecisionInput {
  # Workflow ID to signal
  workflowId: String!

  # Whether to approve the mapping
  approved: Boolean!

  # Who made the decision
  decidedBy: String!

  # Override the equivalence (optional)
  equivalenceOverride: MappingEquivalence

  # Comment for approval
  comment: String

  # Reason for rejection
  rejectionReason: String
}

# Filter for listing workflows
input TemporalWorkflowFilter {
  # Filter by workflow type
  workflowType: String

  # Filter by status
  status: TemporalWorkflowStatus

  # Filter by start time (after)
  startTimeAfter: DateTime

  # Filter by start time (before)
  startTimeBefore: DateTime
}

extend type Query {
  # Get a specific Temporal workflow by ID
  temporalWorkflow(workflowId: String!, runId: String): TemporalWorkflow

  # List Temporal workflows with optional filters
  temporalWorkflows(
    filter: TemporalWorkflowFilter
    first: Int = 100
    after: String
  ): TemporalWorkflowConnection!
}

extend type Mutation {
  # Start a terminology review workflow
  startTerminologyReview(input: StartTerminologyReviewInput!): StartTerminologyReviewResult!

  # Signal a review decision to a running workflow
  signalReviewDecision(input: SignalReviewDecisionInput!): Boolean!

  # Cancel a running workflow
  cancelTemporalWorkflow(workflowId: String!, reason: String): Boolean!
}

# =============================================================================
# Debug & Trace Types
# =============================================================================

type DebugSession {
  id: ID!
  workflowId: String!
  state: String!
  breakpoints: [Breakpoint!]!
  steps: [WorkflowDebugStep!]!
  createdAt: DateTime!
}

type Breakpoint {
  id: ID!
  type: String!
  name: String!
  enabled: Boolean!
}

type WorkflowDebugStep {
  stepNumber: Int!
  kind: String!
  name: String!
  variables: JSON
  timestamp: DateTime!
  spanName: String!
}

type ParseEvent {
  segmentIndex: Int!
  segmentType: String!
  rawSegment: String!
  fields: JSON
  warnings: [String!]!
  isComplete: Boolean!
}

type TraceSpan {
  id: ID!
  name: String!
  parentId: ID
  startTime: DateTime!
  endTime: DateTime
  status: String!
  attributes: JSON
  events: [TraceSpanEvent!]!
}

type TraceSpanEvent {
  name: String!
  timestamp: DateTime!
  attributes: JSON
}

# Debug inputs
input StartDebugSessionInput {
  workflowYaml: String!
  event: JSON!
}

input SetBreakpointInput {
  sessionId: ID!
  type: String!
  name: String!
}

input LiveParseInput {
  message: String!
  format: SourceFormat!
}

# Extend existing types
extend type Query {
  debugSession(id: ID!): DebugSession
  workflowRunTrace(runId: ID!): [TraceSpan!]!
}

extend type Mutation {
  startDebugSession(input: StartDebugSessionInput!): DebugSession!
  debugStep(sessionId: ID!): WorkflowDebugStep
  debugContinue(sessionId: ID!): WorkflowDebugStep
  debugSetBreakpoint(input: SetBreakpointInput!): Breakpoint!
  debugRemoveBreakpoint(sessionId: ID!, breakpointId: ID!): Boolean!
  debugEndSession(sessionId: ID!): Boolean!
}

extend type Subscription {
  liveParseStream(input: LiveParseInput!): ParseEvent!
  debugStepEvent(sessionId: ID!): WorkflowDebugStep!
}
