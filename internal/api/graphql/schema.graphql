# =============================================================================
# Terminology Mapping Types (Phase: Custom Mapping Upload)
# =============================================================================

enum MappingEquivalence {
  EQUIVALENT
  WIDER
  NARROWER
  INEXACT
}

enum MappingOrigin {
  CSV_UPLOAD
  APPROVED_AUTOROUTE
  MANUAL
}

# A custom code mapping
type CodeMapping {
  id: ID!
  sourceSystem: String!
  sourceCode: String!
  sourceDisplay: String
  targetSystem: String!
  targetCode: String!
  targetDisplay: String
  equivalence: MappingEquivalence!
  confidence: Float
  comment: String
  origin: MappingOrigin!
  profileId: String
  uploadBatchId: ID
  createdAt: DateTime!
  createdBy: String
  approvedAt: DateTime
  approvedBy: String
}

# Validation error in an upload
type UploadValidationError {
  row: Int!
  column: String
  message: String!
}

# Batch upload tracking
type UploadBatch {
  id: ID!
  filename: String!
  sourceSystem: String
  targetSystem: String
  profileId: String
  totalRows: Int!
  validRows: Int!
  duplicateRows: Int!
  errorRows: Int!
  uploadedAt: DateTime!
  uploadedBy: String
  validationErrors: [UploadValidationError!]!
}

# Result of a mapping upload operation
type UploadMappingResult {
  batch: UploadBatch!
  mappingsCreated: Int!
  mappingsSkipped: Int!
  preview: [CodeMapping!]!
}

# Paginated list of mappings
type CodeMappingConnection {
  nodes: [CodeMapping!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

# =============================================================================
# Terminology Mapping Inputs
# =============================================================================

input UploadMappingCSVInput {
