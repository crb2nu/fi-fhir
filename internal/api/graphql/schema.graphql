# =============================================================================
# Connection catalog (.loom/38 C-0)
#
# Named, editable declarations of the endpoints the engine listens on (sources:
# MLLP, HTTP, BATCH_S3, BATCH_SFTP) and delivers to (destinations: HTTPS, FHIR,
# KAFKA). A draft is mutable under an optimistic version. Compiling it runs the
# kind's own document constructor and stores the exact bytes `serve` mounts as
# an immutable, content-addressed revision. Secrets are bindings end to end:
# no field here can carry a secret value, and a spec key that looks like one is
# refused. Nothing here hot-loads a connection; engineRuntime reports what this
# replica actually composed at startup.
#
# Reads require integration.operator; writes additionally require
# integration.deployment.operator, re-checked by the catalog service.
# =============================================================================

enum ConnectionDirection {
  SOURCE
  DESTINATION
}

enum ConnectionKind {
  MLLP
  HTTP
  BATCH_S3
  BATCH_SFTP
  HTTPS
  FHIR
  KAFKA
}

type Connection {
  """The connection's artifact ID; every compiled revision carries it."""
  id: ID!
  direction: ConnectionDirection!
  kind: ConnectionKind!
  name: String!
  description: String!
  """The kind's spec: snake_case, non-secret, and possibly incomplete (compile reports what is missing)."""
  spec: JSON!
  secretBindings: [ConnectionSecretBinding!]!
  """Optimistic draft version, starting at 1. Every update and archive advances it; compile does not."""
  version: Int!
  archived: Boolean!
  latestRevision: ConnectionRevision
  """Lifecycle definition revisions that name any revision of this connection."""
  references: [ConnectionReference!]!
  runtime: ConnectionRuntimeState!
  createdBy: OperatorPrincipal!
  createdAt: DateTime!
  updatedBy: OperatorPrincipal!
  updatedReason: String!
  updatedAt: DateTime!
}

"""A reference to a secret: never its value."""
type ConnectionSecretBinding {
  name: String!
  """env, file, vault, aws-ssm, or k8s."""
  provider: String!
  key: String!
  version: String
}

type ConnectionRevision {
  artifactId: ID!
  """Revision IDs are 1, 2, ... per connection."""
  revisionId: ID!
  digest: String!
  direction: ConnectionDirection!
  kind: ConnectionKind!
  """The exact bytes serve mounts."""
  revisionJson: String!
  """The draft version this revision was compiled from."""
  compiledFromVersion: Int!
  """
  The runtime source identity the revision carries (source_id); null for a
  destination. A definition binds it as source.sourceId (.loom/42 E-1).
  """
  sourceId: ID
  """production or sandbox; null for a source."""
  destinationClass: String
  """
  The secret binding names this revision's own ValidateAgainst requires a
  definition to bind. Names only, never a reference or a value.
  """
  secretBindingNames: [String!]!
  createdBy: OperatorPrincipal!
  createdReason: String!
  createdAt: DateTime!
}

"""
One lifecycle definition revision that names a revision of this connection,
as its source or as one of its destinations.
"""
type ConnectionReference {
  definitionId: ID!
  """The referencing definition's revision ID."""
  revisionId: ID!
  """The digest of this connection's revision that the definition names."""
  digest: String!
  """The definition revision's lifecycle state (draft ... deployed, paused, retired)."""
  state: String!
  health: String!
}

type ConnectionRuntimeState {
  """True when this replica runs a revision of this connection."""
  mounted: Boolean!
  """mllp-listener, batch-runner, http-ingress, or delivery-registry; null when not mounted."""
  role: String
  """Which revision is mounted, and by what; null when not mounted."""
  detail: String
  """
  The mounted revision's id; null when not mounted and for http-ingress,
  which is bound by definition id rather than a mounted document.
  """
  revisionId: ID
  """The mounted revision's digest; null exactly when revisionId is."""
  digest: String
  """
  Replicas with a fresh heartbeat (engineRuntime.observations, stale false)
  that report a revision of this connection mounted. Unlike mounted, this is
  every replica's report, not only the one that answered.
  """
  observedReplicas: Int!
  """Replicas with any fresh heartbeat; observedReplicas of totalReplicas."""
  totalReplicas: Int!
}

"""
One field-level finding. path is JSON dot form relative to the spec
(timeouts.read_seconds, s3.bucket, clients.allowed_cidrs[0]) or
secret_bindings[i].<field>; empty for the document as a whole. Every code but
UNUSED_BINDING blocks compile.
"""
type ConnectionProblem {
  code: String!
  path: String!
  message: String!
}

type ConnectionCompileResult {
  connection: Connection!
  """Null exactly when a blocking problem was found; nothing was written then."""
  revision: ConnectionRevision
  problems: [ConnectionProblem!]!
}

input CreateConnectionInput {
  id: ID!
  direction: ConnectionDirection!
  kind: ConnectionKind!
  name: String!
  description: String
  spec: JSON!
  secretBindings: [ConnectionSecretBindingInput!]
  reason: String!
}

input UpdateConnectionInput {
  id: ID!
  """Optimistic concurrency guard; a stale version is rejected, never retried."""
  expectedVersion: Int!
  name: String
  description: String
  """Replaces the stored spec when present."""
  spec: JSON
  """Replaces the stored bindings when present, including with an empty list."""
  secretBindings: [ConnectionSecretBindingInput!]
  reason: String!
}

input ConnectionSecretBindingInput {
  name: String!
  provider: String!
  key: String!
  version: String
}

input ConnectionCommandInput {
  id: ID!
  expectedVersion: Int!
  reason: String!
}

input ValidateConnectionSpecInput {
  kind: ConnectionKind!
  spec: JSON!
  secretBindings: [ConnectionSecretBindingInput!]
}

"""
What this replica composed at startup: PHI-free and secret-free. Process
properties are an allowlist of the documented serve settings; a secret one
renders only as "set" or "unset".
"""
type EngineRuntime {
  version: String!
  tenantId: ID!
  """hostname-pid, as the MLLP rate quota derives it."""
  replicaId: String!
  """GraphQL authentication mode: static or oidc."""
  authMode: String!
  trustedNetwork: Boolean!
  accessIdentity: Boolean!
  controlPlane: Boolean!
  integrationSessions: Boolean!
  streaming: Boolean!
  retentionPurge: Boolean!
  llmConfigured: Boolean!
  registry: EngineRegistry!
  """Exactly four rows, enabled or not: http, mllp, batch, delivery."""
  adapters: [EngineAdapter!]!
  """Null when no delivery identity registry is loaded."""
  destinationIdentity: EngineDestinationIdentity
  """Every forward-only migration ledger and the version this binary expects."""
  ledgers: [EngineLedger!]!
  properties: [EngineProperty!]!
  """
  Every replica's heartbeat rows from the connection ledger, this one's
  included, ordered by replica and adapter. Empty when the connection catalog
  is not configured.
  """
  observations: [EngineObservation!]!
}

"""
One replica's report of one adapter: which document it mounted, and when it
last said so. adapter is http, mllp, batch, delivery, or
destination:<artifact id>. artifactId, revisionId, and digest are null when the
adapter is disabled or mounts no document of its own.
"""
type EngineObservation {
  replicaId: String!
  adapter: String!
  artifactId: ID
  revisionId: ID
  digest: String
  heartbeatAt: DateTime!
  """True when heartbeatAt is older than three report intervals."""
  stale: Boolean!
}

type EngineRegistry {
  integrationCount: Int!
  integrations: [EngineRegistryIntegration!]!
}

type EngineRegistryIntegration {
  integrationId: ID!
  definitionId: ID!
  revisionId: ID!
  digest: String!
  sourceId: ID!
  format: String!
}

"""
One ingress or egress adapter. Every field but kind and enabled is null when
the adapter is disabled or the field does not apply to its kind.
"""
type EngineAdapter {
  """http, mllp, batch, or delivery."""
  kind: String!
  enabled: Boolean!
  definitionId: ID
  integrationId: ID
  sourceId: ID
  sourceRevisionId: ID
  sourceDigest: String
  listenAddress: String
  path: String
  authMode: String
  tlsMode: String
  provider: String
  pollSeconds: Int
  maxConnections: Int
  maxMessageBytes: Int
  maxBodyBytes: Int
  requireClientIdentity: Boolean
  requireWorkloadIdentity: Boolean
  queueDriver: String
  maxAttempts: Int
  workerId: String
}

type EngineDestinationIdentity {
  """strict or compatibility."""
  mode: String!
  destinations: [EngineDestination!]!
}

type EngineDestination {
  artifactId: ID!
  revisionId: ID!
  digest: String!
  """kafka, https, or fhir."""
  transport: String!
  """production or sandbox."""
  class: String!
  """Scheme, host, and path only; advisory, never a trust input."""
  endpointAdvisory: String!
}

type EngineLedger {
  name: String!
  version: Int!
}

type EngineProperty {
  """The environment variable that sets it; change it in GitOps."""
  key: String!
  """The value, the documented default, or "" when neither; set/unset when secret."""
  value: String!
  secret: Boolean!
  """env or default."""
  source: String!
}

extend type Query {
  connections(direction: ConnectionDirection, includeArchived: Boolean): [Connection!]!
  connection(id: ID!): Connection
  connectionRevisions(id: ID!): [ConnectionRevision!]!
  connectionRevision(artifactId: ID!, revisionId: ID!): ConnectionRevision
  engineRuntime: EngineRuntime!
}

extend type Mutation {
  createConnection(input: CreateConnectionInput!): Connection!
  updateConnection(input: UpdateConnectionInput!): Connection!
  archiveConnection(input: ConnectionCommandInput!): Connection!
  compileConnection(input: ConnectionCommandInput!): ConnectionCompileResult!
  validateConnectionSpec(input: ValidateConnectionSpecInput!): [ConnectionProblem!]!
}

# =============================================================================
# Integration definition authoring (.loom/42 E-1)
#
# The lifecycle catalog's definitions, authored from the IDE with the same
# implementation `fi-fhir lifecycle seed` uses (internal/integration/lifecycle/
# authoring), so the CLI and the IDE cannot author different bytes for the
# same inputs. A definition binds one compiled source connection revision, a
# profile and workflow pair the runtime's resolver proves against the static
# integration registry, compiled destination revisions, secret binding
# REFERENCES (never values), and policy. Drafts are validated, approved, and
# published here; deploy stays on the Operator page.
#
# Reads require integration.operator; writes additionally require
# integration.deployment.operator, re-checked by the authoring service.
# =============================================================================

"""The runtime check a validation performs; every mode records its own codes."""
enum IntegrationValidationMode {
  """The batch provider lists one object of the input location. Only for the batch source this replica mounts."""
  REAL
  """Contacts nothing: source mounted by a fresh replica, source bindings bound. Code VALIDATION_STATIC."""
  STATIC
  """Records VALIDATION_SKIPPED; the reason must be at least 16 bytes."""
  SKIP
}

type IntegrationDefinitionSource {
  artifactId: ID!
  revisionId: ID!
  digest: String!
  sourceId: ID!
}

type IntegrationDefinitionDestination {
  artifactId: ID!
  revisionId: ID!
  digest: String!
  """production or sandbox."""
  class: String!
}

type IntegrationSecretReference {
  """env, file, vault, aws-ssm, or k8s."""
  provider: String!
  key: String!
  version: String
}

type IntegrationRawRetention {
  """ephemeral or encrypted."""
  mode: String!
  ttlSeconds: Int
  purpose: String
  storageRevision: IntegrationArtifactRevision
  encryptionKey: IntegrationSecretReference
  accessAuditRequired: Boolean!
}

type IntegrationDefinitionPolicy {
  """Always phi."""
  classification: String!
  rawRetention: IntegrationRawRetention!
}

type IntegrationDeploymentPolicyView {
  validationTimeoutSeconds: Int!
  validationMaxAgeSeconds: Int!
  """continuous or cron."""
  scheduleMode: String!
  cronExpression: String
  timezone: String
  healthStartupGraceSeconds: Int!
  healthCheckIntervalSeconds: Int!
  healthTimeoutSeconds: Int!
  healthFailureThreshold: Int!
  maxInFlight: Int!
  maxQueued: Int!
  maxMessagesPerSecond: Int!
}

"""One definition revision and its lifecycle snapshot."""
type IntegrationDefinition {
  definitionId: ID!
  revisionId: ID!
  """The definition revision's semantic digest."""
  digest: String!
  parentRevisionId: ID
  """draft, validated, approved, published, deployed, paused, or retired."""
  state: String!
  """Optimistic snapshot version; every write names it as expectedVersion."""
  version: Int!
  health: String!
  releaseId: ID
  validationPassed: Boolean!
  validationCheckedAt: DateTime
  validationExpiresAt: DateTime
  source: IntegrationDefinitionSource!
  profile: IntegrationArtifactRevision!
  workflow: IntegrationArtifactRevision!
  destinations: [IntegrationDefinitionDestination!]!
  """References only: a name and where the secret lives, never its value."""
  secretBindings: [ConnectionSecretBinding!]!
  policy: IntegrationDefinitionPolicy!
  deployment: IntegrationDeploymentPolicyView!
  createdBy: OperatorPrincipal!
  createdReason: String!
  createdAt: DateTime!
  updatedBy: OperatorPrincipal!
  updatedReason: String!
  updatedAt: DateTime!
}

"""The current connection-validation record of a definition revision."""
type IntegrationDefinitionValidation {
  validationId: ID!
  passed: Boolean!
  """Outcome codes, e.g. VALIDATION_STATIC, SOURCE_MOUNTED, VALIDATION_SKIPPED, INPUT_LISTED."""
  codes: [String!]!
  checkedAt: DateTime!
  expiresAt: DateTime!
  """The exact source revision the check was recorded against."""
  sourceRevision: IntegrationArtifactRevision!
  actor: OperatorPrincipal!
  reason: String!
}

"""The approval event a release binds."""
type IntegrationDefinitionApproval {
  eventId: ID!
  actor: OperatorPrincipal!
  reason: String!
  occurredAt: DateTime!
}

"""The immutable, digest-verified release a publish created."""
type IntegrationDefinitionRelease {
  releaseId: ID!
  """The release record's own digest."""
  digest: String!
  validationId: ID!
  approvalEventId: ID!
  publishedBy: OperatorPrincipal!
  publishedReason: String!
  publishedAt: DateTime!
}

type IntegrationDefinitionDetail {
  definition: IntegrationDefinition!
  """Null until the first validation is recorded."""
  validation: IntegrationDefinitionValidation
  """Null until approved."""
  approval: IntegrationDefinitionApproval
  """Null until published."""
  release: IntegrationDefinitionRelease
  """True when REAL validation can run for this definition's source on this replica."""
  realValidationAvailable: Boolean!
}

"""
One static-registry integration's profile and workflow refs, proven with the
processor.RevisionResolver the runtime resolves admissions with. These are the
only refs a definition can bind until resolution moves onto the catalog.
"""
type IntegrationRegistryArtifact {
  integrationId: ID!
  profile: IntegrationArtifactRevision!
  workflow: IntegrationArtifactRevision!
  sourceId: ID!
  format: String!
}

type IntegrationDefinitionDraftResult {
  """Null exactly when a blocking problem was found; nothing was written then."""
  definition: IntegrationDefinitionDetail
  """Every code but UNUSED_BINDING blocks."""
  problems: [ConnectionProblem!]!
}

input ConnectionRevisionRefInput {
  artifactId: ID!
  revisionId: ID!
}

input IntegrationArtifactRevisionInput {
  artifactId: ID!
  revisionId: ID!
  digest: String!
}

input IntegrationSecretReferenceInput {
  provider: String!
  key: String!
  version: String
}

input IntegrationRawRetentionInput {
  """ephemeral (default) or encrypted."""
  mode: String!
  ttlSeconds: Int
  purpose: String
  storageRevision: IntegrationArtifactRevisionInput
  encryptionKey: IntegrationSecretReferenceInput
}

input IntegrationDeploymentPolicyInput {
  validationTimeoutSeconds: Int!
  validationMaxAgeSeconds: Int!
  scheduleMode: String!
  cronExpression: String
  timezone: String
  healthStartupGraceSeconds: Int!
  healthCheckIntervalSeconds: Int!
  healthTimeoutSeconds: Int!
  healthFailureThreshold: Int!
  maxInFlight: Int!
  maxQueued: Int!
  maxMessagesPerSecond: Int!
}

input IntegrationDefinitionDraftInput {
  definitionId: ID!
  revisionId: ID!
  parentRevisionId: ID
  """A compiled source connection revision."""
  source: ConnectionRevisionRefInput!
  """Compiled destination connection revisions."""
  destinations: [ConnectionRevisionRefInput!]!
  """From integrationRegistryArtifacts."""
  profile: IntegrationArtifactRevisionInput!
  workflow: IntegrationArtifactRevisionInput!
  """References only; a value is never accepted anywhere."""
  secretBindings: [ConnectionSecretBindingInput!]!
  """Omitted: ephemeral."""
  rawRetention: IntegrationRawRetentionInput
  """Omitted: the default policy with FI_FHIR_LIFECYCLE_VALIDATION_MAX_AGE."""
  deployment: IntegrationDeploymentPolicyInput
}

input IntegrationDefinitionCommandInput {
  definitionId: ID!
  revisionId: ID!
  """Optimistic concurrency guard; a stale version is rejected, never retried."""
  expectedVersion: Int!
  reason: String!
}

input IntegrationDefinitionValidateInput {
  definitionId: ID!
  revisionId: ID!
  expectedVersion: Int!
  mode: IntegrationValidationMode!
  reason: String!
}

extend type Query {
  integrationDefinitions(includeRetired: Boolean): [IntegrationDefinition!]!
  integrationDefinition(definitionId: ID!, revisionId: ID!): IntegrationDefinitionDetail
  integrationRegistryArtifacts: [IntegrationRegistryArtifact!]!
}

extend type Mutation {
  """Every pre-flight check, without a write."""
  validateIntegrationDefinitionDraft(input: IntegrationDefinitionDraftInput!): [ConnectionProblem!]!
  createIntegrationDefinitionDraft(input: IntegrationDefinitionDraftInput!, reason: String!): IntegrationDefinitionDraftResult!
  """A failed check is recorded evidence, returned in validation; not an error."""
  validateIntegrationDefinition(input: IntegrationDefinitionValidateInput!): IntegrationDefinitionDetail!
  approveIntegrationDefinition(input: IntegrationDefinitionCommandInput!): IntegrationDefinitionDetail!
  publishIntegrationDefinition(input: IntegrationDefinitionCommandInput!): IntegrationDefinitionDetail!
}

# =============================================================================
# Connection sample intake (.loom/38 C-2)
#
# Two ways to put real messages from a source connection into an Integration
# Session, where any HL7v2 message type previews: a batch peek reads the first
# messages of one object of a compiled batch connection, and a stream capture
# taps the next messages a runtime source admits on any replica. Both are
# reason-required, audited as one ConnectionCapture row each, and redact-only:
# every sample goes through the capture redactor. The segments and fields it
# masks are tabled in docs/operations/PHI-RETENTION.md, "Captured and peeked
# samples"; that table, not this comment, is the list.
#
# A peek takes no lease, writes no checkpoint, archives nothing, and deletes
# nothing. A capture never changes an admission result, an ACK, or a receipt.
# Every field requires integration.operator and a configured session workspace
# (capabilities.integrationSessions).
# =============================================================================

enum ConnectionCaptureMode {
  PEEK
  STREAM
}

enum ConnectionCaptureStatus {
  ARMED
  COMPLETE
  EXPIRED
  CANCELLED
  FAILED
}

"""One audited peek or stream capture."""
type ConnectionCapture {
  id: ID!
  sessionId: ID!
  """The runtime source ID a stream capture taps, or the peeked revision's source_id."""
  sourceId: ID!
  """The catalog connection a peek read; null for a stream capture, which names a runtime source."""
  connectionId: ID
  mode: ConnectionCaptureMode!
  status: ConnectionCaptureStatus!
  """Messages that reached the session."""
  captured: Int!
  maxMessages: Int!
  """When an armed capture stops by itself; a peek's own deadline."""
  expiresAt: DateTime!
  requestedBy: OperatorPrincipal!
  reason: String!
  requestedAt: DateTime!
  """Null while armed."""
  completedAt: DateTime
  """
  Why it finished as it did: SECRET_UNRESOLVABLE (path is the spec field naming
  the binding), SOURCE_UNAVAILABLE, OBJECT_NOT_FOUND, MESSAGE_UNREADABLE, or
  SAMPLE_WRITE_FAILED (path is the input field, or empty). Empty when it did all
  it was asked.
  """
  problems: [ConnectionProblem!]!
}

"""One object under a batch source's input prefix or directory."""
type BatchPeekObject {
  path: String!
  size: Int!
  """The provider's exact version: an S3 version ID, or an SFTP change stamp."""
  version: String!
  """The provider's modification time. Advisory: never a trust input."""
  modifiedAt: DateTime
}

type BatchPeekResult {
  """At most maxObjects objects, in the provider's listing order."""
  objects: [BatchPeekObject!]!
  """The samples this peek added to the session; empty without objectPath."""
  samples: [SessionSample!]!
  """The peek's audit row, finished."""
  capture: ConnectionCapture!
  problems: [ConnectionProblem!]!
}

input PeekBatchConnectionInput {
  """A catalog batch_s3 or batch_sftp connection with a compiled revision."""
  connectionId: ID!
  """An active session."""
  sessionId: ID!
  """An object path from a previous listing. Without it the peek lists and reads nothing."""
  objectPath: String
  """1-50; 10 when omitted."""
  maxObjects: Int
  """1-50; 5 when omitted."""
  maxMessages: Int
  reason: String!
}

input StartConnectionCaptureInput {
  """The runtime source ID frames are admitted under (engineRuntime.adapters.sourceId)."""
  sourceId: ID!
  """An active session."""
  sessionId: ID!
  """1-100; 5 when omitted."""
  maxMessages: Int
  """1-900; 300 when omitted."""
  ttlSeconds: Int
  reason: String!
}

extend type Query {
  """One session's peeks and captures, newest first, at most 100."""
  connectionCaptures(sessionId: ID!): [ConnectionCapture!]!
}

extend type Mutation {
  peekBatchConnection(input: PeekBatchConnectionInput!): BatchPeekResult!
  """Arms a capture of the source's next frames; one armed capture per source."""
  startConnectionCapture(input: StartConnectionCaptureInput!): ConnectionCapture!
  cancelConnectionCapture(id: ID!, reason: String!): ConnectionCapture!
}
