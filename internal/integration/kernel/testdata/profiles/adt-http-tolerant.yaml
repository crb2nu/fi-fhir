# The adt-http golden Source Profile, tolerant variant: a missing PV1 segment
# is a warning instead of an error. Canonical JSON form:
# testdata/golden/integration/adt-http/tolerant-profile.json
# (TestBuiltInProfilesMatchGoldenJSON holds the two equal). Synthetic.
hl7v2:
  default_version: "2.5.1"
  timezone: UTC
  tolerance:
    missing_segments:
      - PV1
    nte_anywhere: false
    extra_components: false
    unknown_segments: false
    non_standard_delimiters: false
  event_classifications:
    - message_type: ADT^A01
      event_type: patient_admit
      priority: 1
identifiers:
  assigning_authorities:
    - code: HOSP
      system: urn:oid:1.2.3
  normalization:
    ssn_strip_dashes: true
    phone_normalize: false
