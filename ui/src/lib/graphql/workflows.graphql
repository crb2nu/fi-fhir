query ListWorkflows {
  workflows {
    name
    enabled
    routeCount
    eventsProcessed
    lastEventTime
    errors
  }
}

query ListWorkflowDefinitions($filter: WorkflowDefinitionFilter, $paging: PagingInput) {
  workflowDefinitions(filter: $filter, paging: $paging) {
    id
    name
    description
    status
    createdAt
    updatedAt
    latestVersion {
      id
      workflowId
      versionNumber
      createdAt
      createdBy
      notes
      validation {
        valid
        errors
        warnings
        info
      }
    }
    publishedVersionsByEnv
  }
}

query GetWorkflowVersions($workflowId: ID!, $paging: PagingInput) {
  workflowVersions(workflowId: $workflowId, paging: $paging) {
    id
    workflowId
    versionNumber
    yaml
    createdBy
    createdAt
    notes
    validation {
      valid
      errors
      warnings
      info
    }
  }
}

query GetWorkflowVersionById($id: ID!) {
  workflowVersion(id: $id) {
    id
    workflowId
    versionNumber
    yaml
    createdBy
    createdAt
    notes
    validation {
      valid
      errors
      warnings
      info
    }
  }
}

query ListWorkflowRuns($filter: WorkflowRunFilter, $paging: PagingInput) {
  workflowRuns(filter: $filter, paging: $paging) {
    id
    workflowName
    environment
    versionId
    eventId
    routesMatched
    actionsExecuted
    errors
    durationMs
    startedAt
    status
  }
}

query GetWorkflowRun($id: ID!) {
  workflowRun(id: $id) {
    id
    workflowName
    environment
    versionId
    eventId
    routesMatched
    actionsExecuted
    errors
    durationMs
    startedAt
    status
  }
}

query ListWorkflowApprovalRequests(
  $filter: WorkflowApprovalRequestFilter
  $paging: PagingInput
) {
  workflowApprovalRequests(filter: $filter, paging: $paging) {
    id
    workflowId
    targetVersionId
    environment
    status
    requestedBy
    reviewedBy
    reviewedAt
    comment
  }
}

query GetWorkflow($name: String!) {
  workflow(name: $name) {
    name
    enabled
    routeCount
    eventsProcessed
    lastEventTime
    errors
  }
}

mutation CreateWorkflowDefinition($input: CreateWorkflowDefinitionInput!) {
  createWorkflowDefinition(input: $input) {
    id
    name
    description
    status
    createdAt
    updatedAt
    latestVersion {
      id
      workflowId
      versionNumber
      createdAt
      createdBy
      notes
      validation {
        valid
        errors
        warnings
        info
      }
    }
    publishedVersionsByEnv
  }
}

mutation SaveWorkflowVersion($input: SaveWorkflowVersionInput!) {
  saveWorkflowVersion(input: $input) {
    id
    workflowId
    versionNumber
    yaml
    createdBy
    createdAt
    notes
    validation {
      valid
      errors
      warnings
      info
    }
  }
}

mutation PublishWorkflowVersion($input: PublishWorkflowVersionInput!) {
  publishWorkflowVersion(input: $input) {
    id
    workflowId
    environment
    versionId
    publishedBy
    publishedAt
    rollbackFromReleaseId
  }
}

mutation RollbackWorkflowVersion($input: RollbackWorkflowVersionInput!) {
  rollbackWorkflowVersion(input: $input) {
    id
    workflowId
    environment
    versionId
    publishedBy
    publishedAt
    rollbackFromReleaseId
  }
}

mutation RequestWorkflowApproval($input: RequestWorkflowApprovalInput!) {
  requestWorkflowApproval(input: $input) {
    id
    workflowId
    targetVersionId
    environment
    status
    requestedBy
    reviewedBy
    reviewedAt
    comment
  }
}

mutation ApproveWorkflowVersion($input: ApproveWorkflowVersionInput!) {
  approveWorkflowVersion(input: $input) {
    id
    workflowId
    targetVersionId
    environment
    status
    requestedBy
    reviewedBy
    reviewedAt
    comment
  }
}

mutation RejectWorkflowVersion($input: RejectWorkflowVersionInput!) {
  rejectWorkflowVersion(input: $input) {
    id
    workflowId
    targetVersionId
    environment
    status
    requestedBy
    reviewedBy
    reviewedAt
    comment
  }
}

mutation TriggerWorkflow(
  $name: String!
  $event: JSON!
  $environment: String
  $versionId: String
) {
  triggerWorkflow(
    name: $name
    event: $event
    environment: $environment
    versionId: $versionId
  ) {
    workflowName
    routesMatched
    actionsExecuted
    errors
    duration
    runId
    environment
    versionId
  }
}

mutation GenerateWorkflow($input: GenerateWorkflowInput!) {
  generateWorkflow(input: $input) {
    yaml
    explanation
    warnings
  }
}

query ExplainWorkflow($input: ExplainWorkflowInput!) {
  explainWorkflow(input: $input) {
    summary
    description
    routeExplanations {
      name
      trigger
      actions
      description
    }
    diagram
    warnings
  }
}

mutation DryRunWorkflow($input: DryRunWorkflowInput!) {
  dryRunWorkflow(input: $input) {
    routeResults {
      routeName
      matched
      actionsWouldRun
      skipReason
    }
    warnings
    validationErrors
  }
}

subscription WorkflowEvents($workflowName: String!) {
  workflowEvents(workflowName: $workflowName) {
    event {
      id
      type
      timestamp
      source
    }
    workflow
    routesMatched
    actionsExecuted
    duration
  }
}
