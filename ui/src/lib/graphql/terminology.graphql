# Terminology Mapping Queries and Mutations

fragment MappingFields on CodeMapping {
  id
  sourceSystem
  sourceCode
  sourceDisplay
  targetSystem
  targetCode
  targetDisplay
  equivalence
  confidence
  comment
  origin
  profileId
  uploadBatchId
  createdAt
  createdBy
}

fragment BatchFields on UploadBatch {
  id
  filename
  sourceSystem
  targetSystem
  profileId
  totalRows
  validRows
  duplicateRows
  errorRows
  uploadedAt
  uploadedBy
  validationErrors {
    row
    column
    message
  }
}

query ListMappings($input: ListMappingsInput) {
  listMappings(input: $input) {
    nodes {
      ...MappingFields
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}

query GetMapping($id: ID!) {
  getMapping(id: $id) {
    ...MappingFields
  }
}

query LookupMapping(
  $sourceSystem: String!
  $sourceCode: String!
  $targetSystem: String!
  $profileId: String
) {
  lookupMapping(
    sourceSystem: $sourceSystem
    sourceCode: $sourceCode
    targetSystem: $targetSystem
    profileId: $profileId
  ) {
    ...MappingFields
  }
}

query GetUploadBatch($id: ID!) {
  getUploadBatch(id: $id) {
    ...BatchFields
  }
}

mutation UploadMappingCSV($input: UploadMappingCSVInput!) {
  uploadMappingCSV(input: $input) {
    batch {
      ...BatchFields
    }
    mappingsCreated
    mappingsSkipped
    preview {
      ...MappingFields
    }
  }
}

mutation CreateMapping($input: CreateMappingInput!) {
  createMapping(input: $input) {
    ...MappingFields
  }
}

mutation DeleteMapping($id: ID!) {
  deleteMapping(id: $id)
}

mutation DeleteMappingBatch($batchId: ID!) {
  deleteMappingBatch(batchId: $batchId)
}

mutation UpdateMapping($input: UpdateMappingInput!) {
  updateMapping(input: $input) {
    ...MappingFields
  }
}

query ExportMappingsCSV($input: ListMappingsInput) {
  exportMappingsCSV(input: $input)
}

# Autoroute (LLM-powered mapping suggestions)

fragment CandidateFields on MappingCandidate {
  code
  display
  system
  confidence
  equivalence
  reasoning
  score
}

fragment AutorouteTraceFields on AutorouteTrace {
  traceId
  timestamp
  steps {
    step
    result
    durationMs
    metadata
  }
  totalDurationMs
}

query ResolveMapping($input: ResolveMappingInput!) {
  resolveMapping(input: $input) {
    found
    decision
    mapping {
      ...MappingFields
    }
    candidates {
      ...CandidateFields
    }
    confidence
    reasoning
    trace {
      ...AutorouteTraceFields
    }
    durationMs
  }
}

query SuggestMappings($input: SuggestMappingsInput!) {
  suggestMappings(input: $input) {
    ...CandidateFields
  }
}

# =============================================================================
# Pending Autoroute Review
# =============================================================================

fragment PendingAutorouteFields on PendingAutoroute {
  id
  sourceSystem
  sourceCode
  sourceDisplay
  targetSystem
  suggestedCode
  suggestedDisplay
  confidence
  equivalence
  reasoning
  status
  createdAt
  expiresAt
  reviewedAt
  reviewedBy
  rejectionReason
  alternates {
    ...CandidateFields
  }
  decisionTrace {
    ...AutorouteTraceFields
  }
}

query ListPendingAutoroutes($input: ListPendingAutoroutesInput) {
  listPendingAutoroutes(input: $input) {
    nodes {
      ...PendingAutorouteFields
    }
    totalCount
    pageInfo {
      hasNextPage
      hasPreviousPage
    }
  }
}

query GetPendingAutoroute($id: ID!) {
  getPendingAutoroute(id: $id) {
    ...PendingAutorouteFields
  }
}

query PendingAutorouteStats {
  pendingAutorouteStats {
    pendingCount
    approvedCount
    rejectedCount
    expiredCount
    avgConfidence
  }
}

mutation ApprovePendingAutoroute($input: ApprovePendingAutorouteInput!) {
  approvePendingAutoroute(input: $input) {
    ...MappingFields
  }
}

mutation RejectPendingAutoroute($input: RejectPendingAutorouteInput!) {
  rejectPendingAutoroute(input: $input)
}

mutation BulkApprovePendingAutoroutes($input: BulkApproveInput) {
  bulkApprovePendingAutoroutes(input: $input) {
    approved
    skipped
    mappings {
      ...MappingFields
    }
  }
}
