# Bounded metadata for Home, Explorer, and the shared session browser.
query IntegrationSessionSummaries($input: IntegrationSessionSummaryInput) {
  integrationSessionSummaries(input: $input) {
    nodes {
      id
      name
      archived
      createdAt
      updatedAt
      latestRun {
        id
        status
        createdAt
      }
    }
    hasMore
    nextOffset
  }
}
