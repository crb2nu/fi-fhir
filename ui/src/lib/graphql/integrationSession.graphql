fragment IntegrationSessionRunFields on SessionRun {
  id
  sessionId
  sampleId
  status
  profileRevisionId
  profileRevisionDigest
  createdAt
  completedAt
  stages {
    id
    name
    status
    startedAt
    completedAt
    durationMs
    summary
  }
  diagnostics {
    id
    sessionId
    runId
    sampleId
    severity
    code
    message
    path
    fixSuggestion
    accepted
    acceptedAt
    lineage {
      sourcePath
      targetPath
      description
    }
  }
  lineage {
    sourcePath
    targetPath
    description
  }
  events {
    __typename
    id
    type
    timestamp
    source
    sourceFormat
    correlationId
    ... on PatientAdmitEvent {
      patient { mrn familyName givenName dateOfBirth gender }
      encounter { class location { facility unit room bed } }
    }
    ... on PatientDischargeEvent {
      patient { mrn familyName givenName dateOfBirth gender }
      encounter { class location { facility unit room bed } }
    }
    ... on LabResultEvent {
      patient { mrn familyName givenName dateOfBirth gender }
      test { loincCode localCode description }
      result { value unit status }
      isCritical
    }
    ... on AppointmentEvent {
      patient { mrn familyName givenName dateOfBirth gender }
      appointment {
        id
        status
        startTime
        endTime
        reason
        location { facility unit room bed }
        provider { familyName givenName npi }
      }
    }
    ... on DocumentEvent { documentType title }
  }
  warnings {
    phase
    code
    message
    path
    explanation
    fixSuggestion
    impact
    severity
    fromCache
  }
}

mutation CreateStreamingIntegrationSession($input: CreateIntegrationSessionInput!) {
  createIntegrationSession(input: $input) { id }
}

mutation AddStreamingSessionSample($input: AddSessionSampleInput!) {
  addSessionSample(input: $input) { id sessionId }
}

mutation UpdateStreamingSessionProfile($input: UpdateSessionArtifactInput!) {
  updateSessionProfileDraft(input: $input) { revisionId digest }
}

mutation RunStreamingSessionPreview($input: RunSessionPreviewInput!) {
  runSessionPreview(input: $input) { ...IntegrationSessionRunFields }
}

subscription StreamIntegrationSessionEvents($sessionId: ID!) {
  integrationSessionEvents(sessionId: $sessionId) {
    id
    type
    sessionId
    runId
    message
    timestamp
    run { ...IntegrationSessionRunFields }
  }
}

fragment SessionWorkflowSimulationFields on SessionWorkflowSimulation {
  id
  sessionId
  workflowArtifactId
  workflowRevisionId
  workflowRevisionDigest
  sourceRunIds
  createdAt
  events {
    runId
    eventId
    eventType
    routes {
      name
      matched
      skipReason
      diagnosticCodes
      transforms { index type status }
      actions { id type destinationArtifactId }
    }
  }
  delta {
    baselineSimulationId
    candidateSimulationId
    addedEvents
    removedEvents
    addedMatchedRoutes
    removedMatchedRoutes
    addedTransforms
    removedTransforms
    addedActions
    removedActions
  }
}

query ListWorkflowSimulationSessions {
  integrationSessions {
    id
    name
    archived
    runs {
      id
      status
      profileRevisionId
      events { id type }
    }
    workflowSimulations {
      id
      workflowRevisionId
      workflowRevisionDigest
      sourceRunIds
      createdAt
    }
  }
}

mutation SaveSessionWorkflowDraft($input: UpdateSessionArtifactInput!) {
  updateSessionWorkflowDraft(input: $input) {
    id
    revisionId
    digest
    version
  }
}

mutation SimulateSessionWorkflow($input: SimulateSessionWorkflowInput!) {
  simulateSessionWorkflow(input: $input) {
    ...SessionWorkflowSimulationFields
  }
}

fragment SessionPublicationFields on SessionPublication {
  id
  sessionId
  version
  sessionProfile { artifactId revisionId digest }
  sessionWorkflow { artifactId revisionId digest }
  workflowSimulationId
  definitionRevision { artifactId revisionId digest }
  definitionVersion
  productionProfile { artifactId revisionId digest }
  productionWorkflow { artifactId revisionId digest }
  sourceRunIds
  manifestDigest
  signatureAlgorithm
  signingKeyId
  publishedBy
  reason
  createdAt
}

mutation PublishIntegrationSession($input: PublishIntegrationSessionInput!) {
  publishIntegrationSession(input: $input) { ...SessionPublicationFields }
}

mutation ApproveSessionPublication($input: PromoteSessionPublicationInput!) {
  approveSessionPublication(input: $input) {
    definitionRevision { artifactId revisionId digest }
    state
    version
    releaseId
    health
  }
}

mutation DeploySessionPublication($input: PromoteSessionPublicationInput!) {
  deploySessionPublication(input: $input) {
    definitionRevision { artifactId revisionId digest }
    state
    version
    releaseId
    health
  }
}

# ── Sessions as first-class work (.loom/42 E-3) ─────────────────────────────
# One root field per operation: the transport gate authorizes whole
# operations, so a read never rides with a write it could be refused for.

fragment SessionArtifactFields on SessionArtifact {
  id
  revisionId
  kind
  name
  version
  digest
  updatedAt
}

# The reopened session: what the /hl7 sidebar lists beside its runs. Sample
# text is not selected: a pasted sample's text stays server-side, and captured
# text arrives through the intake reads (connectionIntake.graphql).
query IntegrationSessionWorkspace($id: ID!) {
  integrationSession(id: $id) {
    id
    name
    description
    archived
    createdAt
    updatedAt
    samples {
      id
      name
      format
      source
      payloadChecksum
      createdAt
    }
    currentProfileDraft { ...SessionArtifactFields }
    currentWorkflowDraft { ...SessionArtifactFields }
    workflowSimulations {
      id
      workflowArtifactId
      workflowRevisionId
      workflowRevisionDigest
      sourceRunIds
      createdAt
    }
    publications { ...SessionPublicationFields }
  }
}

fragment SessionRunSummaryFields on SessionRun {
  id
  sessionId
  sampleId
  status
  profileRevisionId
  profileRevisionDigest
  createdAt
  completedAt
  stages {
    id
    name
    status
    durationMs
  }
}

query SessionRunHistory($sessionId: ID!) {
  sessionRuns(sessionId: $sessionId) { ...SessionRunSummaryFields }
}

query SessionRunDetail($id: ID!) {
  sessionRun(id: $id) { ...IntegrationSessionRunFields }
}

fragment SessionDiagnosticFields on SessionDiagnostic {
  id
  sessionId
  runId
  sampleId
  severity
  code
  message
  path
  fixSuggestion
  accepted
  acceptedAt
  lineage {
    sourcePath
    targetPath
    description
  }
}

query SessionRunDiagnostics($sessionId: ID!, $runId: ID) {
  sessionDiagnostics(sessionId: $sessionId, runId: $runId) { ...SessionDiagnosticFields }
}

mutation ArchiveIntegrationSession($id: ID!) {
  archiveIntegrationSession(id: $id) {
    id
    archived
    updatedAt
  }
}

mutation AcceptSessionDiagnosticFix($input: AcceptDiagnosticFixInput!) {
  acceptDiagnosticFix(input: $input) { ...SessionDiagnosticFields }
}

# The audited PHI export. rawPayload is null unless includeRawPayload was
# asked for and the caller holds integration.phi.export (capabilities.phiExport).
mutation ExportIntegrationSessionBundle($input: ExportIntegrationBundleInput!) {
  exportIntegrationBundle(input: $input) {
    sessionId
    exportedAt
    session {
      id
      name
      description
      archived
      createdAt
      updatedAt
    }
    samples {
      id
      name
      format
      source
      rawPayload
      payloadChecksum
      payloadRef
      createdAt
    }
    artifacts {
      ...SessionArtifactFields
      content
      createdAt
    }
    runs { ...IntegrationSessionRunFields }
    workflowSimulations { ...SessionWorkflowSimulationFields }
    publications { ...SessionPublicationFields }
    diagnostics { ...SessionDiagnosticFields }
  }
}

# The per-run stream (SSE-allowlisted). Opened only while a run is live.
subscription StreamSessionRunEvents($sessionId: ID!, $runId: ID) {
  sessionRunEvents(sessionId: $sessionId, runId: $runId) {
    id
    type
    sessionId
    runId
    message
    timestamp
    run { ...SessionRunSummaryFields }
  }
}
