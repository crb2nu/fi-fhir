mutation CreateIntegrationSession($input: CreateIntegrationSessionInput!) {
  createIntegrationSession(input: $input) {
    id
    name
  }
}

mutation AddSessionSample($input: AddSessionSampleInput!) {
  addSessionSample(input: $input) {
    id
    source
    payloadChecksum
    rawPayload
  }
}

mutation RunSessionPreview($input: RunSessionPreviewInput!) {
  runSessionPreview(input: $input) {
    id
    status
    events {
      __typename
      id
      type
      timestamp
      source
      sourceFormat
      correlationId
      ... on PatientAdmitEvent {
        patient {
          mrn
          familyName
          givenName
          dateOfBirth
          gender
        }
        encounter {
          class
          location {
            facility
            unit
            room
            bed
          }
        }
      }
      ... on PatientDischargeEvent {
        patient {
          mrn
          familyName
          givenName
          dateOfBirth
          gender
        }
        encounter {
          class
          location {
            facility
            unit
            room
            bed
          }
        }
      }
      ... on LabResultEvent {
        patient {
          mrn
          familyName
          givenName
          dateOfBirth
          gender
        }
        test {
          loincCode
          localCode
          description
        }
        result {
          value
          unit
          status
        }
        isCritical
      }
      ... on AppointmentEvent {
        patient {
          mrn
          familyName
          givenName
          dateOfBirth
          gender
        }
        appointment {
          id
          status
          startTime
          endTime
          reason
          location {
            facility
            unit
            room
            bed
          }
          provider {
            familyName
            givenName
            npi
          }
        }
      }
      ... on DocumentEvent {
        documentType
        title
      }
    }
    warnings {
      phase
      code
      message
      path
      explanation
      fixSuggestion
      impact
      severity
      fromCache
    }
    diagnostics {
      id
      code
      message
      path
      severity
      fixSuggestion
      accepted
      acceptedAt
    }
    stages {
      id
      name
      status
      startedAt
      completedAt
      durationMs
    }
  }
}

subscription SessionRunEvents($sessionId: ID!, $runId: ID) {
  sessionRunEvents(sessionId: $sessionId, runId: $runId) {
    sessionId
    runId
    type
    message
  }
}
