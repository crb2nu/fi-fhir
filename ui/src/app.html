<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>fi-fhir Mapping Studio</title>
    <meta
      name="description"
      content="fi-fhir Mapping Studio: profile-driven HL7 mapping, validation, and normalization tools."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#141518" />
    <script>
      (() => {
        // Keep this in sync with src/lib/theme/theme.ts.
        // Dark is the default; "system" follows the OS. The resolved theme is
        // always written to data-theme so the CSS never needs a media query.
        const STORAGE_KEY = "fi-fhir-theme";
        const LIGHT_BG = "#f6f7f9";
        const DARK_BG = "#141518";

        try {
          const root = document.documentElement;
          const stored = localStorage.getItem(STORAGE_KEY);
          const prefersDark =
            typeof matchMedia === "function" &&
            matchMedia("(prefers-color-scheme: dark)").matches;

          const resolved =
            stored === "light"
              ? "light"
              : stored === "system"
                ? prefersDark
                  ? "dark"
                  : "light"
                : "dark";

          root.setAttribute("data-theme", resolved);

          // Prevent first-paint flash before the bundled CSS loads.
          root.style.backgroundColor = resolved === "dark" ? DARK_BG : LIGHT_BG;

          const themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor)
            themeColor.setAttribute(
              "content",
              resolved === "dark" ? DARK_BG : LIGHT_BG,
            );
        } catch {
          // Ignore (e.g. localStorage blocked). CSS defaults to dark.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* First paint only — mirrors --color-bg-base / --color-text-primary. */
      :root {
        color-scheme: dark;
        background: #141518;
        color: #e6e7ea;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        background: #f6f7f9;
        color: #1b1d21;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: inherit;
        color: inherit;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        font-size: 13px;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
