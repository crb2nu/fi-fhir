name: Release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.22'
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -v -race ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    env:
      # github.ref_name is safe for tags - it's the tag name we control
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries
        run: |
          mkdir -p dist

          # Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/fi-fhir-linux-amd64 ./cmd/fi-fhir

          # Linux ARM64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/fi-fhir-linux-arm64 ./cmd/fi-fhir

          # Darwin AMD64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/fi-fhir-darwin-amd64 ./cmd/fi-fhir

          # Darwin ARM64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/fi-fhir-darwin-arm64 ./cmd/fi-fhir

          # Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o dist/fi-fhir-windows-amd64.exe ./cmd/fi-fhir

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/fi-fhir-linux-amd64
            dist/fi-fhir-linux-arm64
            dist/fi-fhir-darwin-amd64
            dist/fi-fhir-darwin-arm64
            dist/fi-fhir-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
          draft: false

  docker:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      # github.repository is safe - it's the repo owner/name
      IMAGE_NAME: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.VERSION }}

  helm-release:
    name: Helm Chart Release
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        env:
          # github.actor is safe - it's the authenticated user
          GIT_USER: ${{ github.actor }}
        run: |
          git config user.name "${GIT_USER}"
          git config user.email "${GIT_USER}@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update chart version
        run: |
          # Strip 'v' prefix for semver
          CHART_VERSION="${VERSION#v}"
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" deploy/helm/fi-fhir/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${CHART_VERSION}\"/" deploy/helm/fi-fhir/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package deploy/helm/fi-fhir/ -d .helm-releases/

      - name: Upload Helm chart to release
        uses: softprops/action-gh-release@v1
        with:
          files: .helm-releases/*.tgz
