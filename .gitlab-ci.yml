        export HOME=/root
        HARBOR_REGISTRY="${HARBOR_REGISTRY:-registry.harbor.lan}"
        HARBOR_PROJECT="${HARBOR_PROJECT:-library}"
        HARBOR_IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/fi-fhir-ui"
        HARBOR_SEMVER_TAG="v0.1.${CI_PIPELINE_ID:-${CI_PIPELINE_IID}}"
        echo "Publishing fi-fhir-ui to Harbor: ${HARBOR_IMAGE}:${HARBOR_SEMVER_TAG}"
        harbor_ok=0
        crane_retry() {
          tries="$1"
          shift
          i=1
          while [ "$i" -le "$tries" ]; do
            if "$@"; then
              return 0
            fi
            echo "crane failed (attempt ${i}/${tries}); retrying..." >&2
            sleep $((i * 5))
            i=$((i + 1))
          done
          return 1
        }

        if crane_retry 5 crane --insecure push docker-ui-image.tar "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
          && crane_retry 5 crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" main \
          && crane_retry 5 crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${HARBOR_SEMVER_TAG}"; then
          harbor_ok=1
        else
          echo "Harbor publish failed." >&2
        fi

        if [ "$harbor_ok" -eq 1 ]; then
          published=1
        elif [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      else
        echo "No Docker auth config found; skipping Harbor publish."
        if [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi

      if [ "$published" -ne 1 ]; then
        echo "No registry published for deploy:docker-ui." >&2
        if [ "${REQUIRE_DOCKER_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

# =============================================================================
# Release Stage
# =============================================================================

release:binaries:
  stage: release
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - mkdir -p dist
    - |
      VERSION="${CI_COMMIT_TAG}"

      # Linux AMD64
      GOOS=linux GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-linux-amd64 ./cmd/fi-fhir

      # Linux ARM64
      GOOS=linux GOARCH=arm64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-linux-arm64 ./cmd/fi-fhir

      # Darwin AMD64
      GOOS=darwin GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-darwin-amd64 ./cmd/fi-fhir

      # Darwin ARM64
      GOOS=darwin GOARCH=arm64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-darwin-arm64 ./cmd/fi-fhir

      # Windows AMD64
      GOOS=windows GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-windows-amd64.exe ./cmd/fi-fhir
    - cd dist && sha256sum * > checksums.txt
  artifacts:
    paths:
      - dist/
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG

release:docker:
  stage: release
  image: ${DOCKERHUB_CACHE_PREFIX}/library/docker:24
  services:
    - ${DOCKERHUB_CACHE_PREFIX}/library/docker:24-dind
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  # Tag publication waits for all earlier stages, then consumes the exact
  # build artifact already checked by security:trivy-image.
  dependencies:
    - build:docker
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - |
      # Use CI_REGISTRY_IMAGE if set, otherwise default to fi-fhir
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}"
      VERSION="${CI_COMMIT_TAG#v}"
      MAJOR="${VERSION%%.*}"
      MINOR="${VERSION%.*}"

      # Retag the exact artifact that passed security:trivy-image.
      docker load --input docker-image.tar
      SOURCE_IMAGE="${IMAGE_BASE}:${CI_COMMIT_TAG}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:${VERSION}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:${MINOR}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:${MAJOR}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:latest"

      # Push all tags
      docker push "${IMAGE_BASE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE_BASE}:${VERSION}"
      docker push "${IMAGE_BASE}:${MINOR}"
      docker push "${IMAGE_BASE}:${MAJOR}"
      docker push "${IMAGE_BASE}:latest"
  rules:
    - if: $CI_COMMIT_TAG

release:docker-ui:
  stage: release
  image: ${DOCKERHUB_CACHE_PREFIX}/library/docker:24
  services:
    - ${DOCKERHUB_CACHE_PREFIX}/library/docker:24-dind
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  # Tag publication waits for all earlier stages, then consumes the exact
  # build artifact already checked by security:trivy-ui-image.
  dependencies:
    - build:docker-ui
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - |
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}-ui"
      VERSION="${CI_COMMIT_TAG#v}"
      MAJOR="${VERSION%%.*}"
      MINOR="${VERSION%.*}"

      # Retag the exact artifact that passed security:trivy-ui-image.
      docker load --input docker-ui-image.tar
      SOURCE_IMAGE="${IMAGE_BASE}:${CI_COMMIT_TAG}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:${VERSION}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:${MINOR}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:${MAJOR}"
      docker tag "${SOURCE_IMAGE}" "${IMAGE_BASE}:latest"

      # Push all tags
      docker push "${IMAGE_BASE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE_BASE}:${VERSION}"
      docker push "${IMAGE_BASE}:${MINOR}"
      docker push "${IMAGE_BASE}:${MAJOR}"
      docker push "${IMAGE_BASE}:latest"
  rules:
    - if: $CI_COMMIT_TAG

release:helm:
  stage: release
  image: ${DOCKERHUB_CACHE_PREFIX}/alpine/helm:latest
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      sed -i "s/^version:.*/version: ${VERSION}/" deploy/helm/fi-fhir/Chart.yaml
      sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/fi-fhir/Chart.yaml
    - helm package deploy/helm/fi-fhir/ -d .helm-releases/
    # Push to GitLab Package Registry (Helm)
    - |
      helm push .helm-releases/fi-fhir-*.tgz oci://${CI_REGISTRY}/helm || echo "Helm push to OCI registry (optional)"
  artifacts:
    paths:
      - .helm-releases/
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG

release:npm:
  stage: release
  <<: *node-image
  needs:
    - job: release:binaries
      optional: true
      artifacts: true
  script:
    - cd sdk/typescript
    - node --version
    - npm --version
    - |
      REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
      npm config set @fi-fhir:registry "${REGISTRY}"
      # Auth for GitLab npm registry
      npm config set "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "${CI_JOB_TOKEN}"
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing npm packages for version ${VERSION}"
      # Ensure SDK version matches tag
      test "$(node -p \"require('./package.json').version\")" = "${VERSION}"
    - |
      # Copy release binaries into platform packages (do not commit binaries)
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-darwin-arm64" "packages/fi-fhir-darwin-arm64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-darwin-amd64" "packages/fi-fhir-darwin-x64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-linux-arm64" "packages/fi-fhir-linux-arm64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-linux-amd64" "packages/fi-fhir-linux-x64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-windows-amd64.exe" "packages/fi-fhir-win32-x64/bin/fi-fhir.exe"
      chmod +x "packages/fi-fhir-darwin-arm64/bin/fi-fhir" "packages/fi-fhir-darwin-x64/bin/fi-fhir" "packages/fi-fhir-linux-arm64/bin/fi-fhir" "packages/fi-fhir-linux-x64/bin/fi-fhir" || true
    - |
      # Publish platform binaries first
      for pkg in fi-fhir-darwin-arm64 fi-fhir-darwin-x64 fi-fhir-linux-arm64 fi-fhir-linux-x64 fi-fhir-win32-x64; do
        echo "Publishing @fi-fhir/${pkg}"
        cd "packages/${pkg}"
        test "$(node -p \"require('./package.json').version\")" = "${VERSION}"
        npm publish --access public --registry "${REGISTRY}"
        cd ../../
      done
    - |
      # Build + publish the SDK
      npm ci --no-audit --no-fund
      npm run clean
      npm run build
      node scripts/prepare-publish.js --version "${VERSION}"
      npm publish --access public --registry "${REGISTRY}"
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# GitLab Release
# =============================================================================

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release:binaries
      optional: true
      artifacts: true
    - job: release:helm
      optional: true
      artifacts: true
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release ${CI_COMMIT_TAG}"
    description: |
      ## fi-fhir ${CI_COMMIT_TAG}

      Healthcare integration library release.

      ### Binaries
      - Linux AMD64: `fi-fhir-linux-amd64`
      - Linux ARM64: `fi-fhir-linux-arm64`
      - macOS AMD64: `fi-fhir-darwin-amd64`
      - macOS ARM64: `fi-fhir-darwin-arm64`
      - Windows AMD64: `fi-fhir-windows-amd64.exe`

      ### Docker
      ```bash
      docker pull ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      ```

      ### Helm
      ```bash
      helm pull oci://${CI_REGISTRY}/helm/fi-fhir --version ${CI_COMMIT_TAG#v}
      ```
    assets:
      links:
        - name: "fi-fhir-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-linux-amd64?job=release:binaries"
          filepath: "/binaries/fi-fhir-linux-amd64"
          link_type: other
        - name: "fi-fhir-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-linux-arm64?job=release:binaries"
          filepath: "/binaries/fi-fhir-linux-arm64"
          link_type: other
        - name: "fi-fhir-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-darwin-amd64?job=release:binaries"
          filepath: "/binaries/fi-fhir-darwin-amd64"
          link_type: other
        - name: "fi-fhir-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-darwin-arm64?job=release:binaries"
          filepath: "/binaries/fi-fhir-darwin-arm64"
          link_type: other
        - name: "fi-fhir-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-windows-amd64.exe?job=release:binaries"
          filepath: "/binaries/fi-fhir-windows-amd64.exe"
          link_type: other
        - name: "checksums.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/checksums.txt?job=release:binaries"
          filepath: "/binaries/checksums.txt"
          link_type: other
        - name: "Helm Chart"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/.helm-releases?job=release:helm"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# Mirror Stage
# =============================================================================

# Keeps the public GitHub mirror (github.com/crb2nu/fi-fhir) in sync with
# GitLab, which is the primary. Runs last on default-branch pushes.
#
# One-time setup by the project owner (the job skips until this exists):
#   glab variable set GITHUB_MIRROR_TOKEN --repo libs/fi-fhir \
#     --masked --protected --value <github-pat-with-repo-scope>
#
# --protected is safe because main is a protected branch and this job only
# runs there.
#
# Only main and tags are mirrored. Work-in-progress branches stay on GitLab.
mirror:github:
  stage: mirror
  image: ${DOCKERHUB_CACHE_PREFIX}/alpine/git:latest
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - |
      set -eu
      if [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
        echo "GITHUB_MIRROR_TOKEN is not set; skipping GitHub mirror push."
        echo "Set it with: glab variable set GITHUB_MIRROR_TOKEN --repo libs/fi-fhir --masked"
        exit 0
      fi
      git remote remove github 2>/dev/null || true
      git remote add github "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/crb2nu/fi-fhir.git"
      # Fetch first so --force-with-lease has an accurate remote-tracking ref.
      git fetch github --prune --tags
      git push --force-with-lease github "HEAD:refs/heads/${CI_DEFAULT_BRANCH}"
      git push --force-with-lease --tags github
      echo "Mirrored ${CI_COMMIT_SHA} to github.com/crb2nu/fi-fhir"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

radar-scan:
  extends: .radar-scan
