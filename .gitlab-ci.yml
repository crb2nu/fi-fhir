test:ui:
  stage: test
  <<: *node-image
  needs:
    - job: test:binary
      artifacts: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-ui-npm
    paths:
      - ui/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl && rm -rf /var/lib/apt/lists/*
    - |
      set -eu
      test -x bin/fi-fhir
      export FI_FHIR_DEPLOYMENT_TENANT_ID="tenant-a"
      export FI_FHIR_GRAPHQL_BEARER_TOKEN="ci-authenticated-preview-token-1"
      export FI_FHIR_GRAPHQL_BEARER_TOKEN_FILE=""
      export FI_FHIR_GRAPHQL_PRINCIPAL_ID="ci-ui"
      export FI_FHIR_GRAPHQL_ROLES="integration:preview"
      export FI_FHIR_GRAPHQL_ALLOWED_ORIGINS="http://localhost:5173"
      export FI_FHIR_INTEGRATION_REGISTRY_PATH="${CI_PROJECT_DIR}/testdata/golden/integration/adt-http/preview-registry.json"
      export GRAPHQL_BEARER_TOKEN="${FI_FHIR_GRAPHQL_BEARER_TOKEN}"
      export VITE_FI_FHIR_PREVIEW_INTEGRATION_ID="adt-east"
      bin/fi-fhir serve --port 8081 > fi-fhir-ui-server.log 2>&1 &
      server_pid=$!
      cleanup() {
        kill "$server_pid" 2>/dev/null || true
        wait "$server_pid" 2>/dev/null || true
      }
      trap cleanup EXIT
      echo "Started fi-fhir serve (PID=$server_pid) on :8081"
      ready=false
      for i in $(seq 1 30); do
        if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
          echo "Server ready after ${i}×0.5s"
          ready=true
          break
        fi
        sleep 0.5
      done
      if [ "$ready" != "true" ]; then
        echo "fi-fhir did not become ready on :8081"
        tail -100 fi-fhir-ui-server.log || true
        exit 1
      fi
      cd ui
      npm config set cache "${CI_PROJECT_DIR}/ui/.npm" --global
      npm ci --no-audit --no-fund
      export CI_INTEGRATION_TEST=true
      export VITE_GRAPHQL_API_URL="http://localhost:8081/graphql"
      npm run test:run
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ui/**/*
        - internal/api/graphql/schema.graphql
        - api/openapi.yaml
        - .gitlab-ci.yml
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
