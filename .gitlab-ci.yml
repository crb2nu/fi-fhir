include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

  - project: 'services/tech-radar'
    file: '/ci/radar.yml'
stages:
  - lint
  - test
  - security # Pre-build security (govulncheck, gosec, trivy fs, npm audit, license check)
  - build
  - scan # Post-build security (trivy image scans)
  - deploy
  - release

variables:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOVULNCHECK_VERSION: "v1.6.0"
  GOSEC_VERSION: "v2.27.1"
  GO_LICENSES_VERSION: "v1.6.0"
  NODE_VERSION: "22"
  NPM_VERSION: "10.9.3"
  NGINX_IMAGE_REF: "1.31.2-alpine-slim@sha256:dd722b8ee8794f3c273bfaf8b5351b0652a68ccd73c17e5f0d029857a58f25ef"
  CGO_ENABLED: "0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # GitLab dependency proxy is currently returning 429s from upstream pulls.
  # Use the Harbor pull-through cache for Docker Hub images instead.
  DOCKERHUB_CACHE_PREFIX: "registry.harbor.lan/dockerhub-cache"
  # Pin Trivy to a mirrored tag. Harbor does not currently serve `latest`.
  TRIVY_VERSION: "0.63.0"
  # CI includes set GOPROXY to Athens. When Athens is unhealthy, Go only falls back on 404/410 with ','.
  # Use '|' to fall back on any error (e.g. connection refused).
  GOPROXY: "http://athens.ci.svc.cluster.local:3000|https://proxy.golang.org|direct"
  # GitLab Kubernetes runner resources (avoid exceeding the ci-jobs namespace quota).
  # Many repos in this workspace set these explicitly because runner defaults can be very large.
  KUBERNETES_CPU_REQUEST: "200m"
  KUBERNETES_CPU_LIMIT: "1"
  KUBERNETES_MEMORY_REQUEST: "512Mi"
  KUBERNETES_MEMORY_LIMIT: "2Gi"
  KUBERNETES_HELPER_CPU_REQUEST: "50m"
  KUBERNETES_HELPER_CPU_LIMIT: "200m"
  KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"
  # Service containers (e.g. docker:dind) can also inherit very large default limits.
  KUBERNETES_SERVICE_CPU_REQUEST: "200m"
  KUBERNETES_SERVICE_CPU_LIMIT: "1"
  KUBERNETES_SERVICE_MEMORY_REQUEST: "512Mi"
  KUBERNETES_SERVICE_MEMORY_LIMIT: "2Gi"

# Common change sets (use in rules:changes)
.go-changes: &go-changes
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - pkg/**/*
  - sdk/**/*
  - Dockerfile
  - docker-compose.yaml
  - deploy/**/*
  - configs/**/*
  - testdata/**/*
  - .env.example
  - .gitlab-ci.yml
  - .golangci.yml
  - .golangci.yaml
  - .golangci.toml
  # GraphQL schema changes require backend rebuild for resolver codegen
  - internal/api/graphql/schema.graphql
  - internal/api/graphql/gqlgen.yml

.ui-changes: &ui-changes
  - ui/**/*
  - internal/api/graphql/schema.graphql
  - api/openapi.yaml
  - .gitlab-ci.yml
  - testdata/**/*

.sdk-ts-changes: &sdk-ts-changes
  - sdk/typescript/**/*
  - .gitlab-ci.yml

.runtime-verification-changes: &runtime-verification-changes
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - pkg/**/*
  - sdk/**/*
  - ui/**/*
  - scripts/smoke-test.sh
  - scripts/smoke-test_test.sh
  - Dockerfile
  - docker-compose.yaml
  - deploy/**/*
  - configs/**/*
  - testdata/**/*
  - .env.example
  - api/openapi.yaml
  - .gitlab-ci.yml
  - .golangci.yml
  - .golangci.yaml
  - .golangci.toml

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Cache Go modules across jobs (pull-only to avoid cache upload stalls if runner-cache backend is degraded)
.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-mod-${GO_VERSION}
    paths:
      - .go/pkg/mod/
      - .go/bin/
    policy: pull

# Pull-only cache (avoids cache upload stalls if runner-cache backend is degraded)
.go-cache-pull: &go-cache-pull
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-mod-${GO_VERSION}
    paths:
      - .go/pkg/mod/
      - .go/bin/
    policy: pull

# Default Go image
.go-image: &go-image
  image: ${DOCKERHUB_CACHE_PREFIX}/library/golang:${GO_VERSION}-alpine
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"

# Debian-based Go image for jobs that need `-race` and/or dockerized integration tests.
.go-image-debian: &go-image-debian
  image: ${DOCKERHUB_CACHE_PREFIX}/library/golang:${GO_VERSION}
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"

# Default Node image (for ui/ and OpenAPI/GraphQL client codegen)
.node-image: &node-image
  image: ${DOCKERHUB_CACHE_PREFIX}/library/node:${NODE_VERSION}-bookworm
  before_script:
    - node --version
    - npm --version
    # Work around occasional npm v10.9.4 failures in k8s CI ("Exit handler never called!").
    - npm i -g npm@${NPM_VERSION}
    - npm --version
    - npm config set cache "${CI_PROJECT_DIR}/ui/.npm" --global

# =============================================================================
# Lint Stage
# =============================================================================

lint:go:
  stage: lint
  image: ${DOCKERHUB_CACHE_PREFIX}/golangci/golangci-lint:${GOLANGCI_LINT_VERSION}-alpine
  <<: *go-cache
  variables:
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true per-job if pipeline-wide incident occurs (file incident ticket).
  script:
    - apk add --no-cache git
    - golangci-lint version
    - golangci-lint run --timeout=30m ./cmd/... ./internal/... ./pkg/... ./scripts/... ./sdk/...
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║  lint:go FAILED — this is a blocking merge gate.        ║"
        echo "║                                                         ║"
        echo "║  Fix: run 'make lint' locally to reproduce.             ║"
        echo "║  Config: .golangci.yml (exclusions and enabled linters) ║"
        echo "║  Owner: Platform/CI — escalate in #ci-support           ║"
        echo "╚══════════════════════════════════════════════════════════╝"
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:fmt:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    # Check formatting on source directories only (not module cache)
    - |
      unformatted=""
      for dir in cmd internal pkg sdk; do
        if [ -d "$dir" ]; then
          found=$(gofmt -l "$dir" 2>/dev/null || true)
          if [ -n "$found" ]; then
            unformatted="${unformatted}${found}"$'\n'
          fi
        fi
      done
      if [ -n "$unformatted" ]; then
        echo "The following files are not formatted:"
        echo "$unformatted"
        echo ""
        echo "Run 'go fmt ./...' to fix"
        echo "$unformatted" | xargs gofmt -d
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:vet:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - go vet ./...
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:gqlgen:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - cd internal/api/graphql
    - go run github.com/99designs/gqlgen generate --config gqlgen.yml
    - git diff --exit-code -- .
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - internal/api/graphql/**/*
        - ui/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - internal/api/graphql/**/*
        - ui/**/*
    - when: never

lint:ui:
  stage: lint
  <<: *node-image
  cache:
    key: ${CI_COMMIT_REF_SLUG}-ui-npm
    paths:
      - ui/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd ui
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run lint:css # BLOCKING token-drift guardrail (Slice 1): fails CI on any raw hex in component <style> blocks
    - npm run codegen:check
    - npm run check
    - npm run typecheck
    - VITE_FI_FHIR_PREVIEW_INTEGRATION_ID=ci-preview-alias npm run build
    - grep -R -F -q 'ci-preview-alias' build/_app/immutable
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ui-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

lint:sdk-typescript:
  stage: lint
  <<: *node-image
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sdk-typescript-npm
    paths:
      - sdk/typescript/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd sdk/typescript
    - npm config set cache "${CI_PROJECT_DIR}/sdk/typescript/.npm" --global
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sdk-ts-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *sdk-ts-changes
    - when: never

lint:helm:
  stage: lint
  image: ${DOCKERHUB_CACHE_PREFIX}/alpine/helm:latest
  script:
    - apk add --no-cache kubectl
    - helm lint deploy/helm/fi-fhir/
    - helm template fi-fhir deploy/helm/fi-fhir/ > /dev/null
    - sh scripts/validate-kustomize-preview.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - deploy/helm/**/*

lint:docs:
  stage: lint
  <<: *go-image
  # Allow failure initially — switch to false after first clean run
  allow_failure: true
  script:
    - apk add --no-cache git bash
    - bash scripts/validate-docs.sh
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - internal/**/*
        - pkg/**/*
        - cmd/**/*
        - AGENTS.md
        - CHANGELOG.md
        - scripts/validate-docs.sh
        - scripts/docs-status.sh
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - internal/**/*
        - pkg/**/*
        - cmd/**/*
        - AGENTS.md
        - CHANGELOG.md
        - scripts/validate-docs.sh
        - scripts/docs-status.sh
    - when: never

lint:contracts:
  stage: lint
  <<: *go-image
  <<: *go-cache
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Promoted to blocking 2026-03-04 (M0 exit criterion). Rollback: set allow_failure: true if needed.
  script:
    - apk add --no-cache git
    - go run ./scripts/check_event_contracts.go --root . --report docs/planning/API-CONTRACT-MATRIX.md
    - go run ./scripts/check_event_contracts.go --root . --strict
  artifacts:
    when: always
    paths:
      - docs/planning/API-CONTRACT-MATRIX.md
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/events/events.go
        - internal/api/graphql/schema.graphql
        - api/openapi.yaml
        - scripts/check_event_contracts.go
        - Makefile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pkg/events/events.go
        - internal/api/graphql/schema.graphql
        - api/openapi.yaml
        - scripts/check_event_contracts.go
        - Makefile
        - .gitlab-ci.yml
    - when: never

# =============================================================================
# Test Stage
# =============================================================================

test:unit:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  variables:
    CGO_ENABLED: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential && rm -rf /var/lib/apt/lists/*
    - go install github.com/boumenot/gocover-cobertura@latest
    - mkdir -p coverage/unit
    - |
      set +e
      go test -race -coverprofile=coverage.out -covermode=atomic -cover ./... \
        -args -test.gocoverdir=$PWD/coverage/unit
      status=$?

      if [ -f coverage.out ]; then
        if [ "$status" -eq 0 ]; then
          go tool cover -func=coverage.out || true
        fi
        gocover-cobertura < coverage.out > coverage.xml || true
      fi

      if [ ! -f coverage.xml ]; then
        echo '<coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0" complexity="0" version="0" timestamp="0"></coverage>' > coverage.xml
      fi

      exit $status
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
      - coverage.xml
      - coverage/unit/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

test:binary:
  stage: test
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - mkdir -p bin
    - go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o bin/fi-fhir ./cmd/fi-fhir
    - ./bin/fi-fhir version
  artifacts:
    paths:
      - bin/fi-fhir
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *runtime-verification-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *runtime-verification-changes
    - when: never

test:sdk-typescript:
  stage: test
  <<: *node-image
  needs:
    - job: test:binary
      artifacts: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sdk-typescript-npm
    paths:
      - sdk/typescript/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd sdk/typescript
    - npm config set cache "${CI_PROJECT_DIR}/sdk/typescript/.npm" --global
    - export FI_FHIR_PATH="${CI_PROJECT_DIR}/bin/fi-fhir"
    - npm ci --no-audit --no-fund
    - npm test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sdk-ts-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *sdk-ts-changes
    - when: never

test:integration:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  services:
    - name: ${DOCKERHUB_CACHE_PREFIX}/library/postgres:16-alpine
      alias: postgres
    - name: ${DOCKERHUB_CACHE_PREFIX}/minio/minio:latest
      alias: minio
  variables:
    CGO_ENABLED: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    # PostgreSQL service container
    POSTGRES_DB: fi_fhir_test
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_HOST_AUTH_METHOD: trust
    FI_FHIR_DATABASE_URL: "postgres://testuser:testpass@postgres:5432/fi_fhir_test?sslmode=disable"
    FI_FHIR_TERMINOLOGY_DB_URL: "postgres://testuser:testpass@postgres:5432/fi_fhir_test?sslmode=disable"
    POSTGRES_TEST_URL: "postgres://testuser:testpass@postgres:5432/fi_fhir_test?sslmode=disable"
    # MinIO service container (bitnami image uses these env vars)
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    MINIO_DEFAULT_BUCKETS: "terminology"
    MINIO_ENDPOINT: "minio:9000"
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_USE_SSL: "false"
    MINIO_BUCKET: "terminology"
    # Also set FI_FHIR_MINIO_* variants for cli_integration_test.go helpers
    FI_FHIR_MINIO_ENDPOINT: "minio:9000"
    FI_FHIR_MINIO_ACCESS_KEY: minioadmin
    FI_FHIR_MINIO_SECRET_KEY: minioadmin
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential && rm -rf /var/lib/apt/lists/*
    - mkdir -p coverage/integration
    - go test -tags=integration -cover -covermode=atomic -timeout=300s ./cmd/fi-fhir/...
      -args -test.gocoverdir=$PWD/coverage/integration
    # Keep terminology DB integration tests in this job, after cmd tests, because both
    # paths reset the shared terminology schema. POSTGRES_TEST_URL uses the CI
    # Postgres service directly and avoids Docker-in-Docker/testcontainers.
    - go test -tags=integration -p 1 -cover -covermode=atomic -timeout=300s ./pkg/terminology/db/
      -args -test.gocoverdir=$PWD/coverage/integration
    - go tool covdata percent -i=coverage/integration
  artifacts:
    paths:
      - coverage/integration/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never
  allow_failure: true

# Blocking proof for the immutable profile/workflow revision boundary used by
# the shared MessageProcessor. Keep this isolated from the broad integration job:
# it owns a dedicated PostgreSQL service and must never pass because a test was
# skipped or absent.
test:artifact-revisions:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  services:
    - name: ${DOCKERHUB_CACHE_PREFIX}/library/postgres:16-alpine
      alias: postgres
  variables:
    CGO_ENABLED: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    POSTGRES_DB: fi_fhir_artifact_test
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_TEST_URL: "postgres://testuser:testpass@postgres:5432/fi_fhir_artifact_test?sslmode=disable"
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates ripgrep && rm -rf /var/lib/apt/lists/*
    - >-
      go test -tags=integration
      -list '^(TestPostgresProfileStore_ImmutableRevisionLifecycleAndBackfill|TestPostgresWorkflowLifecycleStore_PublishRejectsVersionOwnedByAnotherWorkflow|TestPostgresWorkflowLifecycleStore_ConcurrentSavesAllocateUniqueVersions)$'
      ./internal/api/graphql/store
      | rg -x 'TestPostgres(ProfileStore_ImmutableRevisionLifecycleAndBackfill|WorkflowLifecycleStore_(PublishRejectsVersionOwnedByAnotherWorkflow|ConcurrentSavesAllocateUniqueVersions))'
      | awk 'END { if (NR != 3) exit 1 }'
    - >-
      go test -tags=integration -count=1 -timeout=180s
      -run '^(TestPostgresProfileStore_ImmutableRevisionLifecycleAndBackfill|TestPostgresWorkflowLifecycleStore_PublishRejectsVersionOwnedByAnotherWorkflow|TestPostgresWorkflowLifecycleStore_ConcurrentSavesAllocateUniqueVersions)$'
      ./internal/api/graphql/store
    - >-
      go test -tags=integration
      -list '^(TestArtifactRevisionResolver_PostgresV1SurvivesV2|TestMessageProcessorPreviewKernel_PostgresV1SurvivesV2)$'
      ./internal/integration/processor
      | rg -x 'Test(ArtifactRevisionResolver|MessageProcessorPreviewKernel)_PostgresV1SurvivesV2'
      | awk 'END { if (NR != 2) exit 1 }'
    - >-
      go test -tags=integration -count=1 -timeout=180s
      -run '^(TestArtifactRevisionResolver_PostgresV1SurvivesV2|TestMessageProcessorPreviewKernel_PostgresV1SurvivesV2)$'
      ./internal/integration/processor
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never
  allow_failure: false

test:ui:
  stage: test
  <<: *node-image
  needs:
    - job: test:binary
      artifacts: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-ui-npm
    paths:
      - ui/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl && rm -rf /var/lib/apt/lists/*
    - |
      set -eu
      test -x bin/fi-fhir
      export FI_FHIR_DEPLOYMENT_TENANT_ID="tenant-a"
      export FI_FHIR_GRAPHQL_BEARER_TOKEN="ci-authenticated-preview-token-1"
      export FI_FHIR_GRAPHQL_BEARER_TOKEN_FILE=""
      export FI_FHIR_GRAPHQL_PRINCIPAL_ID="ci-ui"
      export FI_FHIR_GRAPHQL_ROLES="integration:preview"
      export FI_FHIR_GRAPHQL_ALLOWED_ORIGINS="http://localhost:5173"
      export FI_FHIR_INTEGRATION_REGISTRY_PATH="${CI_PROJECT_DIR}/testdata/golden/integration/adt-http/preview-registry.json"
      export GRAPHQL_BEARER_TOKEN="${FI_FHIR_GRAPHQL_BEARER_TOKEN}"
      export VITE_FI_FHIR_PREVIEW_INTEGRATION_ID="adt-east"
      bin/fi-fhir serve --port 8081 > fi-fhir-ui-server.log 2>&1 &
      server_pid=$!
      cleanup() {
        kill "$server_pid" 2>/dev/null || true
        wait "$server_pid" 2>/dev/null || true
      }
      trap cleanup EXIT
      echo "Started fi-fhir serve (PID=$server_pid) on :8081"
      ready=false
      for i in $(seq 1 30); do
        if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
          echo "Server ready after ${i}×0.5s"
          ready=true
          break
        fi
        sleep 0.5
      done
      if [ "$ready" != "true" ]; then
        echo "fi-fhir did not become ready on :8081"
        tail -100 fi-fhir-ui-server.log || true
        exit 1
      fi
      cd ui
      npm config set cache "${CI_PROJECT_DIR}/ui/.npm" --global
      npm ci --no-audit --no-fund
      export CI_INTEGRATION_TEST=true
      export VITE_GRAPHQL_API_URL="http://localhost:8081/graphql"
      npm run test:run
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - ui/**/*
        - internal/api/graphql/schema.graphql
        - api/openapi.yaml
        - .gitlab-ci.yml
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - ui/**/*
        - internal/api/graphql/schema.graphql
        - api/openapi.yaml
        - .gitlab-ci.yml
        - cmd/**/*
        - internal/**/*
        - pkg/**/*
    - when: never

test:coverage-merge:
  stage: test
  <<: *go-image
  <<: *go-cache
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true per-job if pipeline-wide incident occurs (file incident ticket).
  needs:
    - job: test:unit
      optional: true
      artifacts: true
    - job: test:integration
      optional: true
      artifacts: true
  script:
    - apk add --no-cache git
    - mkdir -p coverage/merged
    # Convert unit test coverprofile to covdata format
    - |
      if [ -f coverage.out ]; then
        mkdir -p coverage/unit
        go tool covdata textfmt -i=coverage/unit -o=/dev/null 2>/dev/null || true
      fi
    # Merge whatever coverage directories are available
    - |
      dirs=""
      for d in coverage/unit coverage/integration; do
        if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null)" ]; then
          dirs="${dirs:+${dirs},}$d"
        fi
      done
      if [ -z "$dirs" ]; then
        echo "No coverage data to merge"
        exit 0
      fi
      go tool covdata merge -i="$dirs" -o=coverage/merged
      go tool covdata percent -i=coverage/merged
      go tool covdata textfmt -i=coverage/merged -o=coverage-merged.out
    # Generate Cobertura XML for MR visualization
    - go install github.com/boumenot/gocover-cobertura@latest
    - gocover-cobertura < coverage-merged.out > coverage-merged.xml || true
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║  test:coverage-merge FAILED — this is a blocking merge gate. ║"
        echo "║                                                              ║"
        echo "║  Check: coverage artifacts in job output                     ║"
        echo "║  Common cause: upstream test:unit or test:integration failed ║"
        echo "║  Owner: Platform/CI — escalate in #ci-support                ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
      fi
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-merged.xml
    paths:
      - coverage-merged.out
      - coverage-merged.xml
      - coverage/merged/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

test:benchmark:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  variables:
    CGO_ENABLED: "1"
  # Gate owner: Workflow/Platform — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true if thresholds need tuning (file issue with proposed values).
  script:
    - apt-get update && apt-get install -y --no-install-recommends git build-essential && rm -rf /var/lib/apt/lists/*
    # Run benchmarks across all packages with benchmark tests
    - |
      if go test -bench=. -benchmem -run=^$ -count=1 ./internal/workflow/... ./pkg/terminology/... ./pkg/validate/... > benchmark.txt 2>&1; then
        cat benchmark.txt
      else
        benchmark_status=$?
        cat benchmark.txt
        exit "$benchmark_status"
      fi
    # Validate against absolute performance thresholds
    - go run ./cmd/bench-check benchmark.txt
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  test:benchmark FAILED — performance threshold exceeded. ║"
        echo "║                                                          ║"
        echo "║  Artifact: benchmark.txt (attached to this job)          ║"
        echo "║  Local: make bench-check                                 ║"
        echo "║  Thresholds: internal/workflow/benchmark_util.go         ║"
        echo "║  Owner: Workflow/Platform — escalate in #ci-support      ║"
        echo "╚═══════════════════════════════════════════════════════════╝"
      fi
  artifacts:
    paths:
      - benchmark.txt
    expire_in: 3 months
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
      when: manual
    - when: never
  allow_failure: false # Blocking after truthful shared-runner threshold calibration

test:docs-status:
  stage: test
  <<: *go-image
  <<: *go-cache
  # Gate owner: Platform/Docs — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true if drift threshold needs tuning.
  needs:
