    - when: never

security:trivy-image:
  stage: scan
  image:
    name: ${DOCKERHUB_CACHE_PREFIX}/aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  needs:
    - job: build:docker
      artifacts: true
  script:
    # Scan the image tarball directly
    - trivy image --input docker-image.tar --exit-code 0 --severity HIGH,CRITICAL --format sarif -o trivy-image-report.sarif
    - trivy image --input docker-image.tar --exit-code 1 --severity CRITICAL
    - trivy image --input docker-image.tar --exit-code 1 --severity HIGH --ignore-unfixed
  artifacts:
    reports:
      sast: trivy-image-report.sarif
    paths:
      - trivy-image-report.sarif
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

security:license-check:
  stage: security
  <<: *go-image
  <<: *go-cache-pull
  script:
    - apk add --no-cache git
    - go install github.com/google/go-licenses@${GO_LICENSES_VERSION}
    - |
      if go-licenses check --disallowed_types=forbidden,unknown ./... > go-licenses.txt 2>&1; then
        cat go-licenses.txt
      else
        rc=$?
        cat go-licenses.txt
        exit "$rc"
      fi
    - go-licenses csv ./... > go-licenses.csv
  artifacts:
    paths:
      - go-licenses.txt
      - go-licenses.csv
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

security:trivy-ui-image:
  stage: scan
  image:
    name: ${DOCKERHUB_CACHE_PREFIX}/aquasec/trivy:${TRIVY_VERSION}
