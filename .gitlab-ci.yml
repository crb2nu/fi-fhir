test:smoke:
  stage: test
  <<: *go-image
  # Gate owner: Platform/Integration — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true if endpoint assumptions change.
  needs:
    - job: test:binary
      artifacts: true
  script:
    - apk add --no-cache bash curl
    - |
      set -eu
      bash scripts/smoke-test_test.sh
      test -x bin/fi-fhir
      export FI_FHIR_DEPLOYMENT_TENANT_ID="tenant-a"
      export FI_FHIR_GRAPHQL_BEARER_TOKEN="ci-authenticated-preview-token-1"
      export FI_FHIR_GRAPHQL_BEARER_TOKEN_FILE=""
      export FI_FHIR_GRAPHQL_PRINCIPAL_ID="ci-smoke"
      export FI_FHIR_GRAPHQL_ROLES="integration:preview"
      export FI_FHIR_GRAPHQL_ALLOWED_ORIGINS="http://localhost:5173"
      export FI_FHIR_INTEGRATION_REGISTRY_PATH="${CI_PROJECT_DIR}/testdata/golden/integration/adt-http/preview-registry.json"
      export GRAPHQL_BEARER_TOKEN="${FI_FHIR_GRAPHQL_BEARER_TOKEN}"
      bin/fi-fhir serve --port 8081 > fi-fhir-smoke-server.log 2>&1 &
      server_pid=$!
      cleanup() {
        kill "$server_pid" 2>/dev/null || true
        wait "$server_pid" 2>/dev/null || true
      }
      trap cleanup EXIT
      echo "Started fi-fhir serve (PID=$server_pid) on :8081"
      ready=false
      for i in $(seq 1 30); do
        if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
          echo "Server ready after ${i}×0.5s"
          ready=true
          break
        fi
        sleep 0.5
      done
      if [ "$ready" != "true" ]; then
        echo "fi-fhir did not become ready on :8081"
        tail -100 fi-fhir-smoke-server.log || true
        exit 1
      fi
      BASE_URL=http://localhost:8081 GRAPHQL_ALLOWED_ORIGIN=http://localhost:5173 TIMEOUT=5 RETRIES=2 bash scripts/smoke-test.sh
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║  test:smoke FAILED — endpoint smoke checks did not pass.   ║"
        echo "║                                                            ║"
        echo "║  Local: BASE_URL=http://localhost:8080 bash scripts/smoke-test.sh"
        echo "║  Script: scripts/smoke-test.sh                             ║"
        echo "║  Owner: Platform/Integration — escalate in #ci-support     ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *runtime-verification-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *runtime-verification-changes
    - when: never

# =============================================================================
# Security Stage
# =============================================================================

security:govulncheck:
  stage: security
  <<: *go-image
  <<: *go-cache-pull
  variables:
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  script:
    - apk add --no-cache git
    - go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
    - govulncheck ./cmd/... ./internal/... ./pkg/... ./scripts/...
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

security:gosec:
  stage: security
  <<: *go-image
  <<: *go-cache-pull
  variables:
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true per-job if pipeline-wide incident occurs (file incident ticket).
  # Exclusions mirror .golangci.yml gosec settings to avoid false-positive blocks.
  script:
    - apk add --no-cache git
    - go install github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}
    # Report all findings to SARIF for GitLab security dashboard (always succeeds)
    - gosec -fmt sarif -out gosec-report.sarif -exclude-generated -exclude=G104,G201,G304,G301,G302,G306,G115,G404,G101,G602,G703,G704 ./cmd/... ./internal/... ./pkg/... ./sdk/... || true
    # Gate: fail only on HIGH severity + HIGH confidence findings (filter noise from standalone gosec).
    # Note: golangci-lint's gosec integration (in lint:go) provides the primary gosec gate with full
    # .golangci.yml exclusion support. This standalone gate catches critical findings missed by lint rules.
    - gosec -fmt text -severity high -confidence high -exclude-generated -exclude=G104,G201,G304,G301,G302,G306,G115,G404,G101,G602,G703,G704 ./cmd/... ./internal/... ./pkg/... ./sdk/...
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║  security:gosec FAILED — this is a blocking merge gate. ║"
        echo "║                                                         ║"
        echo "║  SARIF report: check job artifacts for gosec-report.sarif"
        echo "║  Exclusions: .golangci.yml → linters-settings.gosec     ║"
        echo "║  Fix: address findings or add exclusion with rationale  ║"
        echo "║  Owner: Platform/CI — escalate in #ci-support           ║"
        echo "╚══════════════════════════════════════════════════════════╝"
      fi
  artifacts:
    reports:
      sast: gosec-report.sarif
    when: always
  retry:
    max: 2
    when: runner_system_failure
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

security:trivy:
  stage: security
  image:
    name: ${DOCKERHUB_CACHE_PREFIX}/aquasec/trivy:${TRIVY_VERSION}
    entrypoint: [""]
  script:
    # Preserve all HIGH/CRITICAL vulnerability and secret findings for review.
    - trivy fs --scanners vuln,secret --skip-dirs .tmp --skip-dirs .go --skip-dirs .cache --skip-dirs ui/.npm --skip-dirs sdk/typescript/.npm --exit-code 0 --severity HIGH,CRITICAL --format sarif -o trivy-report.sarif .
    # Required gates: no CRITICAL dependency finding and no detected HIGH/CRITICAL secret.
    - trivy fs --scanners vuln --skip-dirs .tmp --skip-dirs .go --skip-dirs .cache --skip-dirs ui/.npm --skip-dirs sdk/typescript/.npm --exit-code 1 --severity CRITICAL .
    - trivy fs --scanners secret --skip-dirs .tmp --skip-dirs .go --skip-dirs .cache --skip-dirs ui/.npm --skip-dirs sdk/typescript/.npm --exit-code 1 --severity HIGH,CRITICAL .
  artifacts:
    reports:
      sast: trivy-report.sarif
    paths:
      - trivy-report.sarif
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*"
    - when: never

security:npm-audit-ui:
  stage: security
  <<: *node-image
  cache:
    key: ${CI_COMMIT_REF_SLUG}-ui-npm
    paths:
      - ui/.npm/
    policy: pull
  script:
    - cd ui
    - npm ci --no-audit --no-fund
    # Preserve the complete report, then propagate the HIGH/CRITICAL gate exit.
    - npm audit --audit-level=high --json > npm-audit.json || true
    - npm audit --audit-level=high
  artifacts:
    paths:
      - ui/npm-audit.json
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ui-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

security:npm-audit-sdk:
