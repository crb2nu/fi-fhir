# =============================================================================
# Build Stage
# =============================================================================

build:binary:
  stage: build
  <<: *go-image
  <<: *go-cache
  needs:
    - job: test:unit
      optional: true
  script:
    - apk add --no-cache git
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      go build -ldflags="-s -w -X main.version=${VERSION}" -o bin/fi-fhir ./cmd/fi-fhir
    - ./bin/fi-fhir version
  artifacts:
    paths:
      - bin/fi-fhir
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

build:docker:
  stage: build
  image: ${DOCKERHUB_CACHE_PREFIX}/library/docker:24
  services:
    - ${DOCKERHUB_CACHE_PREFIX}/library/docker:24-dind
  needs:
    - job: test:unit
      optional: true
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_SERVICE_CPU_LIMIT: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  script:
    - |
      # Ensure the docker client can auth to Harbor (so docker builds can pull base images via the Harbor cache).
      # The GitLab K8s runner mounts a docker config secret ("harbor-creds") at /docker-secrets.
      if [ -f /docker-secrets/config.json ]; then
        mkdir -p /root/.docker
        cp /docker-secrets/config.json /root/.docker/config.json
      elif [ -f /docker-secrets/.dockerconfigjson ]; then
        mkdir -p /root/.docker
        cp /docker-secrets/.dockerconfigjson /root/.docker/config.json
      fi
    - |
      # Use CI_REGISTRY_IMAGE if set, otherwise default to fi-fhir
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_TAG}"
      else
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      docker build \
        --pull \
        --build-arg GO_IMAGE="${DOCKERHUB_CACHE_PREFIX}/library/golang:${GO_VERSION}-alpine" \
        --build-arg VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" \
        -t "${IMAGE_TAG}" \
        .
    - docker save "${IMAGE_TAG}" > docker-image.tar
  artifacts:
    paths:
      - docker-image.tar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

build:docker-ui:
  stage: build
  image: ${DOCKERHUB_CACHE_PREFIX}/library/docker:24
  services:
    - ${DOCKERHUB_CACHE_PREFIX}/library/docker:24-dind
  needs:
    - job: lint:ui
      optional: true
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_SERVICE_CPU_LIMIT: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  script:
    - |
      # Ensure the docker client can auth to Harbor (so docker builds can pull base images via the Harbor cache).
      # The GitLab K8s runner mounts a docker config secret ("harbor-creds") at /docker-secrets.
      if [ -f /docker-secrets/config.json ]; then
        mkdir -p /root/.docker
        cp /docker-secrets/config.json /root/.docker/config.json
      elif [ -f /docker-secrets/.dockerconfigjson ]; then
        mkdir -p /root/.docker
        cp /docker-secrets/.dockerconfigjson /root/.docker/config.json
      fi
    - |
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}-ui"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_TAG}"
      else
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      BUILD_TAG="v0.1.${CI_PIPELINE_IID}"
      docker build \
        --pull \
        --build-arg NODE_IMAGE="${DOCKERHUB_CACHE_PREFIX}/library/node:${NODE_VERSION}-alpine" \
        --build-arg NGINX_IMAGE="${DOCKERHUB_CACHE_PREFIX}/library/nginx:${NGINX_IMAGE_REF}" \
        --build-arg VITE_BUILD_SHA="${CI_COMMIT_SHORT_SHA}" \
        --build-arg VITE_BUILD_TAG="${BUILD_TAG}" \
        --build-arg VITE_BUILD_TIME="${CI_PIPELINE_CREATED_AT}" \
        --build-arg VITE_FI_FHIR_PREVIEW_INTEGRATION_ID="adt-east" \
        -t "${IMAGE_TAG}" \
        ./ui
    - docker save "${IMAGE_TAG}" > docker-ui-image.tar
  artifacts:
    paths:
      - docker-ui-image.tar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ui-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

# =============================================================================
# Deploy Stage (continuous deployment on main branch)
# =============================================================================

deploy:docker:
  stage: deploy
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  variables:
    # Harbor publish is required on main branch (platform/gitops pulls from Harbor).
    PUBLISH_HARBOR: "1"
    REQUIRE_DOCKER_PUBLISH: "1"
    REQUIRE_HARBOR_PUBLISH: "1"
    # Cluster DNS currently resolves registry.harbor.lan incorrectly; override to the reachable IP.
    # Set this at the group/project level if it ever changes.
    HARBOR_REGISTRY_IP: "192.168.50.230"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_SERVICE_CPU_LIMIT: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  # Keep normal stage barriers so every required test/security/scan gate passes
  # before publish; dependencies selects only the scanned image artifact.
  dependencies:
    - build:docker
  before_script:
    - |
      set -e

      # We can't reliably edit /etc/hosts in Kubernetes runner pods (it's a managed mount),
      # so route Harbor pushes to the IP directly when HARBOR_REGISTRY_IP is set.
      harbor_registry_host="${HARBOR_REGISTRY:-registry.harbor.lan}"
      harbor_registry_push="${harbor_registry_host}"
      if [ -n "${HARBOR_REGISTRY_IP:-}" ]; then
        echo "Harbor IP override enabled: ${harbor_registry_host} -> ${HARBOR_REGISTRY_IP}"
        harbor_registry_push="${HARBOR_REGISTRY_IP}"
        HARBOR_REGISTRY_PORT="${HARBOR_REGISTRY_PORT:-443}"
        case "${harbor_registry_push}" in
          *:*)
            ;;
          *)
            harbor_registry_push="${harbor_registry_push}:${HARBOR_REGISTRY_PORT}"
            ;;
        esac
      fi

      # Prefer explicit credentials if provided; otherwise, if pushing via IP, derive creds
      # from the existing docker config entry for the hostname and log in to the IP.
      if [ -n "${HARBOR_USERNAME:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
        printf '%s' "${HARBOR_PASSWORD}" | crane --insecure auth login "${harbor_registry_push}" --username "${HARBOR_USERNAME}" --password-stdin
      elif [ "${harbor_registry_push}" != "${harbor_registry_host}" ] && [ -f /root/.docker/config.json ]; then
        config_one_line="$(tr -d '\n' < /root/.docker/config.json)"
        host_re="${harbor_registry_host//./\\.}"
        auth_b64="$(printf '%s' "${config_one_line}" | sed -nE "s/.*\\\"(https:\\/\\/)?${host_re}\\\"[[:space:]]*:[[:space:]]*\\{[^}]*\\\"auth\\\"[[:space:]]*:[[:space:]]*\\\"([^\\\"]+)\\\".*/\\2/p" || true)"
        if [ -n "${auth_b64:-}" ]; then
          decoded="$(printf '%s' "${auth_b64}" | base64 -d 2>/dev/null || true)"
          username="${decoded%%:*}"
          password="${decoded#*:}"
          if [ -n "${username:-}" ] && [ -n "${password:-}" ] && [ "${username}" != "${password}" ]; then
            printf '%s' "${password}" | crane --insecure auth login "${harbor_registry_push}" --username "${username}" --password-stdin
          else
            echo "Failed to decode Harbor credentials from docker config; set HARBOR_USERNAME/HARBOR_PASSWORD." >&2
          fi
        else
          echo "No auth entry found for ${harbor_registry_host} in docker config; Harbor publish may fail." >&2
        fi
      fi

      export HARBOR_REGISTRY="${harbor_registry_push}"
  script:
    - |
      published=0

      # Publish to GitLab registry if configured (avoid pushing to Docker Hub accidentally).
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_IMAGE:-}" ] && [ -n "${CI_REGISTRY_USER:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ]; then
        echo "${CI_REGISTRY_PASSWORD}" | crane auth login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin
        crane push docker-image.tar "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        crane tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" main
        published=1
      else
        echo "CI_REGISTRY/CI_REGISTRY_IMAGE not set; skipping GitLab registry publish."
      fi
    - |
      # Optional: also publish to Harbor for in-cluster pulls (used by platform/gitops).
      # The GitLab runner mounts a Docker config secret ("harbor-creds") at /docker-secrets,
      # and the pre_build_script copies it into /root/.docker/config.json. Prefer that over
      # CI variables so publishing works without per-project secrets.
      if [ "${PUBLISH_HARBOR}" != "1" ]; then
        echo "PUBLISH_HARBOR!=1; skipping Harbor publish."
      elif [ -f /root/.docker/config.json ]; then
        export HOME=/root
        HARBOR_REGISTRY="${HARBOR_REGISTRY:-registry.harbor.lan}"
        HARBOR_PROJECT="${HARBOR_PROJECT:-library}"
        HARBOR_IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/fi-fhir"
        HARBOR_SEMVER_TAG="v0.1.${CI_PIPELINE_ID:-${CI_PIPELINE_IID}}"
        echo "Publishing fi-fhir to Harbor: ${HARBOR_IMAGE}:${HARBOR_SEMVER_TAG}"
        harbor_ok=0
        crane_retry() {
          tries="$1"
          shift
          i=1
          while [ "$i" -le "$tries" ]; do
            if "$@"; then
              return 0
            fi
            echo "crane failed (attempt ${i}/${tries}); retrying..." >&2
            sleep $((i * 5))
            i=$((i + 1))
          done
          return 1
        }

        if crane_retry 5 crane --insecure push docker-image.tar "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
          && crane_retry 5 crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" main \
          && crane_retry 5 crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${HARBOR_SEMVER_TAG}"; then
          harbor_ok=1
        else
          echo "Harbor publish failed." >&2
        fi

        if [ "$harbor_ok" -eq 1 ]; then
          published=1
        elif [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      else
        echo "No Docker auth config found; skipping Harbor publish."
        if [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi

      if [ "$published" -ne 1 ]; then
        echo "No registry published for deploy:docker." >&2
        if [ "${REQUIRE_DOCKER_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

