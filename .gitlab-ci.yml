include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

stages:
  - lint
  - test
  - security
  - build
  - deploy
  - release

variables:
  GO_VERSION: "1.25.5"
  GOLANGCI_LINT_VERSION: "v2.8.0"
  NODE_VERSION: "22"
  CGO_ENABLED: "0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # GitLab Kubernetes runner resources (avoid exceeding the ci-jobs namespace quota).
  # Many repos in this workspace set these explicitly because runner defaults can be very large.
  KUBERNETES_CPU_REQUEST: "200m"
  KUBERNETES_CPU_LIMIT: "1"
  KUBERNETES_MEMORY_REQUEST: "512Mi"
  KUBERNETES_MEMORY_LIMIT: "2Gi"
  KUBERNETES_HELPER_CPU_REQUEST: "50m"
  KUBERNETES_HELPER_CPU_LIMIT: "200m"
  KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"
  # Service containers (e.g. docker:dind) can also inherit very large default limits.
  KUBERNETES_SERVICE_CPU_REQUEST: "200m"
  KUBERNETES_SERVICE_CPU_LIMIT: "1"
  KUBERNETES_SERVICE_MEMORY_REQUEST: "512Mi"
  KUBERNETES_SERVICE_MEMORY_LIMIT: "2Gi"

# Common change sets (use in rules:changes)
.go-changes: &go-changes
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - pkg/**/*
  - sdk/**/*
  - Dockerfile
  - .gitlab-ci.yml
  - .golangci.yml
  - .golangci.yaml
  - .golangci.toml

.ui-changes: &ui-changes
  - ui/**/*
  - internal/api/graphql/schema.graphql
  - api/openapi.yaml
  - .gitlab-ci.yml

.sdk-ts-changes: &sdk-ts-changes
  - sdk/typescript/**/*

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Cache Go modules across jobs (pull-only to avoid cache upload stalls if runner-cache backend is degraded)
.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-mod-${GO_VERSION}
    paths:
      - .go/pkg/mod/
      - .go/bin/
    policy: pull

# Pull-only cache (avoids cache upload stalls if runner-cache backend is degraded)
.go-cache-pull: &go-cache-pull
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-mod-${GO_VERSION}
    paths:
      - .go/pkg/mod/
      - .go/bin/
    policy: pull

# Default Go image
.go-image: &go-image
  image: golang:${GO_VERSION}-alpine
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"

# Debian-based Go image for jobs that need `-race` and/or dockerized integration tests.
.go-image-debian: &go-image-debian
  image: golang:${GO_VERSION}
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"

# Default Node image (for ui/ and OpenAPI/GraphQL client codegen)
.node-image: &node-image
  image: node:${NODE_VERSION}-bookworm
  before_script:
    - node --version
    - npm --version
    - npm config set cache "${CI_PROJECT_DIR}/ui/.npm" --global

# =============================================================================
# Lint Stage
# =============================================================================

lint:go:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git curl
    # Use pre-built binary to avoid dependency download issues
    - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "${GOPATH}/bin" ${GOLANGCI_LINT_VERSION}
    - golangci-lint run --timeout=10m ./...
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:fmt:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    # Check formatting on source directories only (not module cache)
    - |
      unformatted=""
      for dir in cmd internal pkg sdk; do
        if [ -d "$dir" ]; then
          found=$(gofmt -l "$dir" 2>/dev/null || true)
          if [ -n "$found" ]; then
            unformatted="${unformatted}${found}"$'\n'
          fi
        fi
      done
      if [ -n "$unformatted" ]; then
        echo "The following files are not formatted:"
        echo "$unformatted"
        echo ""
        echo "Run 'go fmt ./...' to fix"
        echo "$unformatted" | xargs gofmt -d
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:vet:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - go vet ./...
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:gqlgen:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - cd internal/api/graphql
    - go run github.com/99designs/gqlgen generate --config gqlgen.yml
    - git diff --exit-code -- .
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - internal/api/graphql/**/*
        - ui/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - internal/api/graphql/**/*
        - ui/**/*
    - when: never

lint:ui:
  stage: lint
  <<: *node-image
  cache:
    key: ${CI_COMMIT_REF_SLUG}-ui-npm
    paths:
      - ui/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd ui
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run codegen:check
    - npm run check
    - npm run typecheck
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ui-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

lint:sdk-typescript:
  stage: lint
  <<: *node-image
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sdk-typescript-npm
    paths:
      - sdk/typescript/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd sdk/typescript
    - npm config set cache "${CI_PROJECT_DIR}/sdk/typescript/.npm" --global
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sdk-ts-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *sdk-ts-changes
    - when: never

lint:helm:
  stage: lint
  image: alpine/helm:latest
  script:
    - helm lint deploy/helm/fi-fhir/
    - helm template fi-fhir deploy/helm/fi-fhir/ > /dev/null
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - deploy/helm/**/*

# =============================================================================
# Test Stage
# =============================================================================

test:unit:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  variables:
    CGO_ENABLED: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential && rm -rf /var/lib/apt/lists/*
    - go install github.com/boumenot/gocover-cobertura@latest
    - |
      set +e
      go test -race -coverprofile=coverage.out -covermode=atomic ./...
      status=$?

      if [ -f coverage.out ]; then
        if [ "$status" -eq 0 ]; then
          go tool cover -func=coverage.out || true
        fi
        gocover-cobertura < coverage.out > coverage.xml || true
      fi

      if [ ! -f coverage.xml ]; then
        echo '<coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0" complexity="0" version="0" timestamp="0"></coverage>' > coverage.xml
      fi

      exit $status
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
      - coverage.xml
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

test:binary:
  stage: test
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - mkdir -p bin
    - go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o bin/fi-fhir ./cmd/fi-fhir
    - ./bin/fi-fhir version
  artifacts:
    paths:
      - bin/fi-fhir
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sdk-ts-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *sdk-ts-changes
    - when: never

test:sdk-typescript:
  stage: test
  <<: *node-image
  needs:
    - test:binary
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sdk-typescript-npm
    paths:
      - sdk/typescript/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd sdk/typescript
    - npm config set cache "${CI_PROJECT_DIR}/sdk/typescript/.npm" --global
    - export FI_FHIR_PATH="${CI_PROJECT_DIR}/bin/fi-fhir"
    - npm ci --no-audit --no-fund
    - npm test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sdk-ts-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *sdk-ts-changes
    - when: never

test:integration:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  services:
    - docker:24-dind
  variables:
    CGO_ENABLED: "1"
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential && rm -rf /var/lib/apt/lists/*
    - go test -tags=integration -race ./...
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
      when: manual
    - when: never
  allow_failure: true

test:benchmark:
  stage: test
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - go test -bench=. -benchmem -run=^$ ./internal/workflow/... | tee benchmark.txt
  artifacts:
    paths:
      - benchmark.txt
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
      when: manual
    - when: never
  allow_failure: true

# =============================================================================
# Security Stage
# =============================================================================

security:govulncheck:
  stage: security
  <<: *go-image
  <<: *go-cache-pull
  script:
    - apk add --no-cache git
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./...
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never
  allow_failure: true

security:gosec:
  stage: security
  <<: *go-image
  <<: *go-cache-pull
  script:
    - apk add --no-cache git
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    - gosec -fmt sarif -out gosec-report.sarif -exclude-generated ./... || true
  artifacts:
    reports:
      sast: gosec-report.sarif
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never
  allow_failure: true

security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --format sarif -o trivy-report.sarif .
    - trivy fs --exit-code 1 --severity CRITICAL .
  artifacts:
    reports:
      sast: trivy-report.sarif
    paths:
      - trivy-report.sarif
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*"
    - when: never
  allow_failure: true

# =============================================================================
# Build Stage
# =============================================================================

build:binary:
  stage: build
  <<: *go-image
  <<: *go-cache
  needs:
    - test:unit
  script:
    - apk add --no-cache git
    - |
      VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
      go build -ldflags="-s -w -X main.version=${VERSION}" -o bin/fi-fhir ./cmd/fi-fhir
    - ./bin/fi-fhir version
  artifacts:
    paths:
      - bin/fi-fhir
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

build:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - test:unit
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_SERVICE_CPU_LIMIT: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  script:
    - |
      # Use CI_REGISTRY_IMAGE if set, otherwise default to fi-fhir
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_TAG}"
      else
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_SHORT_SHA}"
      fi
    - docker build --build-arg VERSION="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -t "${IMAGE_TAG}" .
    - docker save "${IMAGE_TAG}" > docker-image.tar
  artifacts:
    paths:
      - docker-image.tar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

build:docker-ui:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_SERVICE_CPU_LIMIT: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  script:
    - |
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}-ui"
      if [ -n "${CI_COMMIT_TAG}" ]; then
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_TAG}"
      else
        IMAGE_TAG="${IMAGE_BASE}:${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      BUILD_TAG="v0.1.${CI_PIPELINE_IID}"
      docker build \
        --build-arg VITE_BUILD_SHA="${CI_COMMIT_SHORT_SHA}" \
        --build-arg VITE_BUILD_TAG="${BUILD_TAG}" \
        --build-arg VITE_BUILD_TIME="${CI_PIPELINE_CREATED_AT}" \
        -t "${IMAGE_TAG}" \
        ./ui
    - docker save "${IMAGE_TAG}" > docker-ui-image.tar
  artifacts:
    paths:
      - docker-ui-image.tar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ui-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

# =============================================================================
# Deploy Stage (continuous deployment on main branch)
# =============================================================================

deploy:docker:
  stage: deploy
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  variables:
    # Harbor publish is required on main branch (platform/gitops pulls from Harbor).
    PUBLISH_HARBOR: "1"
    REQUIRE_DOCKER_PUBLISH: "1"
    REQUIRE_HARBOR_PUBLISH: "1"
    # Cluster DNS currently resolves registry.harbor.lan incorrectly; override to the reachable IP.
    # Set this at the group/project level if it ever changes.
    HARBOR_REGISTRY_IP: "192.168.50.230"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_SERVICE_CPU_LIMIT: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  needs:
    - build:docker
  before_script:
    - |
      HARBOR_REGISTRY="${HARBOR_REGISTRY:-registry.harbor.lan}"
      if [ -n "${HARBOR_REGISTRY_IP:-}" ]; then
        HARBOR_REGISTRY_RE="${HARBOR_REGISTRY//./\\.}"
        # Ensure our mapping wins even if an incorrect entry already exists.
        sed -i -E "/(^|[[:space:]])${HARBOR_REGISTRY_RE}([[:space:]]|$)/d" /etc/hosts
        echo "${HARBOR_REGISTRY_IP} ${HARBOR_REGISTRY}" >> /etc/hosts
        echo "Harbor host override: ${HARBOR_REGISTRY} -> ${HARBOR_REGISTRY_IP}"
        echo "Harbor hosts entry:"
        grep -n "${HARBOR_REGISTRY}" /etc/hosts || true
      fi
  script:
    - |
      published=0

      # Publish to GitLab registry if configured (avoid pushing to Docker Hub accidentally).
      if [ -n "${CI_REGISTRY}" ] && [ -n "${CI_REGISTRY_IMAGE}" ] && [ -n "${CI_REGISTRY_USER}" ] && [ -n "${CI_REGISTRY_PASSWORD}" ]; then
        echo "${CI_REGISTRY_PASSWORD}" | crane auth login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin
        crane push docker-image.tar "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        crane tag "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" main
        published=1
      else
        echo "CI_REGISTRY/CI_REGISTRY_IMAGE not set; skipping GitLab registry publish."
      fi
    - |
      # Optional: also publish to Harbor for in-cluster pulls (used by platform/gitops).
      # The GitLab runner mounts a Docker config secret ("harbor-creds") at /docker-secrets,
      # and the pre_build_script copies it into /root/.docker/config.json. Prefer that over
      # CI variables so publishing works without per-project secrets.
      if [ "${PUBLISH_HARBOR}" != "1" ]; then
        echo "PUBLISH_HARBOR!=1; skipping Harbor publish."
      elif [ -f /root/.docker/config.json ]; then
        export HOME=/root
        HARBOR_REGISTRY="${HARBOR_REGISTRY:-registry.harbor.lan}"
        HARBOR_PROJECT="${HARBOR_PROJECT:-library}"
        HARBOR_IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/fi-fhir"
        HARBOR_SEMVER_TAG="v0.1.${CI_PIPELINE_IID}"
        echo "Publishing fi-fhir to Harbor: ${HARBOR_IMAGE}:${HARBOR_SEMVER_TAG}"
        harbor_ok=0
        if crane --insecure push docker-image.tar "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" && crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" main && crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${HARBOR_SEMVER_TAG}"; then
          harbor_ok=1
        else
          echo "Harbor publish failed." >&2
        fi

        if [ "$harbor_ok" -eq 1 ]; then
          published=1
        elif [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      else
        echo "No Docker auth config found; skipping Harbor publish."
        if [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi

      if [ "$published" -ne 1 ]; then
        echo "No registry published for deploy:docker." >&2
        if [ "${REQUIRE_DOCKER_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

deploy:docker-ui:
  stage: deploy
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  variables:
    # Harbor publish is required on main branch (platform/gitops pulls from Harbor).
    PUBLISH_HARBOR: "1"
    REQUIRE_DOCKER_PUBLISH: "1"
    REQUIRE_HARBOR_PUBLISH: "1"
    # Cluster DNS currently resolves registry.harbor.lan incorrectly; override to the reachable IP.
    # Set this at the group/project level if it ever changes.
    HARBOR_REGISTRY_IP: "192.168.50.230"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    KUBERNETES_SERVICE_CPU_LIMIT: "2"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "6Gi"
  needs:
    - build:docker-ui
  before_script:
    - |
      HARBOR_REGISTRY="${HARBOR_REGISTRY:-registry.harbor.lan}"
      if [ -n "${HARBOR_REGISTRY_IP:-}" ]; then
        HARBOR_REGISTRY_RE="${HARBOR_REGISTRY//./\\.}"
        # Ensure our mapping wins even if an incorrect entry already exists.
        sed -i -E "/(^|[[:space:]])${HARBOR_REGISTRY_RE}([[:space:]]|$)/d" /etc/hosts
        echo "${HARBOR_REGISTRY_IP} ${HARBOR_REGISTRY}" >> /etc/hosts
        echo "Harbor host override: ${HARBOR_REGISTRY} -> ${HARBOR_REGISTRY_IP}"
        echo "Harbor hosts entry:"
        grep -n "${HARBOR_REGISTRY}" /etc/hosts || true
      fi
  script:
    - |
      published=0

      # Publish to GitLab registry if configured (avoid pushing to Docker Hub accidentally).
      if [ -n "${CI_REGISTRY}" ] && [ -n "${CI_REGISTRY_IMAGE}" ] && [ -n "${CI_REGISTRY_USER}" ] && [ -n "${CI_REGISTRY_PASSWORD}" ]; then
        echo "${CI_REGISTRY_PASSWORD}" | crane auth login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin
        crane push docker-ui-image.tar "${CI_REGISTRY_IMAGE}-ui:${CI_COMMIT_SHORT_SHA}"
        crane tag "${CI_REGISTRY_IMAGE}-ui:${CI_COMMIT_SHORT_SHA}" main
        published=1
      else
        echo "CI_REGISTRY/CI_REGISTRY_IMAGE not set; skipping GitLab registry publish."
      fi
    - |
      # Optional: also publish to Harbor for in-cluster pulls (used by platform/gitops).
      # The GitLab runner mounts a Docker config secret ("harbor-creds") at /docker-secrets,
      # and the pre_build_script copies it into /root/.docker/config.json. Prefer that over
      # CI variables so publishing works without per-project secrets.
      if [ "${PUBLISH_HARBOR}" != "1" ]; then
        echo "PUBLISH_HARBOR!=1; skipping Harbor publish."
      elif [ -f /root/.docker/config.json ]; then
        export HOME=/root
        HARBOR_REGISTRY="${HARBOR_REGISTRY:-registry.harbor.lan}"
        HARBOR_PROJECT="${HARBOR_PROJECT:-library}"
        HARBOR_IMAGE="${HARBOR_REGISTRY}/${HARBOR_PROJECT}/fi-fhir-ui"
        HARBOR_SEMVER_TAG="v0.1.${CI_PIPELINE_IID}"
        echo "Publishing fi-fhir-ui to Harbor: ${HARBOR_IMAGE}:${HARBOR_SEMVER_TAG}"
        harbor_ok=0
        if crane --insecure push docker-ui-image.tar "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" && crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" main && crane --insecure tag "${HARBOR_IMAGE}:${CI_COMMIT_SHORT_SHA}" "${HARBOR_SEMVER_TAG}"; then
          harbor_ok=1
        else
          echo "Harbor publish failed." >&2
        fi

        if [ "$harbor_ok" -eq 1 ]; then
          published=1
        elif [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      else
        echo "No Docker auth config found; skipping Harbor publish."
        if [ "${REQUIRE_HARBOR_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi

      if [ "$published" -ne 1 ]; then
        echo "No registry published for deploy:docker-ui." >&2
        if [ "${REQUIRE_DOCKER_PUBLISH}" = "1" ]; then
          exit 1
        fi
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

# =============================================================================
# Release Stage
# =============================================================================

release:binaries:
  stage: release
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - mkdir -p dist
    - |
      VERSION="${CI_COMMIT_TAG}"

      # Linux AMD64
      GOOS=linux GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-linux-amd64 ./cmd/fi-fhir

      # Linux ARM64
      GOOS=linux GOARCH=arm64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-linux-arm64 ./cmd/fi-fhir

      # Darwin AMD64
      GOOS=darwin GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-darwin-amd64 ./cmd/fi-fhir

      # Darwin ARM64
      GOOS=darwin GOARCH=arm64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-darwin-arm64 ./cmd/fi-fhir

      # Windows AMD64
      GOOS=windows GOARCH=amd64 go build \
        -ldflags="-s -w -X main.version=${VERSION}" \
        -o dist/fi-fhir-windows-amd64.exe ./cmd/fi-fhir
    - cd dist && sha256sum * > checksums.txt
  artifacts:
    paths:
      - dist/
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG

release:docker:
  stage: release
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - |
      # Use CI_REGISTRY_IMAGE if set, otherwise default to fi-fhir
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}"
      VERSION="${CI_COMMIT_TAG#v}"
      MAJOR="${VERSION%%.*}"
      MINOR="${VERSION%.*}"

      # Build image
      docker build \
        --build-arg VERSION="${CI_COMMIT_TAG}" \
        -t "${IMAGE_BASE}:${CI_COMMIT_TAG}" \
        -t "${IMAGE_BASE}:${VERSION}" \
        -t "${IMAGE_BASE}:${MINOR}" \
        -t "${IMAGE_BASE}:${MAJOR}" \
        -t "${IMAGE_BASE}:latest" \
        .

      # Push all tags
      docker push "${IMAGE_BASE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE_BASE}:${VERSION}"
      docker push "${IMAGE_BASE}:${MINOR}"
      docker push "${IMAGE_BASE}:${MAJOR}"
      docker push "${IMAGE_BASE}:latest"
  rules:
    - if: $CI_COMMIT_TAG

release:docker-ui:
  stage: release
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - |
      IMAGE_BASE="${CI_REGISTRY_IMAGE:-fi-fhir}-ui"
      VERSION="${CI_COMMIT_TAG#v}"
      MAJOR="${VERSION%%.*}"
      MINOR="${VERSION%.*}"

      # Build UI image
      docker build \
        -t "${IMAGE_BASE}:${CI_COMMIT_TAG}" \
        -t "${IMAGE_BASE}:${VERSION}" \
        -t "${IMAGE_BASE}:${MINOR}" \
        -t "${IMAGE_BASE}:${MAJOR}" \
        -t "${IMAGE_BASE}:latest" \
        ./ui

      # Push all tags
      docker push "${IMAGE_BASE}:${CI_COMMIT_TAG}"
      docker push "${IMAGE_BASE}:${VERSION}"
      docker push "${IMAGE_BASE}:${MINOR}"
      docker push "${IMAGE_BASE}:${MAJOR}"
      docker push "${IMAGE_BASE}:latest"
  rules:
    - if: $CI_COMMIT_TAG

release:helm:
  stage: release
  image: alpine/helm:latest
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      sed -i "s/^version:.*/version: ${VERSION}/" deploy/helm/fi-fhir/Chart.yaml
      sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" deploy/helm/fi-fhir/Chart.yaml
    - helm package deploy/helm/fi-fhir/ -d .helm-releases/
    # Push to GitLab Package Registry (Helm)
    - |
      helm push .helm-releases/fi-fhir-*.tgz oci://${CI_REGISTRY}/helm || echo "Helm push to OCI registry (optional)"
  artifacts:
    paths:
      - .helm-releases/
    expire_in: never
  rules:
    - if: $CI_COMMIT_TAG

release:npm:
  stage: release
  <<: *node-image
  needs:
    - release:binaries
  script:
    - cd sdk/typescript
    - node --version
    - npm --version
    - |
      REGISTRY="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
      npm config set @fi-fhir:registry "${REGISTRY}"
      # Auth for GitLab npm registry
      npm config set "//${CI_SERVER_HOST}/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "${CI_JOB_TOKEN}"
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      echo "Publishing npm packages for version ${VERSION}"
      # Ensure SDK version matches tag
      test "$(node -p \"require('./package.json').version\")" = "${VERSION}"
    - |
      # Copy release binaries into platform packages (do not commit binaries)
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-darwin-arm64" "packages/fi-fhir-darwin-arm64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-darwin-amd64" "packages/fi-fhir-darwin-x64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-linux-arm64" "packages/fi-fhir-linux-arm64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-linux-amd64" "packages/fi-fhir-linux-x64/bin/fi-fhir"
      cp "${CI_PROJECT_DIR}/dist/fi-fhir-windows-amd64.exe" "packages/fi-fhir-win32-x64/bin/fi-fhir.exe"
      chmod +x "packages/fi-fhir-darwin-arm64/bin/fi-fhir" "packages/fi-fhir-darwin-x64/bin/fi-fhir" "packages/fi-fhir-linux-arm64/bin/fi-fhir" "packages/fi-fhir-linux-x64/bin/fi-fhir" || true
    - |
      # Publish platform binaries first
      for pkg in fi-fhir-darwin-arm64 fi-fhir-darwin-x64 fi-fhir-linux-arm64 fi-fhir-linux-x64 fi-fhir-win32-x64; do
        echo "Publishing @fi-fhir/${pkg}"
        cd "packages/${pkg}"
        test "$(node -p \"require('./package.json').version\")" = "${VERSION}"
        npm publish --access public --registry "${REGISTRY}"
        cd ../../
      done
    - |
      # Build + publish the SDK
      npm ci --no-audit --no-fund
      npm run clean
      npm run build
      node scripts/prepare-publish.js --version "${VERSION}"
      npm publish --access public --registry "${REGISTRY}"
  rules:
    - if: $CI_COMMIT_TAG

# =============================================================================
# GitLab Release
# =============================================================================

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - release:binaries
    - release:helm
  script:
    - echo "Creating GitLab release for ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release ${CI_COMMIT_TAG}"
    description: |
      ## fi-fhir ${CI_COMMIT_TAG}

      Healthcare integration library release.

      ### Binaries
      - Linux AMD64: `fi-fhir-linux-amd64`
      - Linux ARM64: `fi-fhir-linux-arm64`
      - macOS AMD64: `fi-fhir-darwin-amd64`
      - macOS ARM64: `fi-fhir-darwin-arm64`
      - Windows AMD64: `fi-fhir-windows-amd64.exe`

      ### Docker
      ```bash
      docker pull ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
      ```

      ### Helm
      ```bash
      helm pull oci://${CI_REGISTRY}/helm/fi-fhir --version ${CI_COMMIT_TAG#v}
      ```
    assets:
      links:
        - name: "fi-fhir-linux-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-linux-amd64?job=release:binaries"
          filepath: "/binaries/fi-fhir-linux-amd64"
          link_type: other
        - name: "fi-fhir-linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-linux-arm64?job=release:binaries"
          filepath: "/binaries/fi-fhir-linux-arm64"
          link_type: other
        - name: "fi-fhir-darwin-amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-darwin-amd64?job=release:binaries"
          filepath: "/binaries/fi-fhir-darwin-amd64"
          link_type: other
        - name: "fi-fhir-darwin-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-darwin-arm64?job=release:binaries"
          filepath: "/binaries/fi-fhir-darwin-arm64"
          link_type: other
        - name: "fi-fhir-windows-amd64.exe"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/fi-fhir-windows-amd64.exe?job=release:binaries"
          filepath: "/binaries/fi-fhir-windows-amd64.exe"
          link_type: other
        - name: "checksums.txt"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/checksums.txt?job=release:binaries"
          filepath: "/binaries/checksums.txt"
          link_type: other
        - name: "Helm Chart"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/browse/.helm-releases?job=release:helm"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG
