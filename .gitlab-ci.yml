  cache:
    key: ${CI_COMMIT_REF_SLUG}-sdk-typescript-npm
    paths:
      - sdk/typescript/.npm/
    policy: pull
  script:
    - cd sdk/typescript
    - npm config set cache "${CI_PROJECT_DIR}/sdk/typescript/.npm" --global
    - npm ci --no-audit --no-fund
    # Preserve the complete report, then propagate the HIGH/CRITICAL gate exit.
    - npm audit --audit-level=high --json > npm-audit.json || true
    - npm audit --audit-level=high
