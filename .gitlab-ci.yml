    - trivy image --input docker-ui-image.tar --exit-code 1 --severity CRITICAL
    - trivy image --input docker-ui-image.tar --exit-code 1 --severity HIGH --ignore-unfixed
  artifacts:
    reports:
      sast: trivy-ui-image-report.sarif
    paths:
      - trivy-ui-image-report.sarif
    when: always
