test:coverage-merge:
  stage: test
  <<: *go-image
  <<: *go-cache
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true per-job if pipeline-wide incident occurs (file incident ticket).
  needs:
    - job: test:unit
      optional: true
      artifacts: true
    - job: test:integration
      optional: true
      artifacts: true
  script:
    - apk add --no-cache git
    - mkdir -p coverage/merged
    # Convert unit test coverprofile to covdata format
    - |
      if [ -f coverage.out ]; then
        mkdir -p coverage/unit
        go tool covdata textfmt -i=coverage/unit -o=/dev/null 2>/dev/null || true
      fi
    # Merge whatever coverage directories are available
    - |
      dirs=""
      for d in coverage/unit coverage/integration; do
        if [ -d "$d" ] && [ "$(ls -A "$d" 2>/dev/null)" ]; then
          dirs="${dirs:+${dirs},}$d"
        fi
      done
      if [ -z "$dirs" ]; then
        echo "No coverage data to merge"
        exit 0
      fi
      go tool covdata merge -i="$dirs" -o=coverage/merged
      go tool covdata percent -i=coverage/merged
      go tool covdata textfmt -i=coverage/merged -o=coverage-merged.out
    # Generate Cobertura XML for MR visualization
    - go install github.com/boumenot/gocover-cobertura@latest
    - gocover-cobertura < coverage-merged.out > coverage-merged.xml || true
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔══════════════════════════════════════════════════════════════╗"
        echo "║  test:coverage-merge FAILED — this is a blocking merge gate. ║"
        echo "║                                                              ║"
        echo "║  Check: coverage artifacts in job output                     ║"
        echo "║  Common cause: upstream test:unit or test:integration failed ║"
        echo "║  Owner: Platform/CI — escalate in #ci-support                ║"
        echo "╚══════════════════════════════════════════════════════════════╝"
      fi
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage-merged.xml
    paths:
      - coverage-merged.out
      - coverage-merged.xml
      - coverage/merged/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

test:benchmark:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  variables:
    CGO_ENABLED: "1"
  # Gate owner: Workflow/Platform — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true if thresholds need tuning (file issue with proposed values).
  script:
    - apt-get update && apt-get install -y --no-install-recommends git build-essential && rm -rf /var/lib/apt/lists/*
    # Run benchmarks across all packages with benchmark tests
    - |
      if go test -bench=. -benchmem -run=^$ -count=1 ./internal/workflow/... ./pkg/terminology/... ./pkg/validate/... > benchmark.txt 2>&1; then
        cat benchmark.txt
      else
        benchmark_status=$?
        cat benchmark.txt
        exit "$benchmark_status"
      fi
    # Validate against the thresholds calibrated for this runner's CPU. The
    # k3s pool spans hardware differing by >5x, so bench-check picks the
    # profile matching the "cpu:" line in benchmark.txt. -confirm re-runs only
    # a violating benchmark before failing, which costs seconds and rules out
    # a transient contention burst on the node.
    - go run ./cmd/bench-check -confirm=3 benchmark.txt
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  test:benchmark FAILED — performance threshold exceeded. ║"
        echo "║                                                          ║"
        echo "║  The violation was re-measured and reproduced, so this   ║"
        echo "║  is a real regression rather than a slow CI node.        ║"
        echo "║                                                          ║"
        echo "║  Artifact: benchmark.txt (attached to this job)          ║"
        echo "║  Local: make bench-check                                 ║"
        echo "║  Thresholds: internal/workflow/benchmark_util.go         ║"
        echo "║  Recalibrate: bench-check -suggest <artifacts>           ║"
        echo "║  Owner: Workflow/Platform — escalate in #ci-support      ║"
        echo "╚═══════════════════════════════════════════════════════════╝"
      fi
  artifacts:
    paths:
      - benchmark.txt
    expire_in: 3 months
    when: always
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
      when: manual
    - when: never
  allow_failure: false # Blocking after truthful shared-runner threshold calibration

test:docs-status:
