        echo "test:phi-retention-purge FAILED — the retention purge proofs regressed."
        echo "Local: POSTGRES_TEST_URL=... make phi-retention-purge"
        echo "Docs: docs/operations/PHI-RETENTION.md, .loom/40-decisions.md"
        echo "Owner: Platform/Integration — escalate in #ci-support"
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
