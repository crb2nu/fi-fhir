include:
  - project: platform/gitops
    ref: main
    file:
      - /k3s/ci/caches/gitlab-ci-cache.yml

  - project: 'services/tech-radar'
    file: '/ci/radar.yml'
stages:
  - lint
  - test
  - security # Pre-build security (govulncheck, gosec, trivy fs, npm audit, license check)
  - build
  - scan # Post-build security (trivy image scans)
  - deploy
  - release
  - mirror # Push main + tags to the public GitHub mirror

variables:
  GO_VERSION: "1.26.5"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOVULNCHECK_VERSION: "v1.6.0"
  GOSEC_VERSION: "v2.27.1"
  GO_LICENSES_VERSION: "v1.6.0"
  NODE_VERSION: "22"
  NPM_VERSION: "10.9.3"
  NGINX_IMAGE_REF: "1.31.2-alpine-slim@sha256:dd722b8ee8794f3c273bfaf8b5351b0652a68ccd73c17e5f0d029857a58f25ef"
  CGO_ENABLED: "0"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  # GitLab dependency proxy is currently returning 429s from upstream pulls.
  # Use the Harbor pull-through cache for Docker Hub images instead.
  DOCKERHUB_CACHE_PREFIX: "registry.harbor.lan/dockerhub-cache"
  # Pin Trivy to a mirrored tag. Harbor does not currently serve `latest`.
  TRIVY_VERSION: "0.63.0"
  # CI includes set GOPROXY to Athens. When Athens is unhealthy, Go only falls back on 404/410 with ','.
  # Use '|' to fall back on any error (e.g. connection refused).
  GOPROXY: "http://athens.ci.svc.cluster.local:3000|https://proxy.golang.org|direct"
  # GitLab Kubernetes runner resources (avoid exceeding the ci-jobs namespace quota).
  # Many repos in this workspace set these explicitly because runner defaults can be very large.
  KUBERNETES_CPU_REQUEST: "200m"
  KUBERNETES_CPU_LIMIT: "1"
  KUBERNETES_MEMORY_REQUEST: "512Mi"
  KUBERNETES_MEMORY_LIMIT: "2Gi"
  KUBERNETES_HELPER_CPU_REQUEST: "50m"
  KUBERNETES_HELPER_CPU_LIMIT: "200m"
  KUBERNETES_HELPER_MEMORY_REQUEST: "128Mi"
  KUBERNETES_HELPER_MEMORY_LIMIT: "256Mi"
  # Service containers (e.g. docker:dind) can also inherit very large default limits.
  KUBERNETES_SERVICE_CPU_REQUEST: "200m"
  KUBERNETES_SERVICE_CPU_LIMIT: "1"
  KUBERNETES_SERVICE_MEMORY_REQUEST: "512Mi"
  KUBERNETES_SERVICE_MEMORY_LIMIT: "2Gi"

# Common change sets (use in rules:changes)
.go-changes: &go-changes
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - pkg/**/*
  - sdk/**/*
  - scripts/**/*
  - Makefile
  - Dockerfile
  - docker-compose.yaml
  - deploy/**/*
  - configs/**/*
  - testdata/**/*
  - .env.example
  - .gitlab-ci.yml
  - .golangci.yml
  - .golangci.yaml
  - .golangci.toml
  # GraphQL schema changes require backend rebuild for resolver codegen
  - internal/api/graphql/schema.graphql
  - internal/api/graphql/gqlgen.yml

.ui-changes: &ui-changes
  - ui/**/*
  - internal/api/graphql/schema.graphql
  - api/openapi.yaml
  - .gitlab-ci.yml
  - testdata/**/*

.sdk-ts-changes: &sdk-ts-changes
  - sdk/typescript/**/*
  - .gitlab-ci.yml

.runtime-verification-changes: &runtime-verification-changes
  - go.mod
  - go.sum
  - cmd/**/*
  - internal/**/*
  - pkg/**/*
  - sdk/**/*
  - ui/**/*
  - scripts/smoke-test.sh
  - scripts/smoke-test_test.sh
  - Dockerfile
  - docker-compose.yaml
  - deploy/**/*
  - configs/**/*
  - testdata/**/*
  - .env.example
  - api/openapi.yaml
  - .gitlab-ci.yml
  - .golangci.yml
  - .golangci.yaml
  - .golangci.toml

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# Cache Go modules across jobs (pull-only to avoid cache upload stalls if runner-cache backend is degraded)
.go-cache: &go-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-mod-${GO_VERSION}
    paths:
      - .go/pkg/mod/
      - .go/bin/
    policy: pull

# Pull-only cache (avoids cache upload stalls if runner-cache backend is degraded)
.go-cache-pull: &go-cache-pull
  cache:
    key: ${CI_COMMIT_REF_SLUG}-go-mod-${GO_VERSION}
    paths:
      - .go/pkg/mod/
      - .go/bin/
    policy: pull

# Default Go image
.go-image: &go-image
  image: ${DOCKERHUB_CACHE_PREFIX}/library/golang:${GO_VERSION}-alpine
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"

# Debian-based Go image for jobs that need `-race` and/or dockerized integration tests.
.go-image-debian: &go-image-debian
  image: ${DOCKERHUB_CACHE_PREFIX}/library/golang:${GO_VERSION}
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"

# Default Node image (for ui/ and OpenAPI/GraphQL client codegen)
.node-image: &node-image
  image: ${DOCKERHUB_CACHE_PREFIX}/library/node:${NODE_VERSION}-bookworm
  before_script:
    - node --version
    - npm --version
    # Work around occasional npm v10.9.4 failures in k8s CI ("Exit handler never called!").
    - npm i -g npm@${NPM_VERSION}
    - npm --version
    - npm config set cache "${CI_PROJECT_DIR}/ui/.npm" --global

# =============================================================================
# Lint Stage
# =============================================================================

lint:go:
  stage: lint
  image: ${DOCKERHUB_CACHE_PREFIX}/golangci/golangci-lint:${GOLANGCI_LINT_VERSION}-alpine
  <<: *go-cache
  variables:
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  before_script:
    - export GOPATH="${CI_PROJECT_DIR}/.go"
    - export GOCACHE="${CI_PROJECT_DIR}/.cache/go-build"
    - export PATH="${GOPATH}/bin:${PATH}"
    - mkdir -p "${GOPATH}/bin"
    - mkdir -p "${GOCACHE}"
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Rollback: set allow_failure: true per-job if pipeline-wide incident occurs (file incident ticket).
  script:
    - apk add --no-cache git
    - golangci-lint version
    - golangci-lint run --timeout=30m ./cmd/... ./internal/... ./pkg/... ./scripts/... ./sdk/...
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        echo ""
        echo "╔══════════════════════════════════════════════════════════╗"
        echo "║  lint:go FAILED — this is a blocking merge gate.        ║"
        echo "║                                                         ║"
        echo "║  Fix: run 'make lint' locally to reproduce.             ║"
        echo "║  Config: .golangci.yml (exclusions and enabled linters) ║"
        echo "║  Owner: Platform/CI — escalate in #ci-support           ║"
        echo "╚══════════════════════════════════════════════════════════╝"
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:fmt:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    # Check formatting on source directories only (not module cache)
    - |
      unformatted=""
      for dir in cmd internal pkg sdk; do
        if [ -d "$dir" ]; then
          found=$(gofmt -l "$dir" 2>/dev/null || true)
          if [ -n "$found" ]; then
            unformatted="${unformatted}${found}"$'\n'
          fi
        fi
      done
      if [ -n "$unformatted" ]; then
        echo "The following files are not formatted:"
        echo "$unformatted"
        echo ""
        echo "Run 'go fmt ./...' to fix"
        echo "$unformatted" | xargs gofmt -d
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:vet:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - go vet ./...
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

lint:gqlgen:
  stage: lint
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - cd internal/api/graphql
    - go run github.com/99designs/gqlgen generate --config gqlgen.yml
    - git diff --exit-code -- .
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - internal/api/graphql/**/*
        - ui/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - internal/api/graphql/**/*
        - ui/**/*
    - when: never

lint:ui:
  stage: lint
  <<: *node-image
  # The Vite production build is the memory-heaviest step in this pipeline.
  # Node derives its default old-space cap from the cgroup memory limit (~half),
  # so the global 2Gi default silently capped the V8 heap at 1048Mi while the
  # build peaked at 1040Mi -- 99% of the ceiling, which tipped into
  # "FATAL ERROR: Reached heap limit" on ~20% of runs. Raising the limit alone
  # would fix it only implicitly, so the heap budget is stated explicitly below.
  # Measured at these settings: V8 peak 1201Mi/3120Mi cap, container peak 1717Mi.
  variables:
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    NODE_OPTIONS: "--max-old-space-size=3072"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-ui-npm
    paths:
      - ui/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd ui
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run lint:css # BLOCKING token-drift guardrail (Slice 1): fails CI on any raw hex in component <style> blocks
    - npm run codegen:check
    - npm run check
    - npm run typecheck
    - grep -F -q 'location = /api {' nginx/default.conf.template
    - grep -F -q 'location ^~ /api/ {' nginx/default.conf.template
    - VITE_FI_FHIR_PREVIEW_INTEGRATION_ID=ci-preview-alias npm run build
    - grep -R -F -q 'ci-preview-alias' build/_app/immutable
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *ui-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *ui-changes
    - when: never

lint:sdk-typescript:
  stage: lint
  <<: *node-image
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sdk-typescript-npm
    paths:
      - sdk/typescript/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd sdk/typescript
    - npm config set cache "${CI_PROJECT_DIR}/sdk/typescript/.npm" --global
    - npm ci --no-audit --no-fund
    - npm run typecheck
    - npm run build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sdk-ts-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *sdk-ts-changes
    - when: never

lint:helm:
  stage: lint
  image: ${DOCKERHUB_CACHE_PREFIX}/dtzar/helm-kubectl:4.1.1
  script:
    - helm lint deploy/helm/fi-fhir/
    - helm template fi-fhir deploy/helm/fi-fhir/ > /dev/null
    - sh scripts/validate-kustomize-preview.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - deploy/helm/**/*

lint:docs:
  stage: lint
  <<: *go-image
  # Gate owner: Platform/Docs — escalate via MR comment or #ci-support channel.
  # Promoted to blocking 2026-08-08 (Lane E). Green proof: 33/33 consecutive
  # successes on main across pipelines 18521..22333 (2026-07-13..2026-08-07).
  # scripts/validate-docs.sh is deterministic (STATUS.md component coverage,
  # CHANGELOG [Unreleased], AGENTS.md stale patterns) with no external services.
  # Rollback: set allow_failure: true and file an incident ticket.
  allow_failure: false
  script:
    - apk add --no-cache git bash
    - bash scripts/validate-docs.sh
    # Worklog entries are one file per entry so parallel branches stop
    # conflicting on a shared append-only file. This rejects a filename that
    # breaks date ordering, and a second entry appended into an existing file —
    # the habit that would put the conflict back.
    - bash scripts/worklog.sh check
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - docs/**/*
        - internal/**/*
        - pkg/**/*
        - cmd/**/*
        - AGENTS.md
        - CHANGELOG.md
        - scripts/validate-docs.sh
        - scripts/docs-status.sh
        - scripts/worklog.sh
        - .loom/worklog/**/*
        - .loom/50-worklog.md
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - internal/**/*
        - pkg/**/*
        - cmd/**/*
        - AGENTS.md
        - CHANGELOG.md
        - scripts/validate-docs.sh
        - scripts/docs-status.sh
        - scripts/worklog.sh
        - .loom/worklog/**/*
        - .loom/50-worklog.md
    - when: never

lint:contracts:
  stage: lint
  <<: *go-image
  <<: *go-cache
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Promoted to blocking 2026-03-04 (M0 exit criterion). Rollback: set allow_failure: true if needed.
  script:
    - apk add --no-cache git
    - go run ./scripts/check_event_contracts.go --root . --report docs/planning/API-CONTRACT-MATRIX.md
    - go run ./scripts/check_event_contracts.go --root . --strict
  artifacts:
    when: always
    paths:
      - docs/planning/API-CONTRACT-MATRIX.md
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - pkg/events/events.go
        - internal/api/graphql/schema.graphql
        - api/openapi.yaml
        - scripts/check_event_contracts.go
        - Makefile
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pkg/events/events.go
        - internal/api/graphql/schema.graphql
        - api/openapi.yaml
        - scripts/check_event_contracts.go
        - Makefile
        - .gitlab-ci.yml
    - when: never

# =============================================================================
# Test Stage
# =============================================================================

test:unit:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  variables:
    CGO_ENABLED: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential && rm -rf /var/lib/apt/lists/*
    - go install github.com/boumenot/gocover-cobertura@latest
    - mkdir -p coverage/unit
    - |
      set +e
      go test -race -coverprofile=coverage.out -covermode=atomic -cover ./... \
        -args -test.gocoverdir=$PWD/coverage/unit
      status=$?

      if [ -f coverage.out ]; then
        if [ "$status" -eq 0 ]; then
          go tool cover -func=coverage.out || true
        fi
        gocover-cobertura < coverage.out > coverage.xml || true
      fi

      if [ ! -f coverage.xml ]; then
        echo '<coverage line-rate="0" branch-rate="0" lines-covered="0" lines-valid="0" branches-covered="0" branches-valid="0" complexity="0" version="0" timestamp="0"></coverage>' > coverage.xml
      fi

      exit $status
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.out
      - coverage.xml
      - coverage/unit/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *go-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *go-changes
    - when: never

test:binary:
  stage: test
  <<: *go-image
  <<: *go-cache
  script:
    - apk add --no-cache git
    - mkdir -p bin
    - go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}" -o bin/fi-fhir ./cmd/fi-fhir
    - ./bin/fi-fhir version
  artifacts:
    paths:
      - bin/fi-fhir
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *runtime-verification-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *runtime-verification-changes
    - when: never

test:sdk-typescript:
  stage: test
  <<: *node-image
  needs:
    - job: test:binary
      artifacts: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}-sdk-typescript-npm
    paths:
      - sdk/typescript/.npm/
  script:
    - apt-get update && apt-get install -y --no-install-recommends ca-certificates && rm -rf /var/lib/apt/lists/*
    - cd sdk/typescript
    - npm config set cache "${CI_PROJECT_DIR}/sdk/typescript/.npm" --global
    - export FI_FHIR_PATH="${CI_PROJECT_DIR}/bin/fi-fhir"
    - npm ci --no-audit --no-fund
    - npm test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *sdk-ts-changes
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *sdk-ts-changes
    - when: never

test:integration:
  stage: test
  <<: *go-image-debian
  <<: *go-cache
  # Gate owner: Platform/CI — escalate via MR comment or #ci-support channel.
  # Promoted to blocking 2026-08-08 (Lane E). Green proof: 24/24 consecutive
  # successes on main across pipelines 18521..22333 (2026-07-13..2026-08-07),
  # plus a local run of both script steps against real PostgreSQL 16 and MinIO.
  # Rollback: set allow_failure: true and file an incident ticket.
  services:
    - name: ${DOCKERHUB_CACHE_PREFIX}/library/postgres:16-alpine
      alias: postgres
    # `minio/minio` ships CMD ["minio"], which prints usage and exits — the service
    # container never listened, so every setupTestInfra() test silently skipped
    # (t.Skipf on "minio not ready"). The explicit `server` command is required.
    # Proof: with MinIO unreachable ./cmd/fi-fhir/... reports 73.2% coverage, the
    # exact figure job 218601 logged; with MinIO live it reports 75.9%.
    - name: ${DOCKERHUB_CACHE_PREFIX}/minio/minio:latest
      alias: minio
      command: ["server", "/data", "--console-address", ":9001"]
  variables:
    CGO_ENABLED: "1"
    KUBERNETES_CPU_LIMIT: "2"
    KUBERNETES_MEMORY_LIMIT: "4Gi"
    # PostgreSQL service container
    POSTGRES_DB: fi_fhir_test
    POSTGRES_USER: testuser
    POSTGRES_PASSWORD: testpass
    POSTGRES_HOST_AUTH_METHOD: trust
    FI_FHIR_DATABASE_URL: "postgres://testuser:testpass@postgres:5432/fi_fhir_test?sslmode=disable"
    FI_FHIR_TERMINOLOGY_DB_URL: "postgres://testuser:testpass@postgres:5432/fi_fhir_test?sslmode=disable"
    # pkg/terminology/db gets its OWN database, created below. Both it and
    # ./cmd/fi-fhir/... reset the `terminology` schema, so sharing one database
    # made this package's schema DDL run against rows left behind by the cmd
    # suite. That is Lane D's documented isolation recommendation
    # (.loom/24-parallel-execution-specs.md) and it is now load-bearing: see the
    # -timeout note on the second script step.
    POSTGRES_TEST_URL: "postgres://testuser:testpass@postgres:5432/fi_fhir_terms_test?sslmode=disable"
    TERMINOLOGY_TEST_DB: fi_fhir_terms_test
    # MinIO service container. MINIO_ROOT_USER/PASSWORD are read by minio/minio;
    # the test bucket is created by ensureMinioBucket() in
    # cmd/fi-fhir/integration_helpers_test.go, not by an image-level auto-provision
    # env var (MINIO_DEFAULT_BUCKETS is a bitnami-only convention and was inert here).
    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin
    MINIO_ENDPOINT: "minio:9000"
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin
    MINIO_USE_SSL: "false"
    MINIO_BUCKET: "terminology"
    # Also set FI_FHIR_MINIO_* variants for cli_integration_test.go helpers
    FI_FHIR_MINIO_ENDPOINT: "minio:9000"
    FI_FHIR_MINIO_ACCESS_KEY: minioadmin
    FI_FHIR_MINIO_SECRET_KEY: minioadmin
  script:
    - apt-get update && apt-get install -y --no-install-recommends git ca-certificates build-essential postgresql-client && rm -rf /var/lib/apt/lists/*
    - mkdir -p coverage/integration
    # Provision the isolated terminology database before either step runs.
    - |
      for i in $(seq 1 60); do
        pg_isready -h postgres -p 5432 -U testuser && break
        echo "waiting for postgres ($i/60)"; sleep 2
      done
      psql "postgres://testuser:testpass@postgres:5432/fi_fhir_test?sslmode=disable" \
        -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${TERMINOLOGY_TEST_DB} OWNER testuser"
    - go test -tags=integration -cover -covermode=atomic -timeout=300s ./cmd/fi-fhir/...
      -args -test.gocoverdir=$PWD/coverage/integration
    # Terminology DB integration tests run second, in their OWN database
    # (POSTGRES_TEST_URL -> $TERMINOLOGY_TEST_DB), avoiding Docker-in-Docker.
    #
    # -timeout: this package needed 204.7s of the old 300s budget on main (job
    # 218601) while sharing a database with the cmd suite that was, at the time,
    # skipping all its MinIO-backed tests. Once those tests actually ran, the
    # shared database pushed this package past 300s and it panicked mid-run
    # (jobs 220075 / 220246, ~47.5% coverage reached). Separate databases remove
    # the contamination; the larger budget removes the shared-runner cliff that
    # left only 32% headroom. This is a slow-suite allowance, not a correctness
    # gate — a genuine hang still fails the job, just later.
    - go test -tags=integration -p 1 -cover -covermode=atomic -timeout=900s ./pkg/terminology/db/
      -args -test.gocoverdir=$PWD/coverage/integration
    - go tool covdata percent -i=coverage/integration
  artifacts:
    paths:
      - coverage/integration/
    expire_in: 1 week
  rules:
