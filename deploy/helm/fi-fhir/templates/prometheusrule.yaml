{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "fi-fhir.fullname" . }}
  labels:
    {{- include "fi-fhir.labels" . | nindent 4 }}
spec:
  groups:
    - name: fi-fhir
      rules:
        {{- toYaml .Values.prometheusRule.rules | nindent 8 }}
{{- end }}
