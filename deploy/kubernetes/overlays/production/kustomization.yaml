apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fi-fhir-prod

namePrefix: prod-

resources:
  - ../../base

# Production-specific patches
patches:
  # Increase replicas for production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: fi-fhir

  # Increase resource limits for production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
    target:
      kind: Deployment
      name: fi-fhir

  # Update log level for production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: FI_FHIR_SERVER_HOST
            value: "0.0.0.0"
          - name: FI_FHIR_SERVER_PORT
            value: "8080"
          - name: FI_FHIR_WORKFLOW_CONFIG_PATH
            value: "/app/config/workflow.yaml"
          - name: FI_FHIR_LOG_LEVEL
            value: "info"
          - name: FI_FHIR_LOG_FORMAT
            value: "json"
          - name: FI_FHIR_METRICS_ENABLED
            value: "true"
          - name: FI_FHIR_TRACING_ENABLED
            value: "true"
          - name: FI_FHIR_TRACING_SAMPLER
            value: "0.01"
    target:
      kind: Deployment
      name: fi-fhir

  # Update ingress hostname for production
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fi-fhir.prod.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: fi-fhir.prod.example.com
    target:
      kind: Ingress
      name: fi-fhir

# Production image
images:
  - name: fi-fhir
    newName: your-registry.example.com/fi-fhir
    newTag: v1.0.0

# Common labels for production
commonLabels:
  environment: production
