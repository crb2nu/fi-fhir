apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fi-fhir-prod

namePrefix: prod-

resources:
  - ../../base

# Production-specific patches
patches:
  # Increase replicas for production
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: fi-fhir

  # Increase resource limits for production
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
    target:
      kind: Deployment
      name: fi-fhir

  # Override selected production values without replacing the base env array.
  # The strategic merge key is each env entry's name, so preview auth and
  # secret-backed database/queue settings remain present.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fi-fhir
      spec:
        template:
          spec:
            containers:
              - name: fi-fhir
                env:
                  - name: FI_FHIR_GRAPHQL_ALLOWED_ORIGINS
                    value: "https://fi-fhir.prod.example.com"
                  - name: FI_FHIR_LOG_LEVEL
                    value: "info"
                  # FI_FHIR_TRACING_SAMPLER removed by slice 4.4a: it is
                  # NOT IMPLEMENTED — parsed and validated, consumed by nothing.
                  # A production overlay tuning a sampling rate for a tracer
                  # that does not exist is the most misleading form of the
                  # façade. The exporter is 4.4d.
    target:
      kind: Deployment
      name: fi-fhir

  # Update ingress hostname for production
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: fi-fhir.prod.example.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: fi-fhir.prod.example.com
    target:
      kind: Ingress
      name: fi-fhir

# Production image
images:
  - name: fi-fhir
    newName: your-registry.example.com/fi-fhir
    newTag: v1.0.0

# Common labels for production
commonLabels:
  environment: production
