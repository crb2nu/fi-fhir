apiVersion: v1
kind: ConfigMap
metadata:
  name: fi-fhir-config
  namespace: fi-fhir
  labels:
    app.kubernetes.io/name: fi-fhir
    app.kubernetes.io/component: config
data:
  # Application configuration
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      shutdown_timeout: 10s

    workflow:
      config_path: /app/config/workflow.yaml
      max_concurrency: 10
      action_timeout: 30s
      retry_max_attempts: 3
      dlq_enabled: true

    database:
      driver: postgres
      ssl_mode: require
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: 5m

    queue:
      driver: kafka
      tls: true

    observability:
      metrics_enabled: true
      metrics_endpoint: /metrics
      metrics_port: 9090
      tracing_enabled: true
      tracing_sampler: 0.1
      log_level: info
      log_format: json

    secrets:
      provider: file
      options:
        path: /var/run/secrets/fi-fhir

  # Sample workflow configuration
  workflow.yaml: |
    workflow:
      name: production-routing
      version: "1.0"

      routes:
        - name: patient_events_to_fhir
          filter:
            event_type: [patient_admit, patient_update, patient_discharge]
          actions:
            - type: log
              level: info
              message: "Processing patient event: {{.Type}}"
            # Add FHIR action when server is configured
            # - type: fhir
            #   endpoint: ${FHIR_SERVER_URL}
            #   resource: Patient

        - name: lab_results_to_fhir
          filter:
            event_type: lab_result
          actions:
            - type: log
              level: info
              message: "Processing lab result: {{.Test.Code}}"
