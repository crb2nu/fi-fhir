apiVersion: apps/v1
kind: Deployment
metadata:
  name: fi-fhir
  namespace: fi-fhir
  labels:
    app.kubernetes.io/name: fi-fhir
    app.kubernetes.io/component: server
spec:
  replicas: 2
  # Declared rather than inherited. Without this block Kubernetes applies its
  # default 25%/25%, which on two replicas rounds to maxUnavailable: 1 — so a
  # one-version rolling upgrade runs on a single replica for its whole
  # duration, and the PodDisruptionBudget's minAvailable: 1 does not prevent it
  # (a PDB governs voluntary evictions, not a Deployment's own rollout). Budget
  # 6 asks for a rolling upgrade that preserves resumable work; measuring the
  # defaults would be measuring Kubernetes, not this product.
  #
  # maxUnavailable: 0 keeps both replicas serving throughout; maxSurge: 1 pays
  # for that with one extra pod. The app holds no ReadWriteOnce volume, so a
  # surge pod always schedules — the constraint that forces Recreate on
  # postgres.yaml does not apply here.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # A pod counts as available only after it has been Ready for 15 seconds. The
  # readiness probe checks dependencies (/ready is 503 while the submission or
  # terminology database is unreachable), so a pod that flaps Ready-then-503
  # would otherwise let the rollout advance and take the healthy replica with
  # it. Fifteen seconds is longer than one readiness period (10s).
  minReadySeconds: 15
  selector:
    matchLabels:
      app.kubernetes.io/name: fi-fhir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fi-fhir
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: fi-fhir
      # Endpoint removal and SIGTERM race: kube-proxy and any ingress rewrite
      # their rules asynchronously after the pod leaves the Service, so a pod
      # that stops accepting the moment it is told to terminate refuses
      # requests that were already routed to it. The preStop below holds the
      # pod open while that propagates.
      #
      # The grace period must exceed preStop + the server's own shutdown
      # budget. FI_FHIR_SERVER_SHUTDOWN_TIMEOUT defaults to 10s, and the
      # background components (delivery, batch, MLLP, retention) drain after
      # the HTTP server; 60s leaves room for a delivery attempt in flight
      # rather than SIGKILLing one mid-publish, which would leave a leased
      # attempt to expire and redeliver.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

      containers:
        - name: fi-fhir
          image: fi-fhir:latest
          imagePullPolicy: IfNotPresent
          command: ["/fi-fhir"]
          args: ["serve", "--no-playground", "--no-introspection"]

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          env:
            # Server configuration
            - name: FI_FHIR_SERVER_HOST
              value: "0.0.0.0"
            - name: FI_FHIR_SERVER_PORT
              value: "8080"

            # Authenticated stateless integration preview
            - name: FI_FHIR_DEPLOYMENT_TENANT_ID
              value: "tenant-a"
            - name: FI_FHIR_GRAPHQL_PRINCIPAL_ID
              value: "fi-fhir-operator"
            - name: FI_FHIR_GRAPHQL_ROLES
              value: "integration:preview"
            - name: FI_FHIR_GRAPHQL_ALLOWED_ORIGINS
              value: "https://fi-fhir.example.com"
            # Optional single-tenant LAN access. Never include pod/service CIDRs.
            - name: FI_FHIR_GRAPHQL_TRUSTED_CIDRS
              value: ""
            - name: FI_FHIR_GRAPHQL_BEARER_TOKEN_FILE
              value: "/var/run/secrets/fi-fhir/GRAPHQL_BEARER_TOKEN"
            - name: FI_FHIR_INTEGRATION_REGISTRY_PATH
              value: "/app/config/registry.json"

            # Config file paths
            - name: FI_FHIR_WORKFLOW_CONFIG_PATH
              value: "/app/config/workflow.yaml"

            # Database configuration from secret
            - name: FI_FHIR_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-secrets
                  key: DATABASE_HOST
            - name: FI_FHIR_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-secrets
                  key: DATABASE_PORT
            - name: FI_FHIR_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-secrets
                  key: DATABASE_NAME
            - name: FI_FHIR_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-secrets
                  key: DATABASE_USERNAME
            - name: FI_FHIR_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-secrets
                  key: DATABASE_PASSWORD

            # Queue configuration from secret
            - name: FI_FHIR_QUEUE_BROKERS
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-secrets
                  key: QUEUE_BROKERS

            # Observability. Port and path here must match the "metrics"
            # containerPort above and the prometheus.io/* scrape annotations,
            # or the scrape config lies about where /metrics actually is.
            - name: FI_FHIR_METRICS_ENABLED
              value: "true"
            - name: FI_FHIR_METRICS_PORT
              value: "9090"
            - name: FI_FHIR_METRICS_ENDPOINT
              value: "/metrics"
            - name: FI_FHIR_LOG_LEVEL
              value: "info"
            - name: FI_FHIR_LOG_FORMAT
              value: "json"
            # FI_FHIR_TRACING_* is NOT IMPLEMENTED: parsed and validated by
            # pkg/config, but no OpenTelemetry exporter consumes it in the serve
            # path. Setting it here told operators the deployment exported
            # traces, which it never did. Removed by slice 4.4a; the exporter is
            # 4.4d. scripts/check-runtime-config.sh enforces this.

          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: secrets
              mountPath: /var/run/secrets/fi-fhir
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Liveness: GET /health on the main HTTP port. This proves the
          # process can still accept connections and answer a request end to
          # end. It does not prove any dependency is reachable — /health is
          # process-only and returns 200 unless the process itself is dead —
          # so a wedged database pool never triggers a restart loop here.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness: GET /ready on the main HTTP port. This proves the
          # readiness components (submission DB, terminology DB, and whatever
          # else this replica depends on) are actually reachable: it returns
          # 503 when any of them is unhealthy, which pulls the pod out of the
          # Service until the dependency recovers.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # The sleep handler, not exec. Dockerfile:27 builds this image FROM
          # gcr.io/distroless/static-debian12:nonroot — there is no shell and no
          # /bin/sleep, so an exec preStop has nothing to run. `sleep` is a
          # first-class lifecycle action (PodLifecycleSleepAction, GA well
          # before the 1.36 target) and is the only handler this image can use
          # without adding a binary to a distroless static image, which the
          # 5.1 confinement ruling forbids for a different reason but with the
          # same logic.
          lifecycle:
            preStop:
              sleep:
                seconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: config
          configMap:
            name: fi-fhir-config
        - name: secrets
          secret:
            secretName: fi-fhir-secrets
            defaultMode: 0440

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: fi-fhir
                topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fi-fhir
