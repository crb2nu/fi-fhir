apiVersion: v1
kind: Secret
metadata:
  name: fi-fhir-secrets
  namespace: fi-fhir
  labels:
    app.kubernetes.io/name: fi-fhir
    app.kubernetes.io/component: secrets
type: Opaque
# Note: In production, use SealedSecrets, External Secrets Operator, or Vault
# These are placeholder values - replace with actual secrets
stringData:
  # Database credentials
  DATABASE_HOST: "postgres.database.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "fi_fhir"
  DATABASE_USERNAME: "fi_fhir"
  DATABASE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Queue credentials
  QUEUE_BROKERS: "kafka.messaging.svc.cluster.local:9092"
  QUEUE_USERNAME: ""
  QUEUE_PASSWORD: ""

  # FHIR server credentials (if using OAuth2)
  FHIR_BASE_URL: "https://fhir.example.com/r4"
  FHIR_CLIENT_ID: ""
  FHIR_CLIENT_SECRET: ""
  FHIR_TOKEN_URL: ""
