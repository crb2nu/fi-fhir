apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fi-fhir-postgres-data
  namespace: fi-fhir
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fi-fhir
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fi-fhir
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fi-fhir
spec:
  replicas: 1
  # A single replica bound to a ReadWriteOnce PVC cannot survive the default
  # RollingUpdate strategy. Kubernetes would schedule a surge pod, that pod
  # would fail to mount a volume the outgoing pod still holds, and the rollout
  # would wedge with the old pod running and the new one Pending — on an image
  # bump, a resource change, or any other template edit. Recreate terminates
  # the old pod first and accepts a short outage instead, which is the honest
  # trade for a single-writer database on a single-attach volume.
  #
  # Why not a StatefulSet: it is the right shape for a database, and it is not
  # a drop-in change here. A StatefulSet owns its volumes through a
  # volumeClaimTemplate, so it would create `postgres-data-postgres-0` and
  # leave the existing `fi-fhir-postgres-data` PVC — with its data — orphaned.
  # That is a data-migration procedure, not a manifest edit, and this manifest
  # is a development convenience: the WAL/PITR posture decision
  # (.loom/40-decisions.md, 2026-08-09) records that a production deployment
  # uses a managed service or an operator, both of which own their own topology.
  # Slice 4.4c fixes the wedge and declines to invent the migration.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: fi-fhir
    spec:
      # PostgreSQL treats SIGTERM as a SMART shutdown: it waits for every client
      # to disconnect and does not stop while a connection is open. Kubernetes
      # sends SIGTERM to PID 1, waits out the grace period, then SIGKILLs — so
      # without the preStop below, an upgrade with a live pool ends in an
      # unclean stop and crash recovery on the next start. `pg_ctl -m fast`
      # disconnects clients, rolls back their transactions, and checkpoints.
      # The grace period is longer than the preStop's own wait so the kill
      # cannot land mid-checkpoint.
      terminationGracePeriodSeconds: 90
      nodeSelector:
        node.flexstack.io/class: services
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "listen_addresses=*"
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-postgres
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: fi-fhir-postgres
                  key: database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          lifecycle:
            preStop:
              exec:
                command:
                  - pg_ctl
                  - -D
                  - /var/lib/postgresql/data/pgdata
                  - -m
                  - fast
                  - -w
                  - -t
                  - "60"
                  - stop
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: fi-fhir-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fi-fhir
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fi-fhir
spec:
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    app: postgres
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  namespace: fi-fhir
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: fi-fhir
spec:
  type: LoadBalancer
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    app: postgres
