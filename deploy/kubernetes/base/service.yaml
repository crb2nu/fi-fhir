apiVersion: v1
kind: Service
metadata:
  name: fi-fhir
  namespace: fi-fhir
  labels:
    app.kubernetes.io/name: fi-fhir
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fi-fhir
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP

---
# Service for metrics scraping by Prometheus
apiVersion: v1
kind: Service
metadata:
  name: fi-fhir-metrics
  namespace: fi-fhir
  labels:
    app.kubernetes.io/name: fi-fhir
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fi-fhir
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
