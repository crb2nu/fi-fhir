source_profile:
  id: inferred_adt_a01
  name: Inferred ADT A01
  version: 0.1.0
  hl7v2:
    default_version: "2.5"
    timezone: UTC
    encoding:
      charset_default: UTF-8
      charset_detection: true
      line_ending_mode: tolerant
    tolerate:
      missing_segments:
        - GT1
        - NK1
        - OBR
        - PD1
      nte_anywhere: true
      extra_components: true
      unknown_segments: true
      non_standard_delimiters: false
    datatypes:
      xcn_component_count: flexible
      cx_component_count: flexible
      xpn_component_count: flexible
    event_classification:
      adt_a01:
        default: patient_admit
        rules:
          - condition: PV1.2 == 'I'
            event: inpatient_admit
          - condition: PV1.2 == 'O'
            event: outpatient_registration
          - condition: PV1.2 == 'E'
            event: emergency_registration
          - condition: PV1.2 == 'P'
            event: preadmit
          - condition: PV1.2 == 'R'
            event: recurring_patient
  z_segments:
    preserve_raw: true
    mappings: {}
